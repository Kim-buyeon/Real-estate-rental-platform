name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 러너에는 .env 가 없어 application.yml 의 ${JWT_SECRET} 이 풀리지 않는다.
      # 시험 전용 값이며 실제 토큰 서명에 쓰이지 않는다. 비밀이 아니므로 Secret 으로 두지 않는다.
      # HS256 최소 길이(256비트)를 넘겨야 기동한다.
      JWT_SECRET: ci-only-dummy-signing-key-not-used-in-any-environment
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
