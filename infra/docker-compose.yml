# 운영 구성 — APP-01 노드. 시스템 구성서 2 · 3장, 운영 절차서 3 · 4장.
# 이 파일이 있는 infra/ 에서 실행한다. 값은 같은 폴더의 .env 에서 읽는다(루트 .env.example 과 같은 이름).
#
#   cd infra && docker compose up -d
#
# 파일 이름이 docker-compose.yml 인 이유: 배포 스크립트(운영 절차서 3.2)가 -f 없이 infra/ 에서 docker compose 를 부른다.
# 다른 이름이면 Compose 가 상위 폴더로 올라가 루트의 로컬 구성을 집는다.
#
# 1차 배포(EC2)에서는 PostgreSQL 도 이 노드에 둔다. DB 노드 분리 · 복제(INF-03)에서 postgres 서비스를 빼고
# DB_HOST 를 DB-01 사설 IP 로 바꾼다 — 로드맵 6주차.
#
# 이미지 — 레지스트리 파이프라인(INF-02) 전에는 로컬 빌드 이미지를 쓴다(운영 절차서 3.2 전제).
# APP_IMAGE · WEB_IMAGE 로 덮으면 레지스트리 이미지가 된다.
# 로컬 구성(루트, name: rental)과 컨테이너 · 볼륨 이름이 겹치지 않게 한다
name: rental-prod

# 컨테이너 로그 회전 — 서버 운영 기반 설계서 8장이 「컨테이너 로그 — 크기·개수 상한」을 요구하는데 값이 10장에서 미확정이라
# 지금까지 상한이 없었다. json-file 기본값은 무제한이라 로그만으로 노드 디스크가 찬다
# (볼륨 크기는 서버 운영 기반 설계서 4.2 에서 미확정이다 — 상한을 두는 근거는 크기가 아니라 증가가 멈추지 않는다는 것).
# 서비스 6개(nginx · app-1 · app-2 · web · redis · postgres) × 10m × 3개 = 약 180 MB 가 컨테이너 로그 전체의 상한이다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 메모리 상한 — 노드는 t3.small(2 vCPU · 2 GiB)이고 앱 2슬롯 · PostgreSQL · Redis · web · nginx 가 한 노드에 모두 올라간다.
# 상한이 없으면 커널 OOM Killer 가 가장 큰 RSS(=PostgreSQL 또는 JVM)를 골라 죽인다. 서비스마다 상한을 주어
# 초과하는 쪽만 죽게 한다.
#
# 기준 총량은 2048 이 아니라 **1909 MiB** 다 — 커널 · 펌웨어 예약분을 뺀 값으로, 노드에서 free -m 으로 실측했다
# (2026-09-23 17:10). 상한은 그 시점의 컨테이너별 실사용(RSS)에서 역산했고, 반영 뒤 다시 쟀다.
#
#   서비스        mem_limit   상한 전   반영 후   조회 중   상한의 근거
#   app-1             600m    454 MiB   424 MiB   445 MiB   힙 360m(60%) + non-heap 240m
#   app-2             600m    455 MiB   423 MiB   446 MiB   위와 같음
#   postgres          256m     89 MiB    56 MiB    87 MiB   최악값은 담지 못한다 — postgres 서비스 주석
#   redis             112m    4.6 MiB   3.6 MiB   4.0 MiB   maxmemory 64mb + 단편화 · AOF 버퍼 · 출력 버퍼
#   nginx              48m    3.7 MiB   3.4 MiB   3.4 MiB   SSE 는 proxy_buffering off 라 연결당 버퍼 없음
#   web                32m    4.2 MiB   3.4 MiB   3.4 MiB   정적 파일 서빙 nginx
#   ──────────────────────────────────────────────────────
#   합계             1648m   1011 MiB   913 MiB   989 MiB
#
#   「상한 전」은 상한이 없던 구성(2026-09-23 17:10), 나머지 둘은 이 상한을 반영한 뒤다(18:25).
#   **「조회 중」은 부하가 아니다** — smoke.sh 의 대표 조회 60건 직후 값이다. 부하를 준 상태의 수치는
#   부하 시험(INF-06, 차기 범위)에서 처음 나온다.
#   힙 천장을 478 → 360 으로 내리고 shared_buffers 를 128 → 64MB 로 줄인 뒤 앱과 PostgreSQL 이 함께 줄었다.
#   **조회 중에도 앱이 상한의 74% 다** — 520m 이었다면 86% 였다.
#
# **상한의 합이 노드 가용 메모리를 넘는다. 의도한 것이고, 대가가 있다.**
#   1909(총량) − 264(OS · dockerd 실측) = 1645 이고 상한 합 1648 은 그것을 넘는다.
#   mem_limit 은 **예약이 아니라 상한**이라 쓰지 않는 몫을 붙들지 않는다. 평시 실사용 합이 913 이므로
#   평시에는 여유가 있고, 상한의 목적은 총합을 보장하는 것이 아니라 **폭주하는 하나를 가두어 나머지를
#   지키는 것**이다.
#
#   대가는 이것이다 — 모든 컨테이너가 자기 상한 안에 있으면서 노드 메모리가 마르는 상태가 존재한다.
#   그때는 cgroup OOM 이 아니라 **전역 OOM killer 가 oom_score 로 고른다.** 이 주석 맨 앞이 막겠다고
#   한 바로 그 상황이다. 그 구간을 없애려면 합을 1645 아래로 내려야 하는데, 그러려면 앱 슬롯이나
#   PostgreSQL 중 하나가 실측에 더 가깝게 조여진다. **둘 다 담을 수 있는 배분은 이 노드 크기에 없다.**
#
#   그리고 264 는 측정값이지 상한이 아니다. journald 회전 · sshd 세션 · dnf-automatic · 논리 백업
#   스크립트가 돌면 늘고, **늘어난 만큼 초과폭이 그대로 커진다.**
#
#   page cache 도 노드 전체의 남은 몫이 아니다 — cgroup 은 파일 캐시를 그것을 처음 올린 컨테이너에
#   과금한다. PostgreSQL 의 데이터 파일 캐시는 자기 상한 256m 안에서 잡히고 거기 닿으면 먼저 회수된다.
#   이 구성에서 그 영향이 작은 이유는 **데이터베이스가 36 MB 로 작기 때문이다**(2026-09-23 실측).
#   shared_buffers 64MB 는 캐시이지 전체 상주를 보장하지 않지만, 이 크기에서는 자주 읽는 페이지가
#   거기 머문다. 다만 **shared_buffers 를 거치지 않고 page cache 로 가는 경로는 남는다** —
#   WAL 세그먼트 쓰기, work_mem 을 넘긴 질의의 임시 파일, 인덱스 빌드, 논리 백업의 전체 스캔이
#   그것이다. DB 가 커지거나 이 경로들이 굵어지면 전제가 먼저 깨진다.
#
#   그래서 배분의 기준은 「합이 얼마인가」가 아니라 「죽으면 무엇이 멈추는가」다. PostgreSQL 은 1차 배포에서
#   이 노드 안에 있어 죽으면 서비스 전체가 멈추고, 앱 슬롯은 하나가 죽어도 남은 슬롯이 받는다(INF-01).
#   그렇다고 PostgreSQL 에 최악값을 담아 준 것은 아니다 — 담을 수 없다. 얼마를 담지 못하는지는
#   postgres 서비스 주석에 적었다.
#
# 앱 슬롯의 여유가 큰 이유는 non-heap 이다. 힙은 MaxRAMPercentage 로 상한에 묶이지만 메타스페이스 ·
# 코드 캐시 · G1 자료구조는 그 밖이라, 상한이 실사용에 가까우면 힙이 아니라 이쪽이 먼저 상한에 닿는다.
# **힙과 non-heap 을 나눠 재지 못했다.** 실행 이미지가 eclipse-temurin:21-jre 라 jcmd 가 없다 —
# JRE 에는 진단 도구가 들어 있지 않다(healthcheck 를 curl 대신 bash 의 /dev/tcp 로 만든 것과 같은 제약).
# 지금 잴 수 있는 것은 컨테이너 전체 RSS 뿐이다.
#
#   docker stats --no-stream                          컨테이너 RSS
#   docker exec <슬롯> grep VmRSS /proc/1/status      같은 값을 프로세스 쪽에서
#
# **그래서 non-heap 240m 이 적정한지는 아직 답할 수 없다.** 조회 중 RSS 445 MiB 가 상한의 74% 라
# 당장 위험하지 않다는 것까지만 확인됐다. 나눠 재려면 셋 중 하나가 필요한데 전부 대가가 있어 **미확정**으로 둔다 —
#   실행 이미지를 JDK 로 바꾼다        이미지가 커지고 공격면이 넓어진다
#   Actuator metrics 를 연다           관측(INF-05)과 겹치고 지금은 health 만 노출한다
#   -Xlog:gc 를 켠다                   힙만 보이고 non-heap 은 안 보인다
# 관측이 돌아올 때 함께 정한다.
#
# 가상 스레드 스택 청크는 힙에 할당되므로(외부 API 병렬 호출 경로) 힙 천장을 478 → 360 으로 내린 영향이
# 여기에 먼저 나타난다. 부하 시험이 돌아오면 함께 본다.
#
# Compose v2 스펙에서 메모리 상한은 최상위 서비스 키 mem_limit 다. deploy.resources.limits 는 Swarm 전용이라
# docker compose up 에서는 조용히 무시된다.

x-app: &app
  image: ${APP_IMAGE:-rental-backend:local}
  env_file: .env
  restart: unless-stopped
  logging: *logging
  mem_limit: 600m
  # graceful 종료 대기(application.yml 30초)보다 길게 준다. Compose 기본 10초면 30초를 채우기 전에 SIGKILL 된다.
  stop_grace_period: 40s
  # 슬롯 공통 환경 변수. YAML 병합 키(<<)는 최상위 키만 병합하므로, 서비스가 자기 environment 를 쓰면 앵커의 environment 가
  # 통째로 덮인다. 그래서 이 매핑에 따로 앵커를 걸어 각 슬롯이 environment 안에서 다시 병합한다.
  environment: &app-env
    # 컨테이너는 호스트 /etc/localtime 을 따르지 않는다. 호스트 시간대만 KST 로 맞춰도 컨테이너 안은 UTC 라
    # 앱 로그(KST)와 9시간 어긋나 대조가 되지 않는다.
    TZ: Asia/Seoul
    # 컨테이너 메모리 제한이 없으면 JVM 은 호스트 전체를 기준으로 잡는다 — 제한을 걸기 전 노드에서 힙 상한이
    # 478 MiB(호스트 1.865 GiB 의 25%)로 잡혀 있었다. mem_limit 600m 기준 60% = 360m 이 힙이고 나머지 240m 이
    # non-heap 몫이다.
    #
    # UseG1GC 를 명시하는 이유 — JVM 의 server-class 판정은 2 CPU 이상 **이고** 메모리 1792 MB 이상일 때만 통과하는데,
    # 컨테이너 인식 이후 그 메모리는 호스트가 아니라 mem_limit 을 본다. 600m 은 기준에 미치지 못해 명시하지 않으면
    # SerialGC 로 떨어진다. 제한을 걸기 전 노드는 G1 으로 돌고 있었으므로(실측), 명시하지 않으면 이 변경이 GC 를
    # 단일 스레드로 낮추는 셈이 된다 — 운영 절차서 3.3 의 p95 1초 판정에 직접 닿는다.
    #
    # ExitOnOutOfMemoryError 는 OOM 뒤 좀비 상태로 남지 않고 죽어서 restart: unless-stopped 가 받게 한다.
    JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # 앞단 — 요청 분산 · SSE 전달 · 정적 화면 전달. 호스트 네트워크여야 upstream 의 127.0.0.1 이 호스트를 가리킨다(운영 절차서 4.1).
  nginx:
    # 현재 stable 계열. 프론트 이미지(frontend/Dockerfile)와 같은 계열로 둔다
    image: nginx:1.30-alpine
    network_mode: host
    restart: unless-stopped
    logging: *logging
    mem_limit: 48m
    # 이 서비스에는 healthcheck 를 두지 않는다 — network_mode: host 라 컨테이너 안에서 자기를 찔러도 호스트 포트와 구분되지 않고,
    # 앞단 nginx 자신이 뒤쪽 슬롯의 생사를 판정하는 주체다. 밖에서 보는 확인은 smoke.sh 와 운영 절차서 2장 일상 점검이 맡는다.
    environment:
      # 컨테이너는 호스트 /etc/localtime 을 따르지 않는다 — 시간대를 주지 않으면 access · error 로그가 UTC 로 남아
      # 앱 로그(KST)와 대조되지 않는다
      TZ: Asia/Seoul
    # 재생성 · 정지 때 새 연결을 받지 않는 구간을 줄인다. 배포 중 최대 응답 2.496초(배포 검증 2026-09-22 — 순차 요청 API 527건 중 최대, 슬롯 교체 중)라 3초면
    # 진행 중 요청이 끝나고, SSE 는 끝나지 않는 연결이라 기다려 얻는 것이 없다(화면이 재연결한다).
    # Docker 기본 10초로는 재생성 때 약 11초 끊겼다 — 이슈 164
    stop_grace_period: 3s
    volumes:
      # 진입 파일은 파일 단위(바꾸지 않는다), 설정 본문은 main/ 폴더째 — 폴더는 새로 만들어진 파일도 이름으로 다시 찾으므로
      # git checkout 뒤에도 nginx -t → reload 로 반영된다(운영 절차서 4.1 · 이슈 164)
      - ./nginx/entry.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/main:/etc/nginx/main:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      # 점검 모드 표시 파일 — maintenance.sh
      - ./nginx/maintenance:/etc/nginx/maintenance:ro
    depends_on:
      - app-1
      - app-2
      - web

  # 슬롯 둘 — 액티브-액티브(INF-01). 포트는 호스트 루프백에만 연다(시스템 구성서 4장)
  app-1:
    <<: *app
    environment:
      <<: *app-env
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8081:8081"
    # 슬롯 생사 가시화. 포트는 컨테이너 안의 SERVER_PORT 값이다(호스트 포트가 아니다).
    # 실행 이미지가 eclipse-temurin:21-jre 라 curl · wget 이 없다. bash 의 /dev/tcp 로 TCP 를 직접 열어 확인한다.
    # CMD-SHELL 은 /bin/sh(dash)로 실행돼 /dev/tcp 를 모르므로 반드시 CMD + bash -c 형태여야 한다.
    # Compose 는 unhealthy 컨테이너를 재시작하지 않는다(그건 Swarm 기능). 이 확인은 docker compose ps 에 상태를 드러내는
    # 데까지이고, 자동 복구는 관측(INF-05, 차기 범위)의 몫이다.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 4
      # 기동에 시간이 걸린다 — 이 구간의 실패는 재시도 횟수로 세지 않는다
      start_period: 90s

  app-2:
    <<: *app
    environment:
      <<: *app-env
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8082:8082"
    # app-1 과 같다. 포트만 이 슬롯의 SERVER_PORT 다
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  web:
    image: ${WEB_IMAGE:-rental-frontend:local}
    restart: unless-stopped
    logging: *logging
    mem_limit: 32m
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8090:80"
    # 이미지가 nginx:1.30-alpine 기반이라 busybox wget 이 있다. 정적 파일이 실제로 나오는지까지 본다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 112m
    # 상한과 축출 정책 — 시스템 구성서 3장. 1차 배포 노드의 실사용은 4.6 MiB 였다(2026-09-23).
    # maxmemory 는 컨테이너 상한보다 작아야 한다 — 크면 축출이 시작되기 전에 컨테이너가 OOM 으로 죽는다.
    # 64mb 와 mem_limit 112m 의 차 48m 은 AOF 재작성 몫이다: appendonly 를 켰으므로 AOF 가 커지면
    # BGREWRITEAOF 가 fork 하고, 그 뒤 부모가 건드리는 페이지만큼 복사-쓰기로 실제 메모리가 늘어난다.
    # 데이터가 상한에 가까운 최악에서도 절반 이상을 덮는다.
    # volatile-lru 는 축출 **순서**만 정한다. 여기 저장하는 키는 토큰 · 티켓 · 락 · 캐시 전부 TTL 이 있어
    # 축출 후보에서 빠지는 키가 없다 — 특정 키를 보호해 주지 않는다. 축출이 시작되면 가장 오래 안 쓰인 것이
    # 나가므로 14일 TTL 인 리프레시 토큰이 앞줄이고, 더 나쁜 것은 락 키다(상호배제가 깨져 등기를 두 번 떼거나
    # 알림이 중복된다). 그래서 축출이 일어나지 않도록 상한을 잡는 것이 우선이고, noeviction 대신 이것을 고른
    # 이유는 축출이 필요한 상황에서 쓰기를 거부하는 것보다 낫기 때문이다.
    #
    # AOF 를 켠다. 시스템 구성서 3장은 「Redis 에는 복제도 백업도 두지 않는다. 정지하면 내용이 사라지므로 재생성 가능한
    # 데이터만 보관한다」고 정했는데, 그것은 내구성(백업) 방침이다. 여기서 켜는 것은 재시작 생존(persistence)이고 둘은 다르다 —
    # 리프레시 토큰이 Redis 에 있어 배포로 컨테이너를 재생성하기만 해도 전 사용자가 로그아웃된다. 노드가 사라지면
    # 데이터도 사라진다는 방침은 그대로다(볼륨은 이 노드 안에 있고 백업 대상이 아니다).
    # everysec 은 최대 1초치 손실을 받아들이는 대신 요청 경로에 fsync 를 두지 않는다.
    command: ["sh", "-c", "exec redis-server --maxmemory 64mb --maxmemory-policy volatile-lru --appendonly yes --appendfsync everysec $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: Asia/Seoul
    volumes:
      - redisdata:/data
    # 외부 바인딩 금지 — 앱은 Compose 네트워크로 닿는다. 호스트 포트를 열지 않는다
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    # 저장소 자원 상한 — 시스템 구성서 3장. 이미지 기본값(shared_buffers 128MB · max_connections 100)은
    # 이 노드에 들어오지 않는다.
    #
    # **이 상한은 최악값을 담지 못한다. 실측에서 잡았다.** 담지 못하는 항을 적어 둔다 —
    #   공유 메모리 세그먼트 전체는 약 80 MiB 다 — shared_buffers 64MB 에 wal_buffers · lock table · PGPROC 등이 더 붙는다
    #   백엔드마다 relcache · plan cache 가 따로 잡힌다(커넥션당 1.5~3 MiB)
    #   work_mem 은 커넥션당이 아니라 질의 안의 정렬 · 해시 노드마다 잡힌다
    #   Flyway 의 CREATE INDEX 는 autovacuum 과 별개로 maintenance_work_mem 을 한 번 더 잡는다
    # 전부 더한 최악은 300~360 MiB 이고 256m 으로 담을 수 없다. **담으려면 앱 슬롯을 실측에 더 가깝게
    # 조여야 하는데, 둘 다 담을 수 있는 배분은 이 노드 크기에 없다**(2026-09-23 결정).
    #
    # 그 최악이 지금 성립하기 어려운 이유는 셋이다 —
    #   데이터베이스가 36 MB 로 작아 자주 읽는 페이지가 shared_buffers 안에 머문다(실측)
    #   앱 풀이 슬롯당 8, 둘이 16 이라 커넥션 32 가 동시에 정렬하는 상태가 오지 않는다
    #   실사용이 89 MiB 다(그것도 shared_buffers 128MB · max_connections 100 인 기본값 구성에서 잰 값이다)
    # **셋 중 하나라도 바뀌면 이 산정을 다시 본다.** 트래픽 증가 · DB 증가 · 앱 풀 크기 변경이 그 신호다.
    #
    # max_connections 32 — 앱 풀 16 에 Flyway · 배치 · 운영자 접속 여유를 더했다(Flyway · 배치는 앱과
    # 같은 풀에서 빌리므로 따로 세지 않는다). autovacuum 은 autovacuum_work_mem 기본이 -1 이라
    # maintenance_work_mem 을 그대로 쓰므로 워커 수와 함께 묶는다.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=32
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - autovacuum_max_workers=2
      # 페일백에서 pg_rewind 를 쓰려면 이 설정이 **장애 전에** 켜져 있어야 한다 — 운영 절차서 6.2 의
      # 재구축 수단 판정표가 「wal_log_hints = on 또는 데이터 체크섬 활성」을 조건으로 두고, 인프라 기술
      # 스택 3장이 「장애 발생 후에는 선택할 수 없다」고 못 박았다. 꺼져 있으면 구 primary 를 되돌리는 데
      # pg_basebackup 전체 재구축을 강요당하고 소요가 데이터 크기에 비례한다.
      #
      # 지금 켜는 이유는 **서버 기동 시점에만 정할 수 있기 때문**이다. 복제를 붙인 뒤에 켜려면 standby 가
      # 붙어 있는 상태에서 primary 를 재기동해야 하고 그때는 계획 정지가 필요하다. 복제 전인 지금은
      # 컨테이너 재생성만으로 끝난다.
      #
      # 판정 조건의 다른 한쪽인 data_checksums 도 나중에 켤 수 있다 — initdb 말고 pg_checksums --enable 로,
      # 다만 **정상 종료된 클러스터에서만** 돈다(이미지 안에 그 바이너리가 있다). 그래서 대가는
      # 「재생성」이 아니라 **정지 창 + 전 페이지 재기록**이고, 복제가 붙은 뒤에는 전 노드를 일관되게
      # 멈춰야 한다(PostgreSQL 문서가 pg_rewind 를 그 위험 사례로 든다). 조건은 둘 중 하나면 성립하므로
      # 지금은 재기동 한 번으로 끝나는 쪽을 고른다.
      #
      # 조건에는 full_page_writes = on 도 있는데 이것은 기본값이라 따로 적지 않는다 — **기본값에 기대고
      # 있다는 사실만 남긴다.** 끄는 변경이 들어오면 pg_rewind 조건이 함께 깨진다.
      #
      # 대가는 WAL 이 약간 느는 것이다. full_page_writes 가 이미 체크포인트 후 첫 수정에서 전체 페이지를
      # 기록하는데, 이 설정은 그 대상에 **힌트 비트만 바뀐 페이지**까지 넣는다. DB 가 36 MB 라 작다.
      - -c
      - wal_log_hints=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 컨테이너는 호스트 /etc/localtime 을 따르지 않는다. 로그 타임스탬프를 앱 로그(KST)와 맞춘다
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  # Redis 재시작 생존용 AOF 자리. 백업 대상이 아니다 — 위 redis 서비스 주석 참고
  redisdata:
