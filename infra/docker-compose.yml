# 운영 구성 — APP-01 노드. 시스템 구성서 2 · 3장, 운영 절차서 3 · 4장.
# 이 파일이 있는 infra/ 에서 실행한다. 값은 같은 폴더의 .env 에서 읽는다(루트 .env.example 과 같은 이름).
#
#   cd infra && docker compose up -d
#
# 파일 이름이 docker-compose.yml 인 이유: 배포 스크립트(운영 절차서 3.2)가 -f 없이 infra/ 에서 docker compose 를 부른다.
# 다른 이름이면 Compose 가 상위 폴더로 올라가 루트의 로컬 구성을 집는다.
#
# 프로필 — 한 파일을 노드마다 다른 몫으로 띄운다. 모든 서비스가 프로필을 가지므로 infra/.env 의 COMPOSE_PROFILES 가
# 비어 있으면 아무것도 뜨지 않는다.
#   app       nginx · app-1 · app-2 · web · redis · 관측 수집기(prom-agent · vector · exporter 넷)
#   db        postgres
#   standby   postgres-standby
#   단일 노드(옛 APP-01)   COMPOSE_PROFILES=app,db,standby — 셋이 한 노드의 컨테이너다. standby 는 전환 절차를 검증하는
#                          자리이고 노드 장애는 막지 못한다
#   3노드                  APP-01 app · DB-01 db · DB-02 standby. APP-01 의 infra/.env 는 DB_HOST 를 DB-01 사설 IP 로 둔다
#                          (아래 app-1 의 DB_HOST 주석)
#
# 이미지 — 레지스트리 파이프라인(INF-02) 전에는 로컬 빌드 이미지를 쓴다(운영 절차서 3.2 전제).
# APP_IMAGE · WEB_IMAGE 로 덮으면 레지스트리 이미지가 된다.
# 로컬 구성(루트, name: rental)과 컨테이너 · 볼륨 이름이 겹치지 않게 한다
name: rental-prod

# 컨테이너 로그 회전 — 서버 운영 기반 설계서 8장이 「컨테이너 로그 — 크기·개수 상한」을 요구하는데 값이 10장에서 미확정이라
# 지금까지 상한이 없었다. json-file 기본값은 무제한이라 로그만으로 노드 디스크가 찬다
# (볼륨 크기는 서버 운영 기반 설계서 4.2 에서 미확정이다 — 상한을 두는 근거는 크기가 아니라 증가가 멈추지 않는다는 것).
# 서비스 13개(nginx · app-1 · app-2 · web · redis · postgres · postgres-standby + 관측 수집기 prom-agent · vector ·
# node-exporter · postgres-exporter · redis-exporter · nginx-exporter) × 10m × 3개 = 약 390 MB 가 컨테이너 로그 전체의 상한이다.
# vector 가 이 json-file 로그를 Docker API 로 읽어 밖으로 보내므로, 회전은 노드 안의 사본만 줄인다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 메모리 상한 — 노드는 t3.small(2 vCPU · 2 GiB)이고 앱 2슬롯 · PostgreSQL · Redis · web · nginx 가 한 노드에 모두 올라간다.
# 상한이 없으면 커널 OOM Killer 가 가장 큰 RSS(=PostgreSQL 또는 JVM)를 골라 죽인다. 서비스마다 상한을 주어
# 초과하는 쪽만 죽게 한다.
#
# 기준 총량은 2048 이 아니라 **1909 MiB** 다 — 커널 · 펌웨어 예약분을 뺀 값으로, 노드에서 free -m 으로 실측했다
# (2026-09-23 17:10). 상한은 그 시점의 컨테이너별 실사용(RSS)에서 역산했고, 반영 뒤 다시 쟀다.
#
#   서비스        mem_limit   상한 전   반영 후   조회 중   상한의 근거
#   app-1             600m    454 MiB   424 MiB   445 MiB   힙 360m(60%) + non-heap 240m
#   app-2             600m    455 MiB   423 MiB   446 MiB   위와 같음
#   postgres          256m     89 MiB    56 MiB    87 MiB   최악값은 담지 못한다 — postgres 서비스 주석
#   redis             112m    4.6 MiB   3.6 MiB   4.0 MiB   maxmemory 64mb + 단편화 · AOF 버퍼 · 출력 버퍼
#   nginx              48m    3.7 MiB   3.4 MiB   3.4 MiB   SSE 는 proxy_buffering off 라 연결당 버퍼 없음
#   web                32m    4.2 MiB   3.4 MiB   3.4 MiB   정적 파일 서빙 nginx
#   ──────────────────────────────────────────────────────
#   합계             1648m   1011 MiB   913 MiB   989 MiB
#
#   「상한 전」은 상한이 없던 구성(2026-09-23 17:10), 나머지 둘은 이 상한을 반영한 뒤다(18:25).
#   **「조회 중」은 부하가 아니다** — smoke.sh 의 대표 조회 60건 직후 값이다. 부하를 준 상태의 수치는
#   부하 시험(INF-06, 차기 범위)에서 처음 나온다.
#   힙 천장을 478 → 360 으로 내리고 shared_buffers 를 128 → 64MB 로 줄인 뒤 앱과 PostgreSQL 이 함께 줄었다.
#   **조회 중에도 앱이 상한의 74% 다** — 520m 이었다면 86% 였다.
#
# 관측 수집기(INF-05) — 노드에는 수집 · 전송만 두고 저장 · 시각화 · 알림은 노드 밖(Grafana Cloud)이다.
# 상한은 같은 이미지 · 같은 상한으로 노드에서 18시간 돌린 임시 구성의 값이고, 실측은 그 끝 시점이다(2026-09-24 15:05).
#
#   서비스              mem_limit   실측       상한의 근거
#   prom-agent              150m   38.5 MiB   agent 모드 WAL 만. 기동 뒤 27 ~ 47 MiB 사이를 오갔다(2026-09-23 ~ 24)
#   vector                  150m   14.5 MiB   docker_logs → loki
#   node-exporter            64m    9.6 MiB   호스트 지표
#   postgres-exporter        64m    8.4 MiB
#   redis-exporter           64m    8.5 MiB
#   ──────────────────────────────────────────────
#   합계                    492m   79.5 MiB   위 표와 더해 상한 합 2140m
#
#   임시 구성을 걷고 이것으로 바꿔 올리므로 노드 실사용의 순증은 없다(실측 79.5 MiB 는 이미 노드에 있다).
#
# 복제 standby(INF-03) — 같은 노드의 컨테이너다. 트래픽을 받지 않고 WAL 재생만 한다.
#
#   서비스              mem_limit   실측              상한의 근거
#   postgres-standby        256m   (노드 적용 뒤)    primary 와 같다 — 승격되면 primary 역할을 한다
#   ──────────────────────────────────────────────
#   위 두 표와 더해 상한 합 2396m. 노드 실사용은 이만큼 순증한다(로컬 Docker 에서 빈 DB 로 띄운 값은 17 MiB 였다 —
#   이 노드 · 이 DB 크기의 값이 아니다).
#
# nginx 지표(INF-05) — 앞단 nginx 의 stub_status 를 긁는다.
#
#   서비스              mem_limit   실측              상한의 근거
#   nginx-exporter           32m   (노드 적용 뒤)    같은 Go 단일 바이너리 exporter 셋의 실측이 8.4 ~ 9.6 MiB(위 수집기 표)
#   ──────────────────────────────────────────────
#   위 세 표와 더해 상한 합 2428m.
#
# **상한의 합이 노드 가용 메모리를 넘는다. 의도한 것이고, 대가가 있다.**
#   1909(총량) − 264(OS · dockerd 실측) = 1645 이고 상한 합 1648 은 그것을 넘는다. 수집기를 더하면 2140,
#   standby 까지 더하면 2396, nginx exporter 까지 더하면 2428 이다.
#   mem_limit 은 **예약이 아니라 상한**이라 쓰지 않는 몫을 붙들지 않는다. 평시 실사용 합이 913(수집기 더해 약 993,
#   standby 실측은 노드 적용 뒤)이므로
#   평시에는 여유가 있고, 상한의 목적은 총합을 보장하는 것이 아니라 **폭주하는 하나를 가두어 나머지를
#   지키는 것**이다.
#
#   대가는 이것이다 — 모든 컨테이너가 자기 상한 안에 있으면서 노드 메모리가 마르는 상태가 존재한다.
#   그때는 cgroup OOM 이 아니라 **전역 OOM killer 가 oom_score 로 고른다.** 이 주석 맨 앞이 막겠다고
#   한 바로 그 상황이다. 그 구간을 없애려면 합을 1645 아래로 내려야 하는데, 그러려면 앱 슬롯이나
#   PostgreSQL 중 하나가 실측에 더 가깝게 조여진다. **둘 다 담을 수 있는 배분은 이 노드 크기에 없다.**
#
#   그리고 264 는 측정값이지 상한이 아니다. journald 회전 · sshd 세션 · dnf-automatic · 논리 백업
#   스크립트가 돌면 늘고, **늘어난 만큼 초과폭이 그대로 커진다.**
#
#   page cache 도 노드 전체의 남은 몫이 아니다 — cgroup 은 파일 캐시를 그것을 처음 올린 컨테이너에
#   과금한다. PostgreSQL 의 데이터 파일 캐시는 자기 상한 256m 안에서 잡히고 거기 닿으면 먼저 회수된다.
#   이 구성에서 그 영향이 작은 이유는 **데이터베이스가 36 MB 로 작기 때문이다**(2026-09-23 실측).
#   shared_buffers 64MB 는 캐시이지 전체 상주를 보장하지 않지만, 이 크기에서는 자주 읽는 페이지가
#   거기 머문다. 다만 **shared_buffers 를 거치지 않고 page cache 로 가는 경로는 남는다** —
#   WAL 세그먼트 쓰기, work_mem 을 넘긴 질의의 임시 파일, 인덱스 빌드, 논리 백업의 전체 스캔이
#   그것이다. DB 가 커지거나 이 경로들이 굵어지면 전제가 먼저 깨진다.
#
#   그래서 배분의 기준은 「합이 얼마인가」가 아니라 「죽으면 무엇이 멈추는가」다. PostgreSQL 은 1차 배포에서
#   이 노드 안에 있어 죽으면 서비스 전체가 멈추고, 앱 슬롯은 하나가 죽어도 남은 슬롯이 받는다(INF-01).
#   그렇다고 PostgreSQL 에 최악값을 담아 준 것은 아니다 — 담을 수 없다. 얼마를 담지 못하는지는
#   postgres 서비스 주석에 적었다.
#
# 앱 슬롯의 여유가 큰 이유는 non-heap 이다. 힙은 MaxRAMPercentage 로 상한에 묶이지만 메타스페이스 ·
# 코드 캐시 · G1 자료구조는 그 밖이라, 상한이 실사용에 가까우면 힙이 아니라 이쪽이 먼저 상한에 닿는다.
# **힙과 non-heap 을 나눠 재지 못했다.** 실행 이미지가 eclipse-temurin:21-jre 라 jcmd 가 없다 —
# JRE 에는 진단 도구가 들어 있지 않다(healthcheck 를 curl 대신 bash 의 /dev/tcp 로 만든 것과 같은 제약).
# 지금 잴 수 있는 것은 컨테이너 전체 RSS 뿐이다.
#
#   docker stats --no-stream                          컨테이너 RSS
#   docker exec <슬롯> grep VmRSS /proc/1/status      같은 값을 프로세스 쪽에서
#
# **그래서 non-heap 240m 이 적정한지는 아직 답할 수 없다.** 조회 중 RSS 445 MiB 가 상한의 74% 라
# 당장 위험하지 않다는 것까지만 확인됐다. 나눠 재려면 셋 중 하나가 필요한데 전부 대가가 있어 **미확정**으로 둔다 —
#   실행 이미지를 JDK 로 바꾼다        이미지가 커지고 공격면이 넓어진다
#   Actuator metrics 를 연다           관측(INF-05)과 겹치고 지금은 health 만 노출한다
#   -Xlog:gc 를 켠다                   힙만 보이고 non-heap 은 안 보인다
# 관측이 돌아올 때 함께 정한다.
#
# 가상 스레드 스택 청크는 힙에 할당되므로(외부 API 병렬 호출 경로) 힙 천장을 478 → 360 으로 내린 영향이
# 여기에 먼저 나타난다. 부하 시험이 돌아오면 함께 본다.
#
# Compose v2 스펙에서 메모리 상한은 최상위 서비스 키 mem_limit 다. deploy.resources.limits 는 Swarm 전용이라
# docker compose up 에서는 조용히 무시된다.

x-app: &app
  profiles: ["app"]
  image: ${APP_IMAGE:-rental-backend:local}
  env_file: .env
  restart: unless-stopped
  logging: *logging
  mem_limit: 600m
  # graceful 종료 대기(application.yml 30초)보다 길게 준다. Compose 기본 10초면 30초를 채우기 전에 SIGKILL 된다.
  stop_grace_period: 40s
  # 슬롯 공통 환경 변수. YAML 병합 키(<<)는 최상위 키만 병합하므로, 서비스가 자기 environment 를 쓰면 앵커의 environment 가
  # 통째로 덮인다. 그래서 이 매핑에 따로 앵커를 걸어 각 슬롯이 environment 안에서 다시 병합한다.
  environment: &app-env
    # 컨테이너는 호스트 /etc/localtime 을 따르지 않는다. 호스트 시간대만 KST 로 맞춰도 컨테이너 안은 UTC 라
    # 앱 로그(KST)와 9시간 어긋나 대조가 되지 않는다.
    TZ: Asia/Seoul
    # 컨테이너 메모리 제한이 없으면 JVM 은 호스트 전체를 기준으로 잡는다 — 제한을 걸기 전 노드에서 힙 상한이
    # 478 MiB(호스트 1.865 GiB 의 25%)로 잡혀 있었다. mem_limit 600m 기준 60% = 360m 이 힙이고 나머지 240m 이
    # non-heap 몫이다.
    #
    # UseG1GC 를 명시하는 이유 — JVM 의 server-class 판정은 2 CPU 이상 **이고** 메모리 1792 MB 이상일 때만 통과하는데,
    # 컨테이너 인식 이후 그 메모리는 호스트가 아니라 mem_limit 을 본다. 600m 은 기준에 미치지 못해 명시하지 않으면
    # SerialGC 로 떨어진다. 제한을 걸기 전 노드는 G1 으로 돌고 있었으므로(실측), 명시하지 않으면 이 변경이 GC 를
    # 단일 스레드로 낮추는 셈이 된다 — 운영 절차서 3.3 의 p95 1초 판정에 직접 닿는다.
    #
    # ExitOnOutOfMemoryError 는 OOM 뒤 좀비 상태로 남지 않고 죽어서 restart: unless-stopped 가 받게 한다.
    JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
  depends_on:
    # required: false — 3노드에서는 postgres 가 다른 노드(DB-01)라 이 노드의 활성 프로필에 없다. 없으면 기다리지 않고
    # 뜨고, 있으면(단일 노드) 지금처럼 healthy 를 기다린다
    postgres:
      condition: service_healthy
      required: false
    redis:
      condition: service_healthy

# PostgreSQL 서버 설정 — primary(postgres) · standby(postgres-standby)가 **같은 목록**을 쓴다(INF-03).
# hot standby 는 max_connections · max_worker_processes · max_locks_per_transaction · max_prepared_transactions 가
# primary 이상이어야 기동한다. 두 곳에 적으면 한쪽만 고쳐져 standby 가 기동을 거부한다.
# 뒤의 셋은 기본값(8 · 64 · 0)에 기댄다 — 여기 적지 않으면 양쪽이 같은 기본값이라 조건이 선다.
# standby 의 shared_buffers 도 같다 — 승격 뒤 primary 역할을 하므로 작게 두면 승격 실측이 반쪽이 된다.
#
# 명령 목록 전체를 앵커로 둔 이유 — YAML 병합 키(<<)는 매핑만 합치고 시퀀스는 합치지 못한다. -c 인자만 떼어
# 앵커로 두면 두 서비스가 그 앞에 postgres 를 붙일 방법이 없다. 그래서 postgres 부터 전체를 한 목록으로 두고
# 두 서비스 모두 초기화 스크립트(infra/postgres/bootstrap.sh)가 이 목록을 "$@" 로 받아 docker-entrypoint.sh 에 넘긴다.
#
# max_connections 32 — 앱 풀 16 에 Flyway · 배치 · 운영자 접속 여유를 더했다(Flyway · 배치는 앱과
# 같은 풀에서 빌리므로 따로 세지 않는다). autovacuum 은 autovacuum_work_mem 기본이 -1 이라
# maintenance_work_mem 을 그대로 쓰므로 워커 수와 함께 묶는다.
#
# 복제에 필요한 wal_level=replica · max_wal_senders=10 · max_replication_slots=10 · hot_standby=on 은 전부 기본값이다 —
# **기본값에 기대고 있다는 사실만 남긴다.** 바꾸는 변경이 들어오면 복제 조건을 다시 본다.
x-postgres-command: &postgres-command
  - postgres
  - -c
  - shared_buffers=64MB
  - -c
  - max_connections=32
  - -c
  - work_mem=4MB
  - -c
  - maintenance_work_mem=16MB
  - -c
  - autovacuum_max_workers=2
  # 페일백에서 pg_rewind 를 쓰려면 이 설정이 **장애 전에** 켜져 있어야 한다 — 운영 절차서 6.2 의
  # 재구축 수단 판정표가 「wal_log_hints = on 또는 데이터 체크섬 활성」을 조건으로 두고, 인프라 기술
  # 스택 3장이 「장애 발생 후에는 선택할 수 없다」고 못 박았다. 꺼져 있으면 구 primary 를 되돌리는 데
  # pg_basebackup 전체 재구축을 강요당하고 소요가 데이터 크기에 비례한다.
  #
  # 지금 켜는 이유는 **서버 기동 시점에만 정할 수 있기 때문**이다. 복제를 붙인 뒤에 켜려면 standby 가
  # 붙어 있는 상태에서 primary 를 재기동해야 하고 그때는 계획 정지가 필요하다. 복제 전인 지금은
  # 컨테이너 재생성만으로 끝난다.
  #
  # 판정 조건의 다른 한쪽인 data_checksums 도 나중에 켤 수 있다 — initdb 말고 pg_checksums --enable 로,
  # 다만 **정상 종료된 클러스터에서만** 돈다(이미지 안에 그 바이너리가 있다). 그래서 대가는
  # 「재생성」이 아니라 **정지 창 + 전 페이지 재기록**이고, 복제가 붙은 뒤에는 전 노드를 일관되게
  # 멈춰야 한다(PostgreSQL 문서가 pg_rewind 를 그 위험 사례로 든다). 조건은 둘 중 하나면 성립하므로
  # 지금은 재기동 한 번으로 끝나는 쪽을 고른다.
  #
  # 조건에는 full_page_writes = on 도 있는데 이것은 기본값이라 따로 적지 않는다 — **기본값에 기대고
  # 있다는 사실만 남긴다.** 끄는 변경이 들어오면 pg_rewind 조건이 함께 깨진다.
  #
  # 대가는 WAL 이 약간 느는 것이다. full_page_writes 가 이미 체크포인트 후 첫 수정에서 전체 페이지를
  # 기록하는데, 이 설정은 그 대상에 **힌트 비트만 바뀐 페이지**까지 넣는다. DB 가 36 MB 라 작다.
  # standby 도 같은 값을 쓴다 — pg_rewind 의 조건은 되돌려지는 쪽(대상)에 걸리므로, 승격된 standby 가
  # 나중에 되돌려지는 쪽이 될 때(두 번째 전환 뒤) 같은 조건이 필요하다.
  - -c
  - wal_log_hints=on
  # 복제 슬롯이 붙든 WAL 의 상한 — 인프라 기술 스택 3장. standby 가 멈춰 있어도 슬롯은 WAL 을 지우지 못하게
  # 붙들어 primary 디스크를 고갈시킨다. 이 크기를 넘기면 슬롯이 무효(wal_status=lost)가 되고 standby 는
  # 재구축(pg_basebackup)해야 한다 — 디스크 고갈로 primary 가 멈추는 것보다 standby 재구축이 낫다.
  - -c
  - max_slot_wal_keep_size=2GB
  # 접속 규칙은 저장소 파일(infra/postgres/pg_hba.conf)을 쓴다 — 그 파일 머리 주석. 두 서비스 모두 이 경로에 마운트한다.
  - -c
  - hba_file=/etc/postgresql/pg_hba.conf
  # 로그 시각은 컨테이너 TZ 가 아니라 log_timezone 을 따른다 — initdb 가 postgresql.conf 에 적는 값이고 지금 UTC 다
  # (2026-09-24 노드 SHOW log_timezone = UTC). 앱 · Nginx 로그와 시각을 맞춘다(#197).
  # timezone(세션 기본값)은 바꾸지 않는다 — DEFAULT now() 인 timestamp without time zone 컬럼 값이 세션 설정에 따라 달라질 수 있다.
  - -c
  - log_timezone=Asia/Seoul
  # WAL 연속 아카이빙(INF-04) — **RPO 5분을 보장하는 것은 복제가 아니라 이 설정이다**(인프라 기술 스택 3장 · 시스템 구성서 5.1).
  # standby 는 같은 노드의 컨테이너라 노드와 함께 사라지고, 잘못된 쓰기 · 삭제도 그대로 따라 재생한다. 물리 백업
  # (infra/backup/pg-basebackup.sh) 위에 이 아카이브를 재생해야 시점 복구(PITR)가 된다.
  #
  # archive_mode 는 서버 기동 시점에만 정해진다 — 바꾸려면 재기동(컨테이너 재생성)해야 한다. archive_timeout · archive_command 는
  # reload 로 바뀌지만 여기 -c 인자로 두었으므로 이 목록을 고친 뒤에는 역시 재생성으로 반영한다.
  # wal_level 은 위의 「기본값에 기댄다」 그대로다 — 기본 replica 가 아카이빙의 조건이다(minimal 이면 archive_mode=on 으로 기동을
  # 거부한다). 복제 조건과 같은 값이라 여기서 따로 적지 않는다.
  #
  # standby 도 같은 목록이다. on 은 복구 중에는 아카이브하지 않고(always 가 아니다) 승격하면 그때부터 이어서 한다 —
  # 페일오버 절차에 아카이빙 전환 단계를 넣지 않는다. 두 서비스가 같은 호스트 디렉터리에 쓴다(아래 volumes).
  #
  # archive_timeout 300 — 5분 강제 스위치(인프라 기술 스택 3장). 직전 스위치 뒤 WAL 이 쓰였을 때만 5분마다 세그먼트를
  # 닫아 아카이브에 넘긴다 — 활동이 없던 창에서는 스위치하지 않는다. 대가는 크기다 — PostgreSQL 17 문서 원문
  # 「archived files that are archived early due to a forced switch are still the same length as completely full files」,
  # 몇 KB 만 쓰인 창도 16 MB 파일 하나가 된다. 상한은 시간당 12개(192 MB)다.
  # 노드 실측(2026-09-24 22:41 ~ 22:43) — 재기동 뒤 2시간 20분 누적 WAL 이 71레코드 · 75 KB 였다. 쓰기가 드물어 상한보다
  # 훨씬 적지만, 파일 하나하나는 거의 비어 있어도 16 MB 다. 정리는 물리 백업 스크립트가 한다(infra/backup/pg-basebackup.sh).
  #
  # archive_command — 한 건을 스크립트(infra/postgres/archive-wal.sh)가 받는다. 문서 25.3.1 의 예 test ! -f … && cp … 를
  # 쓰지 않는 이유는 그 스크립트 머리 주석 — 같은 파일의 재아카이브를 영구 실패로 만들고, cp 도중 kill 되면 잘린 세그먼트가
  # 최종 이름으로 남는다. 0 이 아닌 종료는 그 세그먼트를 pg_wal 에 남겨 두고 재시도하게 하므로, 실패가 이어지면 pg_wal 이
  # 자란다 — pg_stat_archiver 의 failed_count 로 본다. 서버가 이 값을 셸로 실행하고 %p · %f 를 채운다.
  # sh 로 부른다 — 초기화 스크립트와 같이 마운트한 파일의 실행 비트에 기대지 않는다.
  - -c
  - archive_mode=on
  - -c
  - archive_timeout=300
  - -c
  - archive_command=/bin/sh /usr/local/bin/rental-archive-wal.sh %p %f

services:
  # 앞단 — 요청 분산 · SSE 전달 · 정적 화면 전달. 호스트 네트워크여야 upstream 의 127.0.0.1 이 호스트를 가리킨다(운영 절차서 4.1).
  nginx:
    profiles: ["app"]
    # 현재 stable 계열. 프론트 이미지(frontend/Dockerfile)와 같은 계열로 둔다
    image: nginx:1.30-alpine
    network_mode: host
    restart: unless-stopped
    logging: *logging
    mem_limit: 48m
    # 이 서비스에는 healthcheck 를 두지 않는다 — network_mode: host 라 컨테이너 안에서 자기를 찔러도 호스트 포트와 구분되지 않고,
    # 앞단 nginx 자신이 뒤쪽 슬롯의 생사를 판정하는 주체다. 밖에서 보는 확인은 smoke.sh 와 운영 절차서 2장 일상 점검이 맡는다.
    environment:
      # 컨테이너는 호스트 /etc/localtime 을 따르지 않는다 — 시간대를 주지 않으면 access · error 로그가 UTC 로 남아
      # 앱 로그(KST)와 대조되지 않는다
      TZ: Asia/Seoul
    # 재생성 · 정지 때 새 연결을 받지 않는 구간을 줄인다. 배포 중 최대 응답 2.496초(배포 검증 2026-09-22 — 순차 요청 API 527건 중 최대, 슬롯 교체 중)라 3초면
    # 진행 중 요청이 끝나고, SSE 는 끝나지 않는 연결이라 기다려 얻는 것이 없다(화면이 재연결한다).
    # Docker 기본 10초로는 재생성 때 약 11초 끊겼다 — 이슈 164
    stop_grace_period: 3s
    volumes:
      # 진입 파일은 파일 단위(바꾸지 않는다), 설정 본문은 main/ 폴더째 — 폴더는 새로 만들어진 파일도 이름으로 다시 찾으므로
      # git checkout 뒤에도 nginx -t → reload 로 반영된다(운영 절차서 4.1 · 이슈 164)
      - ./nginx/entry.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/main:/etc/nginx/main:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      # 점검 모드 표시 파일 — maintenance.sh
      - ./nginx/maintenance:/etc/nginx/maintenance:ro
    depends_on:
      - app-1
      - app-2
      - web

  # 슬롯 둘 — 액티브-액티브(INF-01). 포트는 호스트 루프백에만 연다(시스템 구성서 4장)
  app-1:
    <<: *app
    environment:
      <<: *app-env
      SERVER_PORT: 8081
      # 단일 노드에서는 infra/.env 에 DB_HOST 를 두지 않는다 — 비우면 postgres. 3노드의 APP-01 은 DB-01 사설 IP 다(파일 머리 프로필).
      # 페일오버 6단계(운영 절차서 6.1)에서
      # DB_HOST=postgres-standby 로 바꾸고 슬롯을 순서대로 재생성한다. app-2 도 같은 값을 읽는다
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8081:8081"
    # 슬롯 생사 가시화. 포트는 컨테이너 안의 SERVER_PORT 값이다(호스트 포트가 아니다).
    # 실행 이미지가 eclipse-temurin:21-jre 라 curl · wget 이 없다. bash 의 /dev/tcp 로 TCP 를 직접 열어 확인한다.
    # CMD-SHELL 은 /bin/sh(dash)로 실행돼 /dev/tcp 를 모르므로 반드시 CMD + bash -c 형태여야 한다.
    # Compose 는 unhealthy 컨테이너를 재시작하지 않는다(그건 Swarm 기능). 이 확인은 docker compose ps 에 상태를 드러내는
    # 데까지이고, 자동 복구는 관측(INF-05) — 미구현 — 의 몫이다.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 4
      # 기동에 시간이 걸린다 — 이 구간의 실패는 재시도 횟수로 세지 않는다
      start_period: 90s

  app-2:
    <<: *app
    environment:
      <<: *app-env
      SERVER_PORT: 8082
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:8082:8082"
    # app-1 과 같다. 포트만 이 슬롯의 SERVER_PORT 다
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  web:
    profiles: ["app"]
    image: ${WEB_IMAGE:-rental-frontend:local}
    restart: unless-stopped
    logging: *logging
    mem_limit: 32m
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8090:80"
    # 이미지가 nginx:1.30-alpine 기반이라 busybox wget 이 있다. 정적 파일이 실제로 나오는지까지 본다
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    profiles: ["app"]
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 112m
    # 상한과 축출 정책 — 시스템 구성서 3장. 1차 배포 노드의 실사용은 4.6 MiB 였다(2026-09-23).
    # maxmemory 는 컨테이너 상한보다 작아야 한다 — 크면 축출이 시작되기 전에 컨테이너가 OOM 으로 죽는다.
    # 64mb 와 mem_limit 112m 의 차 48m 은 AOF 재작성 몫이다: appendonly 를 켰으므로 AOF 가 커지면
    # BGREWRITEAOF 가 fork 하고, 그 뒤 부모가 건드리는 페이지만큼 복사-쓰기로 실제 메모리가 늘어난다.
    # 데이터가 상한에 가까운 최악에서도 절반 이상을 덮는다.
    # volatile-lru 는 축출 **순서**만 정한다. 여기 저장하는 키는 토큰 · 티켓 · 락 · 캐시 전부 TTL 이 있어
    # 축출 후보에서 빠지는 키가 없다 — 특정 키를 보호해 주지 않는다. 축출이 시작되면 가장 오래 안 쓰인 것이
    # 나가므로 14일 TTL 인 리프레시 토큰이 앞줄이고, 더 나쁜 것은 락 키다(상호배제가 깨져 등기를 두 번 떼거나
    # 알림이 중복된다). 그래서 축출이 일어나지 않도록 상한을 잡는 것이 우선이고, noeviction 대신 이것을 고른
    # 이유는 축출이 필요한 상황에서 쓰기를 거부하는 것보다 낫기 때문이다.
    #
    # AOF 를 켠다. 시스템 구성서 3장은 「Redis 에는 복제도 백업도 두지 않는다. 정지하면 내용이 사라지므로 재생성 가능한
    # 데이터만 보관한다」고 정했는데, 그것은 내구성(백업) 방침이다. 여기서 켜는 것은 재시작 생존(persistence)이고 둘은 다르다 —
    # 리프레시 토큰이 Redis 에 있어 배포로 컨테이너를 재생성하기만 해도 전 사용자가 로그아웃된다. 노드가 사라지면
    # 데이터도 사라진다는 방침은 그대로다(볼륨은 이 노드 안에 있고 백업 대상이 아니다).
    # everysec 은 최대 1초치 손실을 받아들이는 대신 요청 경로에 fsync 를 두지 않는다.
    command: ["sh", "-c", "exec redis-server --maxmemory 64mb --maxmemory-policy volatile-lru --appendonly yes --appendfsync everysec $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: Asia/Seoul
    volumes:
      - redisdata:/data
    # 외부 바인딩 금지 — 앱은 Compose 네트워크로 닿는다. 호스트 포트를 열지 않는다
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    profiles: ["db"]
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    # 저장소 자원 상한 — 시스템 구성서 3장. 이미지 기본값(shared_buffers 128MB · max_connections 100)은
    # 이 노드에 들어오지 않는다.
    #
    # **이 상한은 최악값을 담지 못한다. 실측에서 잡았다.** 담지 못하는 항을 적어 둔다 —
    #   공유 메모리 세그먼트 전체는 약 80 MiB 다 — shared_buffers 64MB 에 wal_buffers · lock table · PGPROC 등이 더 붙는다
    #   백엔드마다 relcache · plan cache 가 따로 잡힌다(커넥션당 1.5~3 MiB)
    #   work_mem 은 커넥션당이 아니라 질의 안의 정렬 · 해시 노드마다 잡힌다
    #   Flyway 의 CREATE INDEX 는 autovacuum 과 별개로 maintenance_work_mem 을 한 번 더 잡는다
    # 전부 더한 최악은 300~360 MiB 이고 256m 으로 담을 수 없다. **담으려면 앱 슬롯을 실측에 더 가깝게
    # 조여야 하는데, 둘 다 담을 수 있는 배분은 이 노드 크기에 없다**(2026-09-23 결정).
    #
    # 그 최악이 지금 성립하기 어려운 이유는 셋이다 —
    #   데이터베이스가 36 MB 로 작아 자주 읽는 페이지가 shared_buffers 안에 머문다(실측)
    #   앱 풀이 슬롯당 8, 둘이 16 이라 커넥션 32 가 동시에 정렬하는 상태가 오지 않는다
    #   실사용이 89 MiB 다(그것도 shared_buffers 128MB · max_connections 100 인 기본값 구성에서 잰 값이다)
    # **셋 중 하나라도 바뀌면 이 산정을 다시 본다.** 트래픽 증가 · DB 증가 · 앱 풀 크기 변경이 그 신호다.
    #
    # 초기화 — postgres-standby 와 같은 스크립트(infra/postgres/bootstrap.sh). 평시에는 받을 곳이 비어 아무것도 하지 않고
    # 이미지 기본 동작(빈 볼륨이면 initdb, 있으면 기존 데이터로 기동) 그대로다. 페일백 때만 빈 볼륨에 postgres-standby 에서
    # 받아 standby 로 뜬다(운영 절차서 6.2). sh 로 부른다 — 마운트한 파일의 실행 비트에 기대지 않는다
    entrypoint: ["/bin/sh", "/usr/local/bin/rental-bootstrap.sh"]
    tmpfs:
      - /run/replication:size=64k,mode=0700
    # 서버 설정(-c 인자)은 standby 와 같은 목록을 쓴다 — 파일 위쪽 x-postgres-command
    command: *postgres-command
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 받을 곳 — 운영(infra/.env)에서는 비워 둔다. 페일백 때만 postgres-standby(운영 절차서 6.2)
      PG_BOOTSTRAP_FROM: ${PG_BOOTSTRAP_FROM:-}
      # 복제 계정 — 페일백 때 postgres-standby 에서 받는 데 쓴다. 비밀번호는 tmpfs 의 비밀번호 파일로만 옮겨진다
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
      PGPASSFILE: /run/replication/pgpass
      # 컨테이너 안 도구(date 등)의 시간대. PostgreSQL 로그 시각은 이 값이 아니라 x-postgres-command 의 log_timezone 이 맞춘다
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 접속 규칙 — x-postgres-command 의 hba_file. standby 와 같은 파일이다
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # 초기화 스크립트 — standby 와 같은 파일이다
      - ./postgres/bootstrap.sh:/usr/local/bin/rental-bootstrap.sh:ro
      # 아카이브 스크립트 — x-postgres-command 의 archive_command 가 부른다. standby 와 같은 파일이다
      - ./postgres/archive-wal.sh:/usr/local/bin/rental-archive-wal.sh:ro
      # WAL 아카이브 — x-postgres-command 의 archive_command 가 쓰는 자리. standby 와 같은 호스트 디렉터리다.
      # 호스트 디렉터리는 70:backup 2770 — 컨테이너 postgres(uid 70)가 쓰고 백업 계정이 정리한다(삭제는 디렉터리 쓰기
      # 권한만 있으면 된다). 없는 경로면 Docker 가 root 소유로 만들어 아카이브가 실패하므로 노드 적용 때 먼저 만든다.
      - /var/backups/rental/wal:/archive/wal
    # 호스트 루프백 게시 — 논리 백업(infra/backup/pg-dump.sh)이 호스트의 pg_dump 로 TCP 접속한다. 정기 작업은 backup 계정으로
    # 도는데 그 계정은 docker 그룹이 아니라 docker compose exec 를 쓸 수 없다(서버 운영 기반 설계서 6.2).
    # 루프백인 이유 — Docker 게시 포트는 호스트 방화벽을 우회하므로(설계서 3.3) 막는 수단이 바인딩 주소뿐이다.
    # 다른 게시 포트와 같은 셋째 겹(컨테이너 포트 루프백 바인딩)이라 새 접근면이 생기지 않는다. 단일 노드의 앱은 여전히 Compose 네트워크로 닿는다.
    #
    # 게시 주소 PG_PUBLISH_ADDR — 단일 노드는 비워 둔다(루프백, 기본값). DB 노드(DB-01)는 그 노드의 사설 IP 하나다 —
    # 다른 노드(APP-01 의 앱 · DB-02 의 standby)가 붙어야 하는 포트라서다(서버 운영 기반 설계서 3.3 「예외 — DB 노드의 5432」).
    # 0.0.0.0 은 쓰지 않는다. 게시 포트는 firewalld 를 우회하므로 이 포트의 방어는 보안 그룹 · 사설 서브넷이 맡는다.
    ports:
      - "${PG_PUBLISH_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 스트리밍 복제 standby(INF-03) — 비동기 · 물리 슬롯 standby_1(인프라 기술 스택 3장).
  # 단일 노드(프로필 app,db,standby)에서는 **같은 노드의 컨테이너다** — 전환 절차를 검증하는 자리이고,
  # 노드 장애에는 primary 와 함께 사라진다 — 노드 장애 대응은 성립하지 않는다. 3노드에서는 DB-02 에 이것만 뜬다(프로필 standby).
  # 트래픽을 받지 않는다. 앱은 postgres 만 본다. 단일 노드에서는 primary 에 Compose 네트워크로 붙고, DB-02 에서는 DB-01 사설 IP 로 붙는다.
  postgres-standby:
    profiles: ["standby"]
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    # primary 와 같다 — 승격되면 primary 역할을 한다
    mem_limit: 256m
    # 초기화 — 데이터 디렉터리가 비었을 때만 primary(postgres)에서 슬롯 standby_1 로 받는다. 받는 방법 · 복제 비밀번호를
    # 볼륨에 남기지 않는 이유는 초기화 스크립트(infra/postgres/bootstrap.sh) 머리 주석. postgres 와 같은 스크립트다.
    tmpfs:
      - /run/replication:size=64k,mode=0700
    # sh 로 부른다 — 마운트한 파일의 실행 비트에 기대지 않는다
    entrypoint: ["/bin/sh", "/usr/local/bin/rental-bootstrap.sh"]
    command: *postgres-command
    environment:
      # 받을 곳과 슬롯 — 초기화 스크립트. 슬롯은 primary 에 노드 적용 때 미리 만든다.
      # 받을 곳 PG_STANDBY_FROM — 단일 노드는 비워 둔다(postgres, 기본값). DB-02 는 DB-01 사설 IP 다
      PG_BOOTSTRAP_FROM: ${PG_STANDBY_FROM:-postgres}
      PG_BOOTSTRAP_SLOT: standby_1
      # 복제 계정 — 역할은 노드 적용 때 primary 에서 만든다. postgres 에도 같은 값을 넘긴다(페일백 때 이쪽에서 받는다)
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-}
      # 위 tmpfs 안. libpq 가 이 변수로 비밀번호 파일을 찾는다 — pg_basebackup 과 서버의 walreceiver 모두
      PGPASSFILE: /run/replication/pgpass
      # healthcheck 의 pg_isready 가 접속 이름으로만 쓴다(없으면 root 로 붙어 5초마다 「role does not exist」 로그가 남는다).
      # 소유자 비밀번호는 넘기지 않는다 — standby 는 initdb 를 하지 않는다
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      TZ: Asia/Seoul
    volumes:
      - pgdata-standby:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/bootstrap.sh:/usr/local/bin/rental-bootstrap.sh:ro
      - ./postgres/archive-wal.sh:/usr/local/bin/rental-archive-wal.sh:ro
      # WAL 아카이브 — postgres 와 같은 호스트 디렉터리(그쪽 주석). 복구 중에는 쓰지 않고 승격하면 이어서 쓴다
      - /var/backups/rental/wal:/archive/wal
    # 복구 중 일관된 지점에 닿기 전에는 pg_isready 가 거부(1)를 돌려준다 — 받은 뒤 읽기 연결을 받을 때 healthy 다.
    # start_period 는 첫 기동의 pg_basebackup 몫이다(DB 36 MB — 2026-09-23 실측).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    # 승격 뒤 앱이 붙는 자리. 단일 노드는 5432 를 primary 가 쓰므로 루프백 5433(기본값), DB-02 는 자기 사설 IP 의 5432 다
    # (PG_STANDBY_PUBLISH_ADDR · PG_STANDBY_PUBLISH_PORT). 0.0.0.0 을 쓰지 않는 이유는 postgres 의 ports 주석과 같다
    ports:
      - "${PG_STANDBY_PUBLISH_ADDR:-127.0.0.1}:${PG_STANDBY_PUBLISH_PORT:-5433}:5432"
    depends_on:
      # required: false — 3노드에서는 postgres 가 다른 노드(DB-01)라 이 노드의 활성 프로필에 없다(x-app 의 depends_on 주석)
      postgres:
        condition: service_healthy
        required: false

  # ── 관측 수집기(INF-05)────────────────────────────────────────────────
  # 노드에는 수집과 전송만 둔다. 저장 · 시각화 · 알림은 노드 밖(Grafana Cloud)이다.
  # 포트는 전부 호스트 루프백이다 — 밖에서 긁지 않고 prom-agent 가 노드 안에서 긁어 밖으로 민다.
  # 수집기에는 env_file: .env 를 주지 않는다 — 앱 · DB · 외부 API 비밀이 수집기 환경에 통째로 들어간다.
  # 필요한 변수만 environment 로 넘긴다.

  # 지표 수집 · 전송 — Prometheus agent 모드. 스크레이프 대상과 remote_write 는 prometheus/agent.yml
  prom-agent:
    profiles: ["app"]
    image: prom/prometheus:v3.6.0
    # 호스트 네트워크 — 대상이 전부 호스트 루프백(127.0.0.1:9100 · 9121 · 9187)이라 여기서 127.0.0.1 이 호스트를 가리켜야 한다.
    # 컨테이너 IP 로 긁으면 재생성 때 IP 가 바뀌어 대상이 사라진다.
    network_mode: host
    restart: unless-stopped
    logging: *logging
    mem_limit: 150m
    # Prometheus 는 설정 파일 안의 환경 변수를 풀지 못한다. 저장소의 agent.yml 은 @이름@ 자리표시자가 든 틀이고,
    # 기동할 때마다 이 셸이 환경 변수로 채운 사본을 /tmp(tmpfs — 메모리)에 써서 그것으로 기동한다. 자격 증명이
    # 노드 디스크 · 저장소에 남지 않는다.
    #   - 이미지(busybox 기반)에 /bin/sh · awk 가 있다(busybox 1.36.1, v3.6.0 이미지에서 확인). sed 대신 awk 인 이유 —
    #     sed 의 s 명령은 값 안의 구분자와 & 를 특수 문자로 읽는다. awk 의 index · substr 로 글자 그대로 붙인다.
    #   - 값 안의 ' 는 '' 로 바꾼다(자리표시자가 YAML 작은따옴표 안에 있다).
    #   - 셋 중 하나라도 비어 있으면 기동을 실패시킨다 — 빈 자격 증명으로 조용히 돌며 401 만 쌓는 상태를 만들지 않는다.
    #     restart: unless-stopped 가 재시도하고 docker compose ps 에 Restarting 으로 드러난다.
    # $$ 는 Compose 가 변수로 풀지 않게 한 것이다(컨테이너 안에서는 $).
    #
    # --web.listen-address — 호스트 네트워크라 기본값(0.0.0.0:9090)이면 노드의 모든 주소에 열린다.
    # 다른 게시 포트와 같이 루프백에만 둔다(시스템 구성서 4장, 셋째 겹). 노드 안에서 대상 확인(/api/v1/targets)에만 쓴다.
    #
    # GOMEMLIMIT 은 따로 주지 않는다 — Prometheus v3 는 --auto-gomemlimit 이 기본으로 켜져 있어 cgroup 상한(150m)의
    # 0.9 를 GOMEMLIMIT 으로 잡는다(--auto-gomemlimit.ratio 기본 0.9). v3.6.0 을 상한 150m 으로 띄워 기동 로그의
    # 「GOMEMLIMIT is updated … GOMEMLIMIT=141557760」(150 MiB × 0.9)을 확인했다.
    tmpfs:
      - /tmp:size=1m,mode=1777
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        awk -v keys="GRAFANA_CLOUD_PROM_URL GRAFANA_CLOUD_PROM_USER GRAFANA_CLOUD_PROM_TOKEN" '
          BEGIN {
            n = split(keys, k, " ")
            for (i = 1; i <= n; i++) if (ENVIRON[k[i]] == "") { print "prom-agent: " k[i] " 가 비어 있다 — infra/.env" > "/dev/stderr"; bad = 1 }
            if (bad) exit 1
            for (i = 1; i <= n; i++) { v[i] = ENVIRON[k[i]]; gsub("\047", "\047\047", v[i]) }
          }
          {
            s = $$0
            for (i = 1; i <= n; i++) {
              t = "@" k[i] "@"; o = ""
              while ((p = index(s, t)) > 0) { o = o substr(s, 1, p - 1) v[i]; s = substr(s, p + length(t)) }
              s = o s
            }
            print s
          }
        ' /etc/prometheus/agent.yml > /tmp/agent.yml
        exec /bin/prometheus --agent --config.file=/tmp/agent.yml --storage.agent.path=/prometheus --web.listen-address=127.0.0.1:9090
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_PROM_TOKEN: ${GRAFANA_CLOUD_PROM_TOKEN:-}
      TZ: Asia/Seoul
    volumes:
      - ./prometheus/agent.yml:/etc/prometheus/agent.yml:ro
      # agent WAL. 전송이 끊긴 동안의 표본이 여기 남았다가 다시 붙으면 나간다
      - promagent:/prometheus

  # 로그 수집 · 전송 — 컨테이너 로그를 Docker API 로 읽어 Loki 로 보낸다. 설정은 vector/vector.toml
  vector:
    profiles: ["app"]
    image: timberio/vector:0.50.0-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 150m
    command: ["--config", "/etc/vector/vector.toml"]
    environment:
      # Vector 는 설정 안의 ${이름} 을 스스로 푼다 — prom-agent 와 달리 렌더 단계가 없다
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_LOKI_TOKEN: ${GRAFANA_CLOUD_LOKI_TOKEN:-}
      TZ: Asia/Seoul
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      # Docker 소켓 — 컨테이너 로그를 이름 · Compose 서비스 라벨과 함께 읽는다.
      # **:ro 는 소켓 파일의 쓰기만 막고 API 는 막지 않는다.** 소켓에 닿으면 Docker API 전체를 쓸 수 있고
      # 그것은 호스트 root 와 같다. 이 대가를 받아들이는 조건은 Vector 가 받는 면이 없다는 것이다 —
      # 관리 API 를 껐고([api] enabled = false) 포트를 게시하지 않으며 나가는 전송만 한다. 받는 포트를 여는 변경
      # (source 추가 · API 켜기)이 들어오면 이 조건이 깨진다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 읽은 위치(체크포인트). 없으면 재시작 때 로그를 다시 보내거나 빠뜨린다
      - vectordata:/var/lib/vector

  # 호스트 지표. 호스트 네트워크 · 호스트 PID · 호스트 루트 읽기 전용 — node exporter 공식 README 의 Docker 예시 그대로다.
  # README 는 호스트를 재는 도구를 컨테이너에 넣으려면 호스트 네임스페이스에 닿는 이 설정들이 필요하다고 적는다.
  node-exporter:
    profiles: ["app"]
    image: quay.io/prometheus/node-exporter:v1.9.1
    network_mode: host
    pid: host
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    # 호스트 네트워크라 바인딩 주소가 곧 노출 범위다. 루프백에만 연다(시스템 구성서 4장, 셋째 겹)
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    environment:
      TZ: Asia/Seoul
    volumes:
      # rslave — 호스트에 나중에 붙는 마운트(NAS 등)도 컨테이너 안에 보이게 한다. 파일시스템 지표가 그것을 센다.
      # **여기에 :z · :Z 를 붙이지 않는다** — SELinux 가 호스트 / 전체의 레이블을 다시 쓴다.
      - /:/host:ro,rslave

  # PostgreSQL 지표. 전용 역할로 붙는다 — 앱 소유자 역할의 비밀번호를 수집기에 주지 않는다(pg_monitor 멤버, 최고 권한 아님).
  # 역할은 노드 적용 때 만든다. 앱과 같이 Compose 네트워크로 postgres 에 닿는다.
  # 프로필은 app 이다 — 3노드에서도 APP-01 에 남아 DB_HOST(DB-01 사설 IP)로 postgres 에 붙는다.
  postgres-exporter:
    profiles: ["app"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    environment:
      # 호스트는 앱과 같은 DB_HOST — 페일오버(운영 절차서 6.1) 뒤에도 현재 primary 를 본다
      DATA_SOURCE_URI: ${DB_HOST:-postgres}:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_MONITOR_USER:-}
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD:-}
      TZ: Asia/Seoul
    # 호스트 루프백 게시 — prom-agent(호스트 네트워크)가 127.0.0.1 로 긁는다. 다른 게시 포트와 같은 셋째 겹이다
    ports:
      - "127.0.0.1:9187:9187"
    # required: false — 3노드에서는 postgres 가 다른 노드라 이 노드의 활성 프로필에 없다(x-app 의 depends_on 주석).
    # 짧은 형식(- postgres)에는 required 를 줄 수 없어 긴 형식으로 쓴다. condition 은 짧은 형식의 기본값 그대로다
    depends_on:
      postgres:
        condition: service_started
        required: false

  # Redis 지표
  redis-exporter:
    profiles: ["app"]
    image: oliver006/redis_exporter:v1.78.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis

  # nginx 지표. 앞단 nginx 의 stub_status(conf.d/status.conf — 127.0.0.1:8088)를 긁는다.
  # nginx 가 호스트 네트워크이고 stub_status 를 루프백에만 열었으므로 이 서비스도 호스트 네트워크여야 거기 닿는다.
  # 호스트 네트워크라 바인딩 주소가 곧 노출 범위다. 루프백에만 연다(시스템 구성서 4장, 셋째 겹)
  nginx-exporter:
    profiles: ["app"]
    image: nginx/nginx-prometheus-exporter:1.5.3
    network_mode: host
    restart: unless-stopped
    logging: *logging
    # 같은 Go 단일 바이너리 exporter(node · postgres · redis)의 노드 실측이 8.4 ~ 9.6 MiB 다(파일 머리 표).
    # 그 셋보다 하는 일이 적어(HTTP 한 번 · 지표 몇 개) 64m 의 절반으로 둔다
    mem_limit: 32m
    command:
      - --nginx.scrape-uri=http://127.0.0.1:8088/stub_status
      - --web.listen-address=127.0.0.1:9113
    environment:
      TZ: Asia/Seoul
    depends_on:
      - nginx

volumes:
  pgdata:
  # standby 의 데이터 디렉터리. 비어 있으면 기동 때 primary 에서 받는다 — 지우면 재구축이다(postgres-standby 주석)
  pgdata-standby:
  # Redis 재시작 생존용 AOF 자리. 백업 대상이 아니다 — 위 redis 서비스 주석 참고
  redisdata:
  # prom-agent 의 WAL. 전송이 끊긴 동안의 표본 자리 — 백업 대상이 아니다
  promagent:
  # vector 의 읽은 위치 — 백업 대상이 아니다
  vectordata:
