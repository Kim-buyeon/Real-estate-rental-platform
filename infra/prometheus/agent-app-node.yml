# Prometheus agent 모드 설정의 틀 — 앱 노드(APP-02)의 지표를 긁어 Grafana Cloud 로 보낸다(INF-01 · INF-05).
# agent 모드는 로컬 저장 · 질의 · 규칙이 없고 WAL 만 둔다. 보는 곳은 노드 밖이다.
#
# **이 파일을 그대로 읽히지 않는다.** Prometheus 는 remote_write 의 주소 · 자격 증명 자리에서 환경 변수를 풀지 못한다.
# 그래서 자격 증명 · 노드 이름 · 슬롯 주소 자리에 @이름@ 자리표시자를 두고,
# 기동 시 prom-agent-app-node 서비스의 셸(prom-agent 와 같은 셸)이 infra/.env 에서 온 환경 변수로 채운 사본을 컨테이너 안
# tmpfs(/tmp)에만 써서 그 사본으로 기동한다 — infra/docker-compose.yml 의 prom-agent · prom-agent-app-node 주석.
# 값은 저장소에도 노드 디스크에도 남지 않는다.
# 자리표시자는 작은따옴표 안에 둔다 — 값에 : · # 이 들어가도 YAML 이 깨지지 않는다(값 안의 ' 는 기동 셸이 '' 로 바꾼다).
#
# APP-01 의 틀(agent.yml)과 나눈 이유 — 처음(#255)에는 앱 노드에 nginx · redis 가 없었다. 입구 이중화(#404)부터 이 노드에도 nginx · redis 와
# 그 exporter 가 떠서 대상이 agent.yml 과 같아졌다 — 남은 차이는 node 라벨을 .env 에서 받는 것뿐이다. 두 틀을 합치는 일은 따로 한다
# (agent.yml 의 node 라벨도 자리표시자로 바꾸면 하나로 된다 — 이번 변경에서는 반영 위험을 줄이려고 APP-01 쪽 라벨을 건드리지 않았다).

global:
  scrape_interval: 15s
  # 받는 쪽에서 노드를 가르는 라벨. 값은 노드의 infra/.env 에서 온다(app-02). APP-01 의 틀은 app-01 로 고정이다
  external_labels:
    node: '@RENTAL_NODE@'

scrape_configs:
  # 호스트 지표. prom-agent-app-node 가 호스트 네트워크라 루프백이 호스트를 가리키고, node exporter 는 루프백에 바인딩한다
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
    # systemd 유닛 상태(관측 설계서 3.2 O14) — 수집기는 유닛마다 상태 다섯 줄(active · activating · deactivating · inactive · failed)을 낸다.
    # 알림 후보는 실패뿐이라(5.3) state="failed" 줄만 남긴다. RE2 에 부정 전방 탐색이 없어 나머지 넷을 버린다
    metric_relabel_configs:
      - source_labels: [__name__, state]
        regex: 'node_systemd_unit_state;(active|activating|deactivating|inactive)'
        action: drop

  # Redis · Nginx — exporter 가 호스트 루프백에 게시(redis)하거나 루프백에 바인딩(nginx)한다(#404 — agent.yml 의 같은 잡)
  - job_name: redis
    static_configs:
      - targets: ["127.0.0.1:9121"]

  - job_name: nginx
    static_configs:
      - targets: ["127.0.0.1:9113"]

  # 앱 두 슬롯(app-1 · app-2). **대상 주소가 루프백이 아니다** — 이 노드의 슬롯은 상대 노드의 nginx 가 닿도록 노드 사설 IP
  # 하나에만 게시된다(APP_PUBLISH_ADDR, docker-compose.yml 의 app-1 주석). 게시가 그 주소에만 걸리므로 127.0.0.1 로는 닿지 않는다.
  # 게시 주소와 같은 값을 받아 긁는다 — 두 곳에 IP 를 적지 않는다.
  # instance 라벨이 <사설 IP>:8081 · :8082 가 되어 APP-01 슬롯(10.20.0.10:…)과도 갈린다. node 라벨이 함께 붙는다.
  # 앱은 이 경로를 인증 없이 연다(agent.yml 의 app 잡 주석). 이 노드에서는 그 경로가 사설망에 게시된 포트 위에 있어
  # 보안 그룹이 막는다 — 다만 두 앱 노드가 단 rental-app 이 NAT 때문에 사설 두 서브넷 전체를 받아 DB 노드에서는 닿는다(시스템 구성서 4장, 후속으로 좁힌다).
  # 배포 중 내려간 슬롯은 그동안 down 으로 보인다
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['@APP_PUBLISH_ADDR@:8081', '@APP_PUBLISH_ADDR@:8082']

remote_write:
  - url: '@GRAFANA_CLOUD_PROM_URL@'
    basic_auth:
      username: '@GRAFANA_CLOUD_PROM_USER@'
      password: '@GRAFANA_CLOUD_PROM_TOKEN@'
