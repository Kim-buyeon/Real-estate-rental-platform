# postgres exporter 사용자 질의 — 내장 수집기로 거두지 못하는 넷(관측 설계서 3.3 D2 · D5 · D6 · D12, 3.4 S1, INF-05).
# 운영 Compose 의 postgres-exporter 가 --extend.query-path 로 읽는다. 키(최상위 이름)가 지표 이름의 앞부분이고
# 열 이름이 뒤에 붙는다 — rental_pg_sessions 의 count 열은 rental_pg_sessions_count 다.
#
# 이름을 rental_pg_ 로 시작하는 이유 — 내장 수집기의 pg_* 와 섞이지 않게 한다. 정기 작업 지표(rental_job_*)와 같은 머리다.
#
# 질의는 수집기가 접속한 데이터베이스(DATA_SOURCE_URI 의 POSTGRES_DB — 앱 DB)에서 돈다. 접속 역할은 pg_monitor 멤버라
# pg_stat_activity 의 다른 역할 행 · pg_stat_statements 를 볼 수 있다(인프라 기술 스택 4.1).
#
# **질의 하나가 실패해도 나머지 지표는 나온다**(v0.18.1 — cmd/postgres_exporter/namespace.go 의 queryNamespaceMappings 가
# 키마다 따로 돌고 오류를 로그로만 남긴다). 실패하면 그 키의 지표만 빠지고 pg_exporter_last_scrape_error 가 1 이 된다.
# 앱 DB 에 pg_stat_statements 확장이 없으면 rental_pg_top_statements 가 그렇게 빠진다(로컬 Docker 로 확인 — #357).
# 확장은 반영 때 primary 의 앱 DB 에 만든다 — 운영 절차서 2장 「질의 통계」와 같은 손 작업이고, 복제로 standby 에도 생긴다.
#
# 이 파일에 질의를 더하는 것은 v0.18.1 README 에 「deprecated」로 적혀 있으나 동작한다. 같은 일을 하는 내장 수집기가
# 생기면 그쪽으로 옮긴다(#357 계획 「정한 것」).
#
# 시계열 수 — 활동에 따라 늘지 않게 라벨을 고정된 짧은 목록으로만 둔다. 줄 수 상한은 키마다 적었다.

# D2 · D6 — 상태별 · 대기 종류별 연결 수(클라이언트 연결만, 이 질의 자신은 뺀다).
# 내장 pg_stat_activity_count 는 라벨이 일곱(datname · state · usename · application_name · backend_type ·
# wait_event_type · wait_event)이라 활동이 늘면 시계열이 불어난다 — 수집기(agent-db.yml)에서 버리고 이것이 대신한다.
# D2 의 비율은 sum by (state) 를 아래 rental_pg_max_connections 로 나눈다. D6 은 state="active" 로 거른다.
# wait_event_type 이 비어 있는 활성 연결은 CPU 에서 도는 중이다(관측 설계서 3.3 D6) — 라벨 값 none 으로 낸다.
# 상한 — state 여섯 × 대기 종류 열한 가지(PG 17 의 열 가지 + 우리가 붙이는 none)이나 실제로는 몇 줄이다. 0 인 조합은 줄이 없다
rental_pg_sessions:
  query: |
    SELECT COALESCE(state, 'unknown') AS state,
           COALESCE(wait_event_type, 'none') AS wait_event_type,
           count(*) AS count
    FROM pg_stat_activity
    WHERE backend_type = 'client backend'
      AND pid <> pg_backend_pid()
    GROUP BY 1, 2
  metrics:
    - state:
        usage: "LABEL"
        description: "연결 상태(active · idle · idle in transaction …)"
    - wait_event_type:
        usage: "LABEL"
        description: "대기 종류(Lock · LWLock · IO · Client · IPC …). none 은 대기 없음 — 활성이면 CPU"
    - count:
        usage: "GAUGE"
        description: "클라이언트 연결 수"

# D2 의 분모 — max_connections(운영 Compose x-postgres-command). 설정값 지표(pg_settings_*)를 통째로 끄므로(--disable-settings-metrics)
# 이 하나만 따로 낸다. 이름은 키 rental_pg 와 열 이름이 붙은 rental_pg_max_connections 다. 상한 — 한 줄
rental_pg:
  query: |
    SELECT current_setting('max_connections')::int AS max_connections
  metrics:
    - max_connections:
        usage: "GAUGE"
        description: "max_connections 설정값 — 연결 수 비율의 분모"

# D5 — 다른 세션에 막힌 세션 수와 가장 오래 막힌 시간.
# pg_blocking_pids() 가 비지 않은 세션이 막힌 세션이다. 막힌 시간은 기다리는 잠금의 pg_locks.waitstart(PG 14 이상)로 잰다.
# pg_blocking_pids() 는 잠금 대기 중(wait_event_type = 'Lock')인 세션에만 부른다 — PG 문서: 「잠금 관리자의 공유 상태에 잠깐
# 배타적으로 접근해야 하므로 자주 부르면 데이터베이스 성능에 영향이 있을 수 있다」(PG 17 「System Information Functions」).
# 걸러 낸 뒤에 부르는 순서는 MATERIALIZED CTE 로 고정한다 — WHERE 절 안의 조건 순서는 플래너가 바꿀 수 있다.
# 막힌 세션이 없으면 0 · 0 이다. 상한 — 두 줄
rental_pg_blocked:
  query: |
    WITH waiting AS MATERIALIZED (
      SELECT pid FROM pg_stat_activity WHERE wait_event_type = 'Lock'
    ), blocked AS MATERIALIZED (
      SELECT pid FROM waiting WHERE cardinality(pg_blocking_pids(pid)) > 0
    )
    SELECT count(DISTINCT b.pid) AS sessions,
           COALESCE(EXTRACT(EPOCH FROM max(now() - l.waitstart)), 0)::float8 AS max_wait_seconds
    FROM blocked b
    LEFT JOIN pg_locks l ON l.pid = b.pid AND NOT l.granted
  metrics:
    - sessions:
        usage: "GAUGE"
        description: "다른 세션에 막힌 세션 수"
    - max_wait_seconds:
        usage: "GAUGE"
        description: "막힌 세션 중 가장 오래 기다린 시간(초)"

# D12 — 주요 테이블의 가시성 맵 비율(relallvisible ÷ relpages). 인덱스 전용 스캔이 테이블을 다시 읽는 정도의 원천이다.
# 두 값은 VACUUM · ANALYZE 때 갱신되는 통계다. 빈 테이블(relpages 0)은 1 로 낸다 — 다시 읽을 페이지가 없다.
# 대상 여섯은 agent-db.yml 의 테이블별 통계 relabel 과 같은 목록이다(#353 실측 행 수 상위 — #357). 상한 — 여섯 줄
rental_pg_table_visibility:
  query: |
    SELECT c.relname,
           CASE WHEN c.relpages > 0 THEN c.relallvisible::float8 / c.relpages ELSE 1 END AS ratio
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public'
      AND c.relkind = 'r'
      AND c.relname IN ('property', 'risk_analysis', 'ownership_history',
                        'building_registry', 'mortgage_history', 'building_ledger')
  metrics:
    - relname:
        usage: "LABEL"
        description: "테이블 이름"
    - ratio:
        usage: "GAUGE"
        description: "전부 보이는 페이지 비율(relallvisible ÷ relpages)"

# S1 — 질의 통계 상위 10(총 실행 시간 순). 평균은 total_exec_time ÷ calls 로 받는 쪽에서 나눈다.
# 내장 stat_statements 수집기는 쓰지 않는다 — 상위 100 고정(v0.18.1)이고 논리적 읽기 · 임시 블록 열이 없다(#357).
# 범위 — 이 데이터베이스(앱 DB)의 질의만, 이 수집기 역할 자신의 질의는 뺀다. 수집기가 15초마다 도는 질의가 상위 칸을
# 차지한다(부하 시험 결과서 perf-cards-20260928 — 집계 스크립트도 같은 이유로 뺀다). 같은 queryid 가 여러 역할에서
# 돌았으면 합친다. 값은 누적이다 — 증가량(rate)으로 본다. 순위가 바뀌면 queryid 줄이 바뀌므로 시계열이 늘어난다
# (관측 설계서 3.4 S1). 상한 — 열 여섯 × 열 줄
rental_pg_top_statements:
  query: |
    SELECT queryid::text AS queryid,
           sum(total_exec_time) / 1000 AS total_exec_time_seconds,
           sum(calls) AS calls,
           sum(rows) AS rows,
           sum(shared_blks_hit) AS shared_blks_hit,
           sum(shared_blks_read) AS shared_blks_read,
           sum(temp_blks_written) AS temp_blks_written
    FROM pg_stat_statements
    WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
      AND userid <> (SELECT oid FROM pg_roles WHERE rolname = current_user)
      AND queryid IS NOT NULL
    GROUP BY queryid
    ORDER BY 2 DESC
    LIMIT 10
  metrics:
    - queryid:
        usage: "LABEL"
        description: "pg_stat_statements 의 질의 ID — 문장은 운영 절차서 2장 「질의 통계」로 찾는다"
    - total_exec_time_seconds:
        usage: "COUNTER"
        description: "누적 실행 시간(초)"
    - calls:
        usage: "COUNTER"
        description: "누적 호출 수"
    - rows:
        usage: "COUNTER"
        description: "누적 반환 · 영향 행 수"
    - shared_blks_hit:
        usage: "COUNTER"
        description: "누적 공유 버퍼 적중 블록 — 논리적 읽기 중 메모리"
    - shared_blks_read:
        usage: "COUNTER"
        description: "누적 공유 버퍼 밖에서 읽은 블록 — 논리적 읽기 중 디스크 · page cache"
    - temp_blks_written:
        usage: "COUNTER"
        description: "누적 임시 파일 쓰기 블록"
