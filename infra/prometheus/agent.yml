# Prometheus agent 모드 설정의 틀 — APP-01 노드의 지표를 긁어 Grafana Cloud 로 보낸다(INF-05).
# agent 모드는 로컬 저장 · 질의 · 규칙이 없고 WAL 만 둔다. 보는 곳은 노드 밖이다.
#
# **이 파일을 그대로 읽히지 않는다.** Prometheus 는 remote_write 의 주소 · 자격 증명 자리에서 환경 변수를 풀지 못한다.
# 그래서 자격 증명 자리에 @이름@ 자리표시자를 두고,
# 기동 시 prom-agent 서비스의 셸이 infra/.env 에서 온 환경 변수로 채운 사본을 컨테이너 안 tmpfs(/tmp)에만
# 써서 그 사본으로 기동한다 — infra/docker-compose.yml 의 prom-agent 주석. 값은 저장소에도 노드 디스크에도 남지 않는다.
# 자리표시자는 작은따옴표 안에 둔다 — 값에 : · # 이 들어가도 YAML 이 깨지지 않는다(값 안의 ' 는 기동 셸이 '' 로 바꾼다).

global:
  scrape_interval: 15s
  # 받는 쪽에서 노드를 가르는 라벨. 노드가 늘면 노드마다 이 값만 다르다
  external_labels:
    node: app-01

# 대상은 앱 슬롯(아래 app 잡)을 빼고 전부 127.0.0.1 이다. prom-agent 가 호스트 네트워크라 루프백이 호스트를 가리키고, exporter 는
# 호스트 루프백에 게시되거나(redis · app) 루프백에 바인딩한다(node · nginx). 컨테이너 IP 로 긁지 않는다 —
# 컨테이너를 다시 만들면 IP 가 바뀐다.
# PostgreSQL 은 여기서 긁지 않는다 — postgres exporter 는 DB 노드마다 있고 그 노드의 수집기(agent-db.yml)가 긁는다(#357).
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
    # systemd 유닛 상태(관측 설계서 3.2 O14) — 수집기는 유닛마다 상태 다섯 줄(active · activating · deactivating · inactive · failed)을 낸다.
    # 알림 후보는 실패뿐이라(5.3) state="failed" 줄만 남긴다. RE2 에 부정 전방 탐색이 없어 나머지 넷을 버린다
    metric_relabel_configs:
      - source_labels: [__name__, state]
        regex: 'node_systemd_unit_state;(active|activating|deactivating|inactive)'
        action: drop

  - job_name: redis
    static_configs:
      - targets: ["127.0.0.1:9121"]

  - job_name: nginx
    static_configs:
      - targets: ["127.0.0.1:9113"]

  # 앱 두 슬롯(app-1 · app-2). 슬롯은 instance 라벨(<게시 주소>:8081 · :8082)로 갈린다.
  # **대상 주소는 슬롯의 게시 주소다**(APP_PUBLISH_ADDR — 운영 Compose 의 prom-agent 주석). 입구 이중화(#404)부터 APP-01 슬롯도
  # 상대 노드의 Nginx 가 닿도록 사설 IP 하나(10.20.0.10)에만 게시되어 루프백으로는 닿지 않는다. 비우면 127.0.0.1(단일 노드 · 3노드).
  # instance 라벨이 127.0.0.1:… 에서 10.20.0.10:… 로 바뀐다 — 대시보드가 instance 값을 고정해 두었다면 함께 본다.
  # 앱은 이 경로를 인증 없이 열고, 밖에서는 앞단 Nginx 가 /actuator 를 404 로 막는다 — 사설망에서는 보안 그룹이 막는다.
  # 배포 중 내려간 슬롯은 그동안 down 으로 보인다
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['@APP_PUBLISH_ADDR@:8081', '@APP_PUBLISH_ADDR@:8082']

remote_write:
  - url: '@GRAFANA_CLOUD_PROM_URL@'
    basic_auth:
      username: '@GRAFANA_CLOUD_PROM_USER@'
      password: '@GRAFANA_CLOUD_PROM_TOKEN@'
