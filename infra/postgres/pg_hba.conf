# PostgreSQL 접속 규칙 — primary · standby 가 같은 이 파일을 쓴다(docker-compose.yml 의 hba_file).
#
# 데이터 디렉터리의 pg_hba.conf 를 쓰지 않는 이유 —
#   노드에서 그 파일을 고치면 서버에서 손으로 고친 것이 되고, 볼륨을 새로 만들면 사라진다.
#   pg_basebackup 은 primary 데이터 디렉터리의 파일을 복사할 뿐 hba_file 이 가리키는 바깥 파일을 따라가지 않는다.
#   승격된 standby 에도 복제 규칙이 있어야 페일백 때 구 primary 가 그쪽에 붙는다 — 그래서 둘 다 이 파일을 마운트한다.
#
# 복제 · 물리 백업 줄을 빼면 아래는 postgres:17-alpine 이미지가 initdb 때 만든 규칙 그대로다(노드의 primary 에서 확인한 내용을 옮겼다).
# 컨테이너 안 루프백 · 소켓은 trust, 그 밖은 scram-sha-256.
# 논리 백업(infra/backup)은 호스트 루프백 게시 → docker-proxy 를 거쳐 브리지 게이트웨이 주소로 들어오므로
# 컨테이너 입장에서 루프백이 아니다 — 마지막 줄(scram)에 걸린다.
#
# 파일 끝 줄바꿈 · 줄 끝이 LF 여야 한다(.gitattributes). 고친 뒤 반영은 재기동 없이
#   docker compose exec postgres psql -U <소유자> -c 'SELECT pg_reload_conf()'
# 로 되고, 반영 전 문법은 SELECT * FROM pg_hba_file_rules WHERE error IS NOT NULL 로 본다.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# 스트리밍 복제 — standby 의 walreceiver · pg_basebackup(INF-03).
# 역할 이름을 고정으로 적는다 — 이 파일에는 환경 변수를 쓸 수 없다. infra/.env 의 POSTGRES_REPLICATION_USER 와 같아야 한다.
# samenet — 서버의 인터페이스가 속한 서브넷, 곧 Compose 네트워크다. standby 가 거기서 붙는다.
# 그 서브넷에는 다른 컨테이너와 브리지 게이트웨이(호스트)도 있으므로 주소가 아니라 scram 비밀번호가 막는다.
#
# 순서 — 이 줄이 아래 「host all all all」 앞이든 뒤든 결과가 같다. DATABASE 칸의 all 은 replication 연결을
# 매치하지 않는다(replication 연결은 DATABASE 칸이 replication 인 줄에만 걸린다). 아래 줄을 옮기거나
# 이 줄을 지워도 복제가 「all」 줄로 새어 들어가지 않고 거부된다.
host    replication     replicator      samenet                 scram-sha-256

# 물리 백업 — 호스트의 pg_basebackup(infra/backup/pg-basebackup.sh, INF-04). 복제 연결이라 replication 줄이 필요하다.
# 전용 역할이다 — standby 의 replicator 자격 증명을 백업 작업이 쥐지 않게 한다. 이름은 노드의 basebackup.env 의 PGUSER 와 같아야 한다.
# samenet 인 이유 — 호스트 루프백 게시(127.0.0.1:5432)로 들어온 연결은 docker-proxy 를 거쳐 브리지 게이트웨이 주소에서
# 오므로(위 머리 주석의 논리 백업과 같다) 컨테이너 입장에서 127.0.0.1 이 아니다. 그래서 위 「127.0.0.1/32 trust」 replication
# 줄에 걸리지 않고 여기까지 내려온다 — 그 줄들이 앞서 있어도 이 연결은 비밀번호 없이 들어가지 않는다.
# 순서 — replicator 줄과 같다. USER 칸이 다르므로 서로 가로채지 않는다.
host    replication     rental_basebackup samenet               scram-sha-256

host    all             all             all                     scram-sha-256
