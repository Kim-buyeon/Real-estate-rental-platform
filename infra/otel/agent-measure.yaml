# OpenTelemetry 자바 에이전트 — 측정 모드 설정(INF-06, #378). 부하 시험 동안만 쓴다. 평시 설정은 agent.yaml.
# 노드 infra/.env 의 OTEL_AGENT_PROFILE=agent-measure 가 이 파일을 슬롯에 붙인다(운영 Compose x-app volumes).
# 켜고 끄는 절차는 chaos-harness/measure/README.md, 켜는 것 자체가 측정 조건이라 회차 기록에 남긴다.
#
# 평시(agent.yaml)와 다른 셋
#   1. 메서드 구간 — service · calculator · store · external 패키지의 메서드마다 구간을 남긴다. 요청 하나 안에서
#      "어느 함수가 시간을 먹나"를 본다. store 메서드 구간이 Redis 시간이다 — 추적에 Redis 구간이 없다(#352).
#      목록은 chaos-harness/measure/tools/gen-methods.py 가 만든다(아래 BEGIN ~ END).
#   2. 요청 밖 구간을 남긴다 — 배치 · 스케줄 · 외부 API 호출(평시는 버린다, 관측 설계서 6장). /actuator 는 그대로 버린다.
#   3. 사본을 부하 생성기의 수신기로 보낸다(OTEL_MEASURE_RECEIVER_ENDPOINT). Tempo 보존(14일) · 읽기 토큰과 무관하게
#      회차의 추적을 파일로 받는다. 파일 내보내기(otlp_file/development)는 2.31.1 에서 file:// 를 무시하고 표준 출력으로
#      내보낸다(#378 로컬 실측) — 그러면 앱 로그와 섞여 Loki 로 간다.
#
# 대가 — 구간 수와 내보내기가 는다. 슬롯 메모리 · 응답 시간에 주는 영향은 #378 로컬 실측(관측 설계서 6장 「측정 모드」).
# 형식 · 치환 규칙은 agent.yaml 머리 주석과 같다.
file_format: "1.1"

resource:
  attributes:
    - name: service.name
      value: rental-app
    - name: service.instance.id
      value: ${env:OTEL_SERVICE_INSTANCE_ID}

propagator:
  composite:
    - tracecontext:
    - baggage:

tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            endpoint: ${env:OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
            headers_list: ${env:OTEL_EXPORTER_OTLP_HEADERS}
            compression: gzip
    # 부하 생성기의 수신기(chaos-harness/measure/node/trace-receiver.sh) — 회차의 추적 사본
    - batch:
        exporter:
          otlp_http:
            endpoint: ${env:OTEL_MEASURE_RECEIVER_ENDPOINT}
            compression: gzip
  sampler:
    composite/development:
      rule_based:
        rules:
          # 수집기의 지표 긁기 · 헬스체크 — 평시와 같이 버린다
          - attribute_patterns:
              key: url.path
              included: ["/actuator/*", "/actuator"]
            span_kinds: [server]
            sampler:
              always_off:
          # 부모 없는 구간 — 업무 요청 · 배치 · 스케줄 · 외부 호출 모두 남긴다(비율 1.0)
          - parent: [none]
            sampler:
              probability:
                ratio: 1.0
          - sampler:
              parent_threshold:
                root:
                  always_off:

# BEGIN methods — chaos-harness/measure/tools/gen-methods.py 가 만든다. 손으로 고치지 않는다
