# journald 설정 조각 — 저널을 디스크에 남기고 크기에 상한을 둔다. 서버 운영 기반 설계서 7 · 8장.
# 설치 위치: /etc/systemd/journald.conf.d/50-rental.conf (root 소유 644)
# 반영: systemctl restart systemd-journald. 읽혔는지는 systemd-analyze cat-config systemd/journald.conf · journalctl --disk-usage
#
# 모니터링 밖의 정기 작업 결과는 저널이 확인 수단이다 — 재부팅에 지워지지 않게 persistent 로 둔다.
#
# 상한 1G 는 **잠정값**이다. 실측 57 MB / 2.95일 ≈ 19 MB/일(2026-09-25, 설치 작업이 몰린 기간이라 평시보다 크다).
# 월간 운영 보고가 한 달을 돌아봐야 하므로 31일 ≈ 0.6 GB 에 여유를 둔 값이다.
# 기본값(파일시스템의 10%)을 쓰지 않는 이유 — 데이터 볼륨을 나누기 전이라 Docker · 백업과 같은 루트를 나눠 쓴다.

[Journal]
Storage=persistent
SystemMaxUse=1G
