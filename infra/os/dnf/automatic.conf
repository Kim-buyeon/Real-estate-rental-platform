# dnf-automatic 설정 — 보안 갱신만 받아 설치하고 재부팅하지 않는다. 서버 운영 기반 설계서 7.2(보안 갱신 행) · 8장(패키지 갱신 행).
# 설치 위치: /etc/dnf/automatic.conf (root 소유 644) — 배포판 파일을 **통째로 대체**한다. Rocky 9(dnf4)의 dnf-automatic 형식.
# 반영: dnf install -y dnf-automatic → 이 파일로 대체 → systemctl enable --now dnf-automatic.timer
#       확인은 systemctl list-timers dnf-automatic.timer(운영 절차서 9.1), 결과는 journalctl -u dnf-automatic(설계서 7.1).
#
# 키 이름 · 섹션은 **노드에서 dnf-automatic 설치 후 배포판 파일과 diff 로 확인한다** — 이 파일은 이 PC 에서 적용해 보지 않았다.
#   cp /etc/dnf/automatic.conf /root/automatic.conf.dist   (대체 전에 떠 둔다)
#   diff /root/automatic.conf.dist /etc/dnf/automatic.conf
# 특히 reboot 는 dnf4 에서 늦게 들어온 키다 — 배포판 파일에 없으면 이 판의 dnf-automatic 은 재부팅 기능이 없는 것이고,
# 그때도 재부팅하지 않는다는 기준은 그대로 성립한다.
#
# 실행 시각은 이 파일이 아니라 dnf-automatic.timer 가 갖는다(systemctl cat dnf-automatic.timer). 03:00 을 비우는 기준
# (설계서 7.2)과 겹치는지 노드에서 본다 — 겹치면 timer 드롭인으로 옮긴다.
# 대체본에 없는 섹션([email] · [command] · [command_email])은 emit_via 가 stdio 라 쓰이지 않는다.

[commands]
# 보안 권고가 붙은 갱신만 — 기능 갱신이 운영 중인 노드의 동작을 바꾸지 않게 한다(설계서 7.2).
upgrade_type = security
# 실행 전 무작위 대기 상한(초). 세 노드가 같은 순간 NAT(APP-01)로 몰리지 않게 분산한다 — 설계서 7.2 「매일(분산)」.
random_sleep = 360
download_updates = yes
apply_updates = yes
# 자동 재부팅 없음 — 커널 갱신은 설치만 되고 월 1회 계획 재부팅 때 올라온다(운영 절차서 2장).
reboot = never

[emitters]
# 결과를 표준 출력으로 — timer 아래에서 돌므로 저널에 남는다. 메일 경로를 두지 않는다.
emit_via = stdio

[base]
# dnf 의 base 설정 덮어쓰기. 1 은 요약 수준 출력.
debuglevel = 1
