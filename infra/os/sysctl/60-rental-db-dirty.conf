# DB 노드(DB-01 · DB-02)의 「아직 디스크에 쓰지 않은 페이지」 상한 — #382, 서버 운영 기반 설계서 8장(커널 쓰기 상한 행).
# 설치 위치: /etc/sysctl.d/60-rental-db-dirty.conf (root 소유 644) → sysctl --system. 확인은 sysctl vm.dirty_ratio vm.dirty_background_ratio.
# 앱 노드에는 두지 않는다 — 큰 파일 쓰기가 없다.
#
# ── 왜 ──
#  PostgreSQL 컨테이너의 page cache 는 컨테이너 상한(PG_MEM_LIMIT — 값과 근거는 운영 Compose postgres 주석)에 과금된다. 이 두 비율은
#  cgroup 쓰기에도 같게 걸리고, 기준 메모리가 메모리 컨트롤러 상한과 노드 전체의 깨끗한 메모리로 잘린다(커널 문서 admin-guide/cgroup-v2
#  「Writeback」). 상한에 닿고 줄일 수 없으면 그 cgroup 안에서 OOM killer 가 돈다(같은 문서 memory.max).
#  standby 가 대량 쓰기를 재생하면 기본 20 · 10 에서 컨테이너 안 쓰지 않은 페이지가 108 ~ 123MB 로 머물렀고(memory.stat file_dirty),
#  복구 프로세스가 죽어 standby 가 재시작했다 — 2026-10-03 20:35 운영에서 났고 2026-10-04 DB-02 에서 재현했다(시험용 표에 1,000만 행
#  삽입, 12분 만). dmesg — CONSTRAINT_MEMCG, 파일 쓰기 경로(xfs_file_buffered_write → filemap_add_folio → try_charge_memcg, GFP_NOFS)에서
#  OOM, 그 순간 file 736MB 중 비활성 115 · 쓰지 않은 117MB, 프로세스 몫 anon 45MB. 회수할 쪽(비활성 목록)이 거의 전부 쓰지 않은
#  페이지였다 — 이것이 회수 실패의 원인이라는 것은 이 관찰에서 내린 판단이다(커널 소스로 확인하지 않았다).
#
# ── 값 ──
#  5 · 2 — 같은 재생 흐름 위 90초 비교(2026-10-04 DB-02, 데이터 볼륨 /proc/diskstats · 컨테이너 memory.stat file_dirty 2초 표본) —
#    20 · 10(기본)  재생 1.5MB/s(같은 날 앞선 비교 4.3MB/s) · 쓰지 않은 페이지 평균 115MB · 쓰기 4,299회/s · 55MB/s
#    5 · 2          재생 3.3MB/s · 쓰지 않은 페이지 평균 49MB(바꾼 직후 90초 — 바꾼 뒤 재생이 끝날 때까지 10분 표본 319개는 최대 44 · 평균 21MB) · 쓰기 3,123회/s · 30MB/s
#  재생 속도는 WAL 내용에 따라 흔들려 우열을 가리지 않는다 — 느려지지 않았다는 것만 근거로 쓴다. 5 · 2 로 남은 재생 동안 OOM 0.
#  버린 대안 — PostgreSQL backend_flush_after=256(2MB): 쓰지 않은 페이지 2 ~ 3MB 로 막지만 재생이 0.54MB/s 로 떨어졌다(같은 날
#  기본값 1.5 · 4.3MB/s 의 3 ~ 8분의 1). 복구 프로세스가 IO:DataFileFlush 를 기다렸다 — 캐시가 모아 쓰던 같은 페이지의 반복 쓰기를
#  밀어낼 때마다 디스크로 보낸다.
#  컨테이너 상한을 올리는 것도 답이 아니다 — 캐시가 늘어난 상한까지 다시 차고 쓰지 않은 페이지의 몫도 비율로 함께 는다.
#
# 노드 전체에도 걸린다 — DB 노드의 큰 파일 쓰기(물리 · 논리 백업)도 그만큼 일찍 내보낸다.
vm.dirty_ratio = 5
vm.dirty_background_ratio = 2
