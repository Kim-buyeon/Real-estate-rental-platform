# sshd 설정 조각 — 공개키 로그인만 받고 root 직접 로그인을 막는다. 서버 운영 기반 설계서 3.4 · 6.2.
# 설치 위치: /etc/ssh/sshd_config.d/40-rental.conf (root 소유 644)
#
# 번호가 40 인 이유 — sshd 는 같은 키를 여러 번 만나면 **처음 읽은 값**을 쓴다. 조각은 이름 순으로 읽히므로
# 배포판 조각 50-redhat.conf 보다 앞 번호여야 이 값이 이긴다. 99- 같은 뒤 번호는 배포판 값에 진다.
#
# 반영 — 끊기면 되돌릴 길이 없으므로 **기존 세션을 닫지 않은 채** 확인한다(운영 절차서 9장).
#   1. sshd -t                   문법 확인. 출력이 없어야 한다
#   2. systemctl reload sshd     기존 세션은 유지된다
#   3. 새 창에서 새 세션 접속     성공한 뒤에만 기존 세션을 닫는다. 확인은 sshd -T | grep -i -E 'permitroot|password'

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
