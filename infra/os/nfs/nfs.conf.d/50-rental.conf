# NFS 서버 설정 조각 — NFSv4 만 받고 루프백에서만 듣는다. 서버 운영 기반 설계서 5.3, 운영 절차서 9.3.
# 설치 위치: /etc/nfs.conf.d/50-rental.conf (root 소유 644)
# 반영: systemctl restart nfs-server. 확인은 cat /proc/fs/nfsd/versions 에 -3 이 있어야 한다
#
# /etc/nfs.conf.d/*.conf 는 /etc/nfs.conf 뒤에 읽혀 같은 키를 덮는다(man nfs.conf) — 배포판 파일은 건드리지 않는다.
#
# vers3=n — NFSv4 전용 서버(RHEL 9 「Configuring an NFSv4-only server」). v3 는 rpcbind · mountd · statd 를 네트워크에
# 열어야 하므로 끈다. v4 부 버전(4.0 · 4.1 · 4.2)은 기본값 그대로 둔다 — 설계서 5.3 이 요구하는 것은 v3 차단뿐이다.
#
# host=127.0.0.1 — 이 노드에는 사설 서브넷도 호스트 방화벽도 없어 남는 방어가 보안 그룹 한 겹이다(설계서 3.3).
# 공인 IP 가 사설 IP 로 1:1 변환되므로 사설 IP 에 열면 보안 그룹 실수 하나로 인터넷에 NFS 가 열린다.
# Docker 포트를 루프백에 게시하는 것과 같은 원칙이다. 노드를 분리하면 이 값은 NAS 자기 사설 IP 로, exports 의 클라이언트는
# DB-01 · DB-02 · APP-01 사설 IP 로 바꾼다.

[nfsd]
vers3=n
host=127.0.0.1
