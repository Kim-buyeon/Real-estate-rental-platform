# nfs-mountd 드롭인 — mountd 가 네트워크에서 듣지 않게 한다. 서버 운영 기반 설계서 5.3, 운영 절차서 9.3.
# 설치 위치: /etc/systemd/system/nfs-mountd.service.d/v4only.conf (root 소유 644)
# 반영: systemctl daemon-reload 뒤 systemctl restart nfs-server. 확인은 ss -ltnup 에 mountd · 111 이 없어야 한다
#
# NFSv4 는 mountd 의 네트워크 프로토콜이 필요 없다 — 커널 nfsd 는 내보내기 정보를 노드 안의 업콜로만 mountd 에 묻는다
# (RHEL 9 「Configuring an NFSv4-only server」). 같은 문서대로 rpc-statd · rpcbind(서비스와 소켓)는 마스크한다(운영 절차서 9.3).
#
# 빈 ExecStart= 는 배포판 유닛의 값을 지운다 — 지우지 않으면 oneshot 이 아닌 유닛에 ExecStart 가 둘이 되어 유닛이 거부된다.

[Service]
ExecStart=
ExecStart=/usr/sbin/rpc.mountd --no-tcp --no-udp
