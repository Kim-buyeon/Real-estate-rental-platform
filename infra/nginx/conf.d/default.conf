# 서버 블록 — 운영 절차서 4.2. 공인 IP + HTTP 로 받는다(시스템 구성서 2.1절). 도메인을 붙이면 443 블록을 더한다.
server {
    listen 80 default_server;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 점검 모드 — 표시 파일이 있으면 전 경로 503(maintenance.sh). 서버 문맥이라 location 매칭보다 먼저 판정되어
    # /api/ 쓰기까지 막는다. 파일 유무는 요청마다 보므로 reload 가 필요 없다. if 안에는 return 만 둔다.
    if (-f /etc/nginx/maintenance/on) {
        return 503;
    }

    # 관리 경로는 밖으로 열지 않는다 — 인프라 API 명세 1장. readiness 는 배포 스크립트가 슬롯 포트로 직접 본다
    location /actuator {
        return 404;
    }

    # 일반 API. 한 슬롯이 죽어 502 · 연결 실패면 다른 슬롯으로 다시 보낸다 — 비멱등(POST 등)은 Nginx 기본대로 재시도하지 않는다
    location /api/ {
        proxy_pass http://app;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # 실시간 수신(SSE) — 버퍼링을 끄지 않으면 이벤트가 버퍼에 갇힌다. 연결 수명 상한은 앱이 정한다(액세스 토큰 유효 시간).
    location = /api/notifications/stream {
        proxy_pass http://app;
        proxy_connect_timeout 2s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # ?ticket= 을 남기지 않는다
        access_log /var/log/nginx/access.log no_query;
    }

    # 화면 — 정적 파일과 클라이언트 라우팅
    location / {
        proxy_pass http://web;
    }
}
