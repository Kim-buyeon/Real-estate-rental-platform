# 서버 블록 — 운영 절차서 4.2. 공인 IP + HTTP 로 받는다(시스템 구성서 2.1절). 도메인을 붙이면 443 블록을 더한다.

# 앞단 전체 요청 상한(#258) — 처리 한계를 넘는 요청을 받아 앱 · 노드가 함께 무너지는 것을 막는다.
# 2026-09-26 부하 시험 T2(#257): 100 RPS 에서 전체 p95 248ms · 5xx 0 · 앱 노드 CPU 0.55, 200 RPS 에서 앱 JVM OOM →
# APP-01 OS 정지(약 70분 중단). 넘치는 요청은 여기서 곧바로 429 로 돌려보내 노드를 살려 둔다.
# 키가 하나(앞단 전체)인 이유 — 목적이 노드 보호(총량)다. 클라이언트별 남용 방지는 다른 문제라 따로 둔다.
# 60 r/s — 같은 날 T2 재시험(상한 100 r/s 반영 뒤): 50 RPS 는 전 엔드포인트 p95 500ms 이내(지도 2단계 338ms),
# 100 RPS 는 지도 2단계 p95 642ms 로 기준 초과, 200 RPS 는 상한 100 이 받아들인 요청만으로 앱 슬롯 넷이 모두 컨테이너
# 메모리 상한에서 종료됐다(502). 받는 양을 기준을 지킨 마지막 단계(50)와 넘은 단계(100) 사이로 둔다.
# 표본 1회의 잠정값이다. 앱 노드를 늘리거나 병목(지도 마커 전량 응답)을 고치면 T2 를 다시 돌려 고친다.
limit_req_zone $server_name zone=api_all:1m rate=60r/s;

# 클라이언트(IP)별 상한(#266) — 위 전체 상한은 키가 하나라 클라이언트 하나가 초당 60건을 보내면 모두가 429 를 받는다.
# 20 r/s · burst 40 은 잠정값: 정상 사용은 사용자당 초당 1건 안팎(트래픽 정의서 think time 3 ~ 10초)이나 통신사 공유 IP
# (CGNAT) 뒤의 여러 사용자를 한 클라이언트로 보게 되므로 넉넉히 둔다. 부하 생성기(LOAD-01, 시스템 구성서)는 한 주소에서
# 수백 건/초를 내야 하므로 키를 비워 이 상한에서 뺀다 — 빈 키는 limit_req 가 세지 않는다. 전체 상한은 그대로 받는다.
# 10.20.10.50 은 LOAD-01 의 사설 주소다(시험하는 동안에만 두는 노드 — 2026-09-26 #257). 10.20.10.0/24 는 DB-01 과 같은 사설 서브넷이라,
# LOAD-01 을 지운 뒤 다른 인스턴스가 이 주소를 받으면 조용히 예외가 된다 — 부하 생성기를 다시 만들 때 주소를 확인하고, 두지 않기로 하면 이 줄을 지운다.
# geo 의 값에는 변수를 쓸 수 없어 예외 여부만 가리고, 키는 map 이 만든다
geo $api_rate_exempt {
    default         0;
    10.20.10.50/32  1;
}
map $api_rate_exempt $api_client_key {
    0  $binary_remote_addr;
    1  "";
}
limit_req_zone $api_client_key zone=api_ip:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 요청 추적 ID — 인프라 기술 스택 4장이 분산 추적 도구를 도입하지 않기로 정했고, 대신 진입에서 넣은 값을
    # 전파해 같은 조사를 한다. 슬롯이 넷(두 노드 × 둘)이라 이 키가 없으면 Nginx 접근 로그(rid=)와 앱 로그를 이을 수 없다.
    # 서버 문맥에 한 번만 두어 아래 세 location 이 모두 물려받는다. 백엔드가 MDC 에 넣는 일은 이슈 167.
    proxy_set_header X-Request-Id $request_id;

    # 요청 본문 상한 — 이 서비스의 요청 본문은 전부 JSON 폼이라 2MB 면 충분하다.
    # 공인 IP 로 열려 있어 상시 스캐너 트래픽을 받으므로(시스템 구성서 4장 「공개된 포트는 자동 스캔의 대상이 된다」)
    # 본문 · 헤더를 느리게 흘리는 연결이 워커를 붙들지 않게 수신 대기에도 상한을 둔다.
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 점검 모드 — 표시 파일이 있으면 전 경로 503(maintenance.sh). 서버 문맥이라 location 매칭보다 먼저 판정되어
    # /api/ 쓰기까지 막는다(/ 만 막으면 더 긴 접두사인 /api/ 가 우선해 쓰기가 계속 들어온다 — 운영 절차서 4.2).
    # 파일 유무는 요청마다 보므로 reload 가 필요 없다. if 안에는 return 만 둔다.
    if (-f /etc/nginx/maintenance/on) {
        return 503;
    }

    # 점검 안내 화면 — 위 503 을 받아 본문을 준다. 업스트림이 낸 503 은 여기로 오지 않는다
    # (proxy_intercept_errors 는 기본 off 라 뒤에서 온 응답은 그대로 내보낸다) — 점검과 장애가 섞이지 않는다.
    error_page 503 @maintenance;

    # 명명 location 이라 서버 문맥의 if 를 다시 타지 않는다(내부 이동이 location 재탐색을 건너뛴다) — 되돌이가 생기지 않는다
    location @maintenance {
        # 정적 파일 핸들러는 GET · HEAD 만 받고 그 밖의 메서드에는 405 를 낸다. 점검 중 쓰기 요청까지
        # 405 가 되면 안 되므로(상태는 전 경로 503 이어야 한다) 본문 없이 여기서 끊는다 — 화면을 보는 쪽은 GET 이다
        if ($request_method !~ ^(GET|HEAD)$) {
            return 503;
        }
        root /etc/nginx/maintenance;
        rewrite ^ /maintenance.html break;
        # 점검 예정 시간이 아니라 재시도 간격이다. 클라이언트 · 스캐너가 즉시 다시 오지 않게 한다
        add_header Retry-After 600 always;
        # 점검이 끝난 뒤에도 이 화면이 캐시에 남으면 안 된다
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }

    # 요청 상한 초과 — 앱의 공통 봉투와 같은 모양으로 돌려준다(API 공통 명세 2장 TOO_MANY_REQUESTS).
    # 화면이 오류 코드로 분기하므로 Nginx 기본 HTML 을 내보내지 않는다
    location @too_many {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"요청이 많아 잠시 처리할 수 없습니다. 잠시 뒤 다시 시도해 주세요."}}';
    }

    # 관리 경로는 밖으로 열지 않는다 — 인프라 API 명세 1장. readiness 는 배포 스크립트가 슬롯 포트로 직접 본다
    location /actuator {
        return 404;
    }

    # 일반 API. 한 슬롯이 죽어 502 · 연결 실패면 다른 슬롯으로 다시 보낸다 — 비멱등(POST 등)은 Nginx 기본대로 재시도하지 않는다
    location /api/ {
        # 앞단 전체 상한(파일 머리). burst 30 · nodelay — 순간 몰림 30건(상한의 0.5초 몫)까지는 기다리게 하지 않고 통과시키고,
        # 그 너머는 곧바로 거절한다. 줄 세워 늦추면(nodelay 없음) 넘치는 부하가 대기열로 쌓여 응답 시간만 늘어난다
        limit_req zone=api_all burst=30 nodelay;
        # 클라이언트별(파일 머리). 두 상한 중 먼저 닿는 쪽이 429 를 낸다
        limit_req zone=api_ip burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many;
        proxy_pass http://app;
        proxy_connect_timeout 2s;
        # 대표 조회 판정 기준(운영 절차서 3.3 의 p95 1초 미만)보다 넉넉히 위에 두되 기본 60초보다는 낮춘다 —
        # 느린 슬롯 하나가 앞단 워커까지 물고 늘어지지 않게 한다
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        # 슬롯이 넷(APP-01 둘 · APP-02 둘, #255)이라 처음 시도 포함 3회 — APP-02 가 통째로 멈춘 첫 순간에 원격 두 슬롯을
        # 연달아 골라도 세 번째는 APP-01 슬롯이다. 연결 시간 초과 2초 × 2 = 4초가 그 요청의 최악 추가 지연이고,
        # 이후에는 max_fails 가 원격 슬롯을 fail_timeout 동안 빼서 재시도 자체가 줄어든다.
        # 횟수 · 시간 상한이 없으면 재시도가 요청 시간을 곱한다
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # 실시간 수신(SSE) — 버퍼링을 끄지 않으면 이벤트가 버퍼에 갇힌다. 연결 수명 상한은 앱이 정한다(액세스 토큰 유효 시간).
    location = /api/notifications/stream {
        proxy_pass http://app;
        proxy_connect_timeout 2s;
        proxy_buffering off;
        proxy_cache off;
        # 읽기만 길다 — 이벤트 사이 무응답 구간이 정상인 연결이라 짧으면 앞단이 먼저 끊는다.
        # 보내기는 요청 한 번뿐이라 다른 경로와 같은 상한을 둔다
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        # ?ticket= 을 남기지 않는다
        access_log /var/log/nginx/access.log no_query;
    }

    # 화면 — 정적 파일과 클라이언트 라우팅
    location / {
        proxy_pass http://web;
        # 같은 노드의 정적 파일 전달이라 API 보다 짧게 둔다 — 여기서 30초를 기다릴 상황은 슬롯이 이미 멈춘 상황이다
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
