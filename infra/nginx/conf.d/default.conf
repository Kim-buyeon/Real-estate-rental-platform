# 서버 블록 — 운영 절차서 4.2. 공인 IP + HTTPS(443)로 받는다 — 보안 · 암호화 설계서 4.1(INF-07, 이슈 #288).
# 80 은 ACME 확인(인증서 발급)과 HTTPS 넘기기(301)만 한다. 요청 상한 · 점검 모드 · 전 location 은 443 서버에 있다.
# 인증서는 정기 작업(infra/tls/issue-cert.sh — rental-tls.timer)이 /etc/rental/tls 에 두고 reload 한다. 두 앱 노드가 이 파일을 같이 쓴다(#404) —
# 입구 고정 IP(Elastic IP)를 가진 노드가 그 IP 로 발급하고 다른 노드에 사본을 넘긴다(그 스크립트 머리 주석).
# 로컬 구성(nginx/local/default.conf)은 HTTP 그대로다 — 인증서 발급 대상(공인 IP)이 없다.

# 앞단 전체 요청 상한(#258) — 처리 한계를 넘는 요청을 받아 앱 · 노드가 함께 무너지는 것을 막는다.
# 2026-09-26 부하 시험 T2(#257): 100 RPS 에서 전체 p95 248ms · 5xx 0 · 앱 노드 CPU 0.55, 200 RPS 에서 앱 JVM OOM →
# APP-01 OS 정지(약 70분 중단). 넘치는 요청은 여기서 곧바로 429 로 돌려보내 노드를 살려 둔다.
# 키가 하나(앞단 전체)인 이유 — 목적이 노드 보호(총량)다. 클라이언트별 남용 방지는 다른 문제라 따로 둔다.
# 60 r/s — 같은 날 T2 재시험(상한 100 r/s 반영 뒤): 50 RPS 는 전 엔드포인트 p95 500ms 이내(지도 2단계 338ms),
# 100 RPS 는 지도 2단계 p95 642ms 로 기준 초과, 200 RPS 는 상한 100 이 받아들인 요청만으로 앱 슬롯 넷이 모두 컨테이너
# 메모리 상한에서 종료됐다(502). 받는 양을 기준을 지킨 마지막 단계(50)와 넘은 단계(100) 사이로 둔다.
# 표본 1회의 잠정값이다. 앱 노드를 늘리거나 병목(지도 마커 전량 응답)을 고치면 T2 를 다시 돌려 고친다.
# 키 $server_name 은 이 상한을 거는 443 서버의 이름(_) 하나다 — HTTPS 로 옮긴 뒤에도 키가 하나라는 뜻은 같다. 80 서버는 limit_req 를 걸지 않는다.
limit_req_zone $server_name zone=api_all:1m rate=60r/s;

# 클라이언트(IP)별 상한(#266) — 위 전체 상한은 키가 하나라 클라이언트 하나가 초당 60건을 보내면 모두가 429 를 받는다.
# 20 r/s · burst 40 은 잠정값: 정상 사용은 사용자당 초당 1건 안팎(트래픽 정의서 think time 3 ~ 10초)이나 통신사 공유 IP
# (CGNAT) 뒤의 여러 사용자를 한 클라이언트로 보게 되므로 넉넉히 둔다. 부하 생성기(LOAD-01, 시스템 구성서)는 한 주소에서
# 수백 건/초를 내야 하므로 키를 비워 이 상한에서 뺀다 — 빈 키는 limit_req 가 세지 않는다. 전체 상한은 그대로 받는다.
# 10.20.10.50 은 LOAD-01 의 사설 주소다(시험하는 동안에만 두는 노드 — 2026-09-26 #257). 10.20.10.0/24 는 DB-01 과 같은 사설 서브넷이라,
# LOAD-01 을 지운 뒤 다른 인스턴스가 이 주소를 받으면 조용히 예외가 된다 — 부하 생성기를 다시 만들 때 주소를 확인하고, 두지 않기로 하면 이 줄을 지운다.
# geo 의 값에는 변수를 쓸 수 없어 예외 여부만 가리고, 키는 map 이 만든다
geo $api_rate_exempt {
    default         0;
    10.20.10.50/32  1;
}
map $api_rate_exempt $api_client_key {
    0  $binary_remote_addr;
    1  "";
}
limit_req_zone $api_client_key zone=api_ip:10m rate=20r/s;

# 로그인 전용 클라이언트(IP)별 상한(#408) — 무차별 대입(비밀번호 맞히기)을 늦추고, 로그인 하나가 BCrypt 로 앱 CPU 를 오래 쓰는 것을
# 한 주소가 몰아 쓰지 못하게 한다. 위 IP별 20 r/s 는 일반 조회 기준이라 로그인에는 너무 넉넉하다 — 로그인 단독 한계가 슬롯 넷 합해
# 약 30 TPS(#390)이므로 한 주소가 20 r/s 를 보내면 그것만으로 전체 몫의 2/3 를 쓴다.
# 10 r/m(6초에 1건) · burst 10(location 의 limit_req) — 정상 사용자는 로그인이 드물다(액세스 토큰 30분 · 리프레시 14일, 재발급은
# /api/auth/reissue 라 여기 걸리지 않는다). 몇 번 잘못 쳐도 burst 안에 들고, 통신사 공유 IP(CGNAT) 뒤의 여러 사용자가 한꺼번에
# 로그인해도 10건까지는 곧바로 받는다. 한 주소의 지속 몫은 0.17 건/초 — 단독 한계 30 TPS 의 0.6 % 다. 무차별 대입은 주소당 시간당
# 600회 안팎으로 묶인다. 잠정값이다 — 운영 429 비율(운영 절차서 4.2 「429 비율 보기」)로 다시 본다.
# 키는 위 $api_client_key 를 그대로 쓴다 — 부하 생성기 주소(api_rate_exempt)는 빈 키라 이 상한에서도 빠진다(다음 부하 시험이 로그인을 친다).
# 앞단 전체 상한(api_all) · IP별 상한(api_ip)은 로그인에도 그대로 걸린다(location 에 셋을 함께 적는다).
limit_req_zone $api_client_key zone=api_login:10m rate=10r/m;

# ── HTTP(80) — ACME 확인 · HTTPS 넘기기만 ──
server {
    listen 80 default_server;
    server_name _;

    # 80 도 공인으로 열려 있어 스캐너가 온다 — 헤더 · 본문을 느리게 흘리는 연결이 워커를 붙들지 않게 443 서버와 같은 상한(아래 443 서버 주석)
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Let's Encrypt http-01 확인 — certbot(issue-cert.sh)이 웹루트 /var/lib/rental-acme 에 쓴 토큰을 내보낸다(운영 Compose 가 읽기 전용 마운트).
    # IP 주소 인증서는 http-01 · tls-alpn-01 로만 확인한다(DNS 확인 불가) — 그래서 80 은 닫지 않는다.
    # ^~ — 나중에 정규식 location 이 더해져도 이 접두사가 이긴다. 없는 토큰은 404(issue-cert.sh 가 80 이 떴는지 이 404 로 본다)
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/rental-acme;
        default_type text/plain;
    }

    # 관리 경로는 80 에서도 넘기지 않고 404 — 301 을 주면 경로가 있다는 것을 알리고 443 으로 한 번 더 오게 한다(인프라 API 명세 1장)
    location /actuator {
        return 404;
    }

    # 나머지는 전부 HTTPS 로. 점검 모드 if 는 여기 두지 않는다 — 넘겨받은 443 서버가 503 을 준다(한 곳에서만 판정한다).
    # 80 에 두면 점검 중에도 ACME 확인 경로를 가려야 하고, 두 서버가 같은 판정을 따로 갖게 된다.
    # 308 이 아니라 301 — 이 서비스의 쓰기(API)는 화면이 처음부터 https 로 부른다. 평문 80 으로 들어온 쓰기를 본문째 옮기지 않는다.
    # $host — 요청의 Host(IP)를 그대로 쓴다. 인증서 SAN 이 그 IP 다
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS(443) — 서비스 전부 ──
server {
    listen 443 ssl default_server;
    # nginx 1.25.1 부터 listen 의 http2 매개변수 대신 이 지시어를 쓴다(nginx 문서 ngx_http_v2_module). 이미지는 1.30 계열(운영 Compose)
    http2 on;
    server_name _;

    # 인증서 — issue-cert.sh 가 둔다. 발급 전(첫 기동)에는 그 스크립트가 만든 임시 자체 서명이 여기 있다.
    # 파일이 없으면 이 서버뿐 아니라 설정 전체가 실리지 않는다(80 도 뜨지 않는다) — 운영 Compose 의 nginx 마운트 주석
    ssl_certificate     /etc/rental/tls/fullchain.pem;
    ssl_certificate_key /etc/rental/tls/privkey.pem;

    # Mozilla 권장 intermediate — https://ssl-config.mozilla.org/guidelines/latest.json v6.0(2026-09-28 받아 확인)의
    # configurations.intermediate 값 그대로다(보안 · 암호화 설계서 4.1 「보안 하한」).
    #   tls_versions TLSv1.2 · TLSv1.3 / ciphers(openssl) 여섯 개 — 전부 ECDHE + AEAD(GCM · ChaCha20-Poly1305) /
    #   server_preferred_order false → ssl_prefer_server_ciphers off / tls_curves 넷 → ssl_ecdh_curve.
    # v6.0 intermediate 에는 DHE 암호군이 없다 — dhparam 파일을 두지 않는다. TLS 1.3 암호군(ciphersuites)은 OpenSSL 기본이 v6.0 의 셋과 같아 따로 적지 않는다.
    # ECDSA · RSA 인증서 어느 쪽이어도 이 목록이 맞는다(ECDHE-ECDSA-* · ECDHE-RSA-* 를 함께 둔다). 키 종류는 C-2 로 ECDSA 확정(설계서 4.1, #288)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # X25519MLKEM768 은 OpenSSL 3.5 이상이 필요하다. 공식 이미지 nginx:1.30-alpine 의 저장소 판은 alpine 3.24(OpenSSL 3.5.8, 2026-09-28 확인)지만
    # 노드 이미지에서 nginx -t 통과 확인(2026-09-28 APP-01, #288). 이미지를 바꿀 때 실리지 않으면 nginx -t 가 알려 준다(reload 전에 본다 — 운영 절차서 3.1)
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;

    # 세션 재사용 — C-2 로 확정(설계서 4.1, #288). 재사용하면 새 연결의 서명(핸드셰이크 CPU)을 건너뛴다 — TLS 1.2 캐시 재사용이 새 연결 대비 약 18배(s_time).
    # 캐시 10m 은 약 4만 세션(nginx 문서 ssl_session_cache — 1MB 에 약 4000). 티켓은 끈다 — 티켓 키 교체 주기가 설계서 4.1 에서
    # 미확정이라, 교체를 정하지 않은 키로 세션을 암호화해 전방 비밀성을 약하게 두지 않는다. 재사용은 서버 쪽 캐시가 맡는다.
    # 연결 재사용(keep-alive · HTTP/2)이면 HTTPS 입구 CPU 가 HTTP 와 같다(400 RPS 25.9 % 대 25.5 %) — 비용은 새 연결에만 든다
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS(Strict-Transport-Security)는 두지 않는다 — IP 주소 호스트에는 브라우저가 HSTS 를 적용하지 않는다(RFC 6797 8.1.1 —
    # 호스트가 IP 주소면 HSTS 호스트로 기록하지 않아야 한다). 도메인을 붙일 때 둔다.
    # OCSP 스테이플링도 두지 않는다 — Let's Encrypt 가 2025-05 부터 인증서에 OCSP 주소를 넣지 않고 2025-08-06 에 응답기를 껐다
    # (https://letsencrypt.org/2025/08/06/ocsp-service-has-reached-end-of-life). 스테이플할 응답이 없다.
    # Mozilla v6.0 의 ocsp_staple true 는 OCSP 를 주는 CA 를 전제한 값이다.

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 이 서버에서는 https 다 — 앱이 원래 요청의 스킴을 이 값으로 안다
    proxy_set_header X-Forwarded-Proto $scheme;
    # 요청 추적 ID — 인프라 기술 스택 4장이 분산 추적 도구를 도입하지 않기로 정했고, 대신 진입에서 넣은 값을
    # 전파해 같은 조사를 한다. 슬롯이 넷(두 노드 × 둘)이라 이 키가 없으면 Nginx 접근 로그(rid=)와 앱 로그를 이을 수 없다.
    # 서버 문맥에 한 번만 두어 아래 세 location 이 모두 물려받는다. 백엔드가 MDC 에 넣는 일은 이슈 167.
    proxy_set_header X-Request-Id $request_id;

    # 요청 본문 상한 — 이 서비스의 요청 본문은 전부 JSON 폼이라 2MB 면 충분하다.
    # 공인 IP 로 열려 있어 상시 스캐너 트래픽을 받으므로(시스템 구성서 4장 「공개된 포트는 자동 스캔의 대상이 된다」)
    # 본문 · 헤더를 느리게 흘리는 연결이 워커를 붙들지 않게 수신 대기에도 상한을 둔다.
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 점검 모드 — 표시 파일이 있으면 전 경로 503(maintenance.sh). 서버 문맥이라 location 매칭보다 먼저 판정되어
    # /api/ 쓰기까지 막는다(/ 만 막으면 더 긴 접두사인 /api/ 가 우선해 쓰기가 계속 들어온다 — 운영 절차서 4.2).
    # 파일 유무는 요청마다 보므로 reload 가 필요 없다. if 안에는 return 만 둔다.
    if (-f /etc/nginx/maintenance/on) {
        return 503;
    }

    # 점검 안내 화면 — 위 503 을 받아 본문을 준다. 업스트림이 낸 503 은 여기로 오지 않는다
    # (proxy_intercept_errors 는 기본 off 라 뒤에서 온 응답은 그대로 내보낸다) — 점검과 장애가 섞이지 않는다.
    error_page 503 @maintenance;

    # 명명 location 이라 서버 문맥의 if 를 다시 타지 않는다(내부 이동이 location 재탐색을 건너뛴다) — 되돌이가 생기지 않는다
    location @maintenance {
        # 정적 파일 핸들러는 GET · HEAD 만 받고 그 밖의 메서드에는 405 를 낸다. 점검 중 쓰기 요청까지
        # 405 가 되면 안 되므로(상태는 전 경로 503 이어야 한다) 본문 없이 여기서 끊는다 — 화면을 보는 쪽은 GET 이다
        if ($request_method !~ ^(GET|HEAD)$) {
            return 503;
        }
        root /etc/nginx/maintenance;
        rewrite ^ /maintenance.html break;
        # 점검 예정 시간이 아니라 재시도 간격이다. 클라이언트 · 스캐너가 즉시 다시 오지 않게 한다
        add_header Retry-After 600 always;
        # 점검이 끝난 뒤에도 이 화면이 캐시에 남으면 안 된다
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }

    # 요청 상한 초과 — 앱의 공통 봉투와 같은 모양으로 돌려준다(API 공통 명세 2장 TOO_MANY_REQUESTS).
    # 화면이 오류 코드로 분기하므로 Nginx 기본 HTML 을 내보내지 않는다
    location @too_many {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"요청이 많아 잠시 처리할 수 없습니다. 잠시 뒤 다시 시도해 주세요."}}';
    }

    # 관리 경로는 밖으로 열지 않는다 — 인프라 API 명세 1장. readiness 는 배포 스크립트가 슬롯 포트로 직접 본다
    location /actuator {
        return 404;
    }

    # 일반 API. 한 슬롯이 죽어 502 · 연결 실패면 다른 슬롯으로 다시 보낸다 — 비멱등(POST 등)은 Nginx 기본대로 재시도하지 않는다
    location /api/ {
        # 앞단 전체 상한(파일 머리). burst 30 · nodelay — 순간 몰림 30건(상한의 0.5초 몫)까지는 기다리게 하지 않고 통과시키고,
        # 그 너머는 곧바로 거절한다. 줄 세워 늦추면(nodelay 없음) 넘치는 부하가 대기열로 쌓여 응답 시간만 늘어난다
        limit_req zone=api_all burst=30 nodelay;
        # 클라이언트별(파일 머리). 두 상한 중 먼저 닿는 쪽이 429 를 낸다
        limit_req zone=api_ip burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many;
        proxy_pass http://app;
        # 연결 상한 500ms(#421, 2s 에서 줄였다) — 정지한 노드의 슬롯은 연결 시간 초과로 실패하므로 이 값이 그 요청의 추가 지연이다.
        # 슬롯 연결 시간(Nginx uct)은 부하 시험 R04 4,741건 p99 0.001 · 최대 0.007초였고, 1초 넘는 uct 는 2026-10-04 APP-01 메모리
        # 과약정(#394) 동안뿐이었다(그 요청은 이미 rt 14 ~ 25초). 과부하로 연결이 느린 슬롯을 너무 빨리 실패로 세지 않도록 여유를 둔 값
        proxy_connect_timeout 500ms;
        # 대표 조회 판정 기준(운영 절차서 3.3 의 p95 1초 미만)보다 넉넉히 위에 두되 기본 60초보다는 낮춘다 —
        # 느린 슬롯 하나가 앞단 워커까지 물고 늘어지지 않게 한다
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # http_503 은 넣지 않는다(#402) — 넣으면 Nginx 가 앱이 낸 503 을 그 슬롯의 실패로 세어(max_fails — nginx 공식 문서
        # ngx_http_upstream_module 「what is considered an unsuccessful attempt is defined by proxy_next_upstream」), DB 가 바빠
        # 슬롯 넷이 함께 503 SERVICE_BUSY 를 내면 넷이 동시에 fail_timeout 동안 빠져 성공했을 요청까지 502 가 된다. 외부 연동
        # 장애 503(EXTERNAL_API_UNAVAILABLE)도 같은 위험이다. 503 은 슬롯이 죽은 것이 아니라 공용 자원이 바쁜 것이라 다른 슬롯에
        # 보내도 같은 DB · 같은 외부 API 를 기다린다. 죽은 슬롯은 error · timeout · 502 가 잡는다
        proxy_next_upstream error timeout http_502;
        # 슬롯이 넷(APP-01 둘 · APP-02 둘, #255)이라 처음 시도 포함 3회 — 한 노드가 통째로 멈춘 첫 순간에 그 노드의 두 슬롯을
        # 연달아 골라도 세 번째는 남은 노드의 슬롯이다. 연결 시간 초과 0.5초 × 2 = 1초가 그 요청의 최악 추가 지연이고,
        # 이후에는 max_fails 가 원격 슬롯을 fail_timeout 동안 빼서 재시도 자체가 줄어든다.
        # 횟수 · 시간 상한이 없으면 재시도가 요청 시간을 곱한다
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # 로그인 — /api/ 와 같되 로그인 전용 IP별 상한(파일 머리 api_login)을 더한다. 정확 일치라 /api/ 접두사보다 먼저 고른다.
    # limit_req · error_page · proxy_* 는 형제 location 에서 물려받지 않으므로 /api/ 의 값을 여기 그대로 다시 적는다 —
    # /api/ 블록을 고치면 여기도 함께 고친다. 근거 주석은 /api/ 블록이 갖는다.
    location = /api/auth/login {
        limit_req zone=api_all burst=30 nodelay;
        limit_req zone=api_ip burst=40 nodelay;
        # nodelay — 줄 세워 늦추지 않고 burst 너머는 곧바로 429. 늦추면 대기 연결이 앞단 워커를 붙든다
        limit_req zone=api_login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many;
        proxy_pass http://app;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # http_503 을 넣지 않는다 — 앱이 BCrypt 동시 상한에 걸려 낸 503 SERVICE_BUSY(#408)도 슬롯 실패가 아니다(/api/ 블록 주석)
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # 실시간 수신(SSE) — 버퍼링을 끄지 않으면 이벤트가 버퍼에 갇힌다. 연결 수명 상한은 앱이 정한다(액세스 토큰 유효 시간).
    location = /api/notifications/stream {
        proxy_pass http://app;
        proxy_connect_timeout 500ms;
        proxy_buffering off;
        proxy_cache off;
        # 읽기만 길다 — 이벤트 사이 무응답 구간이 정상인 연결이라 짧으면 앞단이 먼저 끊는다.
        # 보내기는 요청 한 번뿐이라 다른 경로와 같은 상한을 둔다
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        # ?ticket= 을 남기지 않는다
        access_log /var/log/nginx/access.log no_query;
    }

    # 화면 — 정적 파일과 클라이언트 라우팅
    location / {
        proxy_pass http://web;
        # 같은 노드의 정적 파일 전달이라 API 보다 짧게 둔다 — 여기서 30초를 기다릴 상황은 슬롯이 이미 멈춘 상황이다
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
