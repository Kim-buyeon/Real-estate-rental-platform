# 슬롯 목록 — 운영 절차서 4.1. 배포 스크립트가 이 파일의 down 플래그만 토글한다. 서버 항목은 항상 넷이다.
# 주소는 컨테이너 이름이 아니라 IP 다 — Nginx 는 호스트명을 설정 로드 때 한 번만 해석한다.
#   127.0.0.1:8081 · 8082   이 노드(APP-01)의 슬롯 — 루프백 게시
#   10.20.20.30:8081 · 8082 앱 노드 APP-02 의 슬롯 — 그 노드의 사설 IP 게시(INF-01). 보안 그룹 rental-app-node 가 rental-app 에서만 받는다
# 배포 스크립트(deploy.sh 의 SLOTS)가 이 네 줄을 「주소:포트」로 찾는다. 주소를 바꾸면 SLOTS 도 함께 고친다.
#
# APP-02 가 없거나 꺼진 구성(단일 노드 · 3노드 · 작업하지 않는 동안 APP-02 를 정지해 둔 때)에서도 이 파일은 그대로 쓴다.
# 그때 두 줄은 연결이 되지 않는 서버다 —
#   - 요청은 죽지 않는다. /api/ 는 연결 시간 초과 · 오류면 다음 서버로 다시 보낸다 — 시간 상한과 재시도 횟수는 conf.d/default.conf 의
#     /api/ 블록(proxy_connect_timeout · proxy_next_upstream · proxy_next_upstream_tries)이 정한다. 실패가 fail_timeout 10s 안에
#     max_fails 3 번 쌓이면 그 서버를 10초 빼 둔다.
#   - 대가는 지연이다. 인스턴스가 정지돼 있으면 보안 그룹 · 경로가 패킷을 버려 거절(RST)이 아니라 연결 시간 초과가 된다 —
#     10초마다 그 서버를 다시 시도하는 요청이 연결 시간 초과만큼 늦는다.
#   - SSE(/api/notifications/stream)도 같은 upstream 이다 — 연결 시간 초과 뒤 다음 서버로 간다(proxy_next_upstream 기본값 error timeout).
# 운영 — 노드는 함께 켜고 끈다(2026-09-26 결정). APP-02 만 멈춘 동안에도 이 네 줄은 그대로 둔다 — max_fails 가 원격 두 줄을 빼고
# 재시도(default.conf 의 tries)가 로컬 슬롯으로 넘긴다. 그 동안의 추가 지연(연결 시간 초과 2초)은 받아들인다.
# 그 동안의 배포는 APP_NODE_SSH= (빈 값)로 한다 — deploy.sh 머리 주석.
upstream app {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    server 10.20.20.30:8081 max_fails=3 fail_timeout=10s;
    server 10.20.20.30:8082 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 정적 화면 — 프론트 이미지. 배포 교체 대상이 아니라 슬롯이 하나다.
upstream web {
    server 127.0.0.1:8090;
    keepalive 8;
}
