# 슬롯 목록 — 운영 절차서 4.1. 배포 스크립트가 이 파일의 down 플래그만 토글한다. 서버 항목은 항상 둘이다.
# 주소는 컨테이너 이름이 아니라 루프백이다 — Nginx 는 호스트명을 설정 로드 때 한 번만 해석한다.
upstream app {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 정적 화면 — 프론트 이미지. 배포 교체 대상이 아니라 슬롯이 하나다.
upstream web {
    server 127.0.0.1:8090;
    keepalive 8;
}
