# 연결 · 요청 수 지표 — nginx exporter(운영 Compose 의 nginx-exporter)가 긁는 자리다(INF-05).
# 공개 80 서버 블록에 location 을 두지 않고 서버 블록을 따로 둔다 — 공개 서버에 내부 경로가 생기면
# allow/deny 규칙 하나를 실수해도 밖에 드러난다. 여기는 루프백에만 바인딩하므로 규칙 없이 밖에서 닿지 않는다
# (nginx 가 호스트 네트워크라 바인딩 주소가 곧 노출 범위다 — 시스템 구성서 4장).
# 반영은 nginx -t → nginx -s reload 다(운영 절차서 3.1). restart 하지 않는다.
server {
    listen 127.0.0.1:8088;
    # 15초마다 긁히는 요청이라 접근 로그에 남기지 않는다
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
