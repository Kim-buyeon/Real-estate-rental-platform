# 로컬 앞단 — 루트 docker-compose.yml 의 nginx 서비스가 conf.d 로 마운트한다. 개발 환경 설계서 1.1.
# 운영 infra/docker-compose.yml 은 ./nginx/conf.d 만 마운트하므로 이 폴더(local/)는 서버에 영향이 없다.
# 경로 처리는 운영 서버 블록(../conf.d/default.conf, 운영 절차서 4.2)과 같게 둔다. 운영 쪽을 바꾸면 여기도 본다.
#
# 운영과 다른 점 — 로컬에 없는 것은 넣지 않는다
#   - 점검 모드(maintenance/on 검사): 표시 파일을 마운트하지 않는다. 로컬은 전환할 DB 가 없다
#   - 두 슬롯 · proxy_next_upstream: 앱이 하나라 다시 보낼 곳이 없다
#   - 주소: 루프백이 아니라 Compose 서비스 이름. 브리지 네트워크라 컨테이너 안의 127.0.0.1 은 nginx 자신이다

# Compose 내장 DNS. 앱 · 화면 컨테이너가 다시 만들어져 IP 가 바뀌어도 따라가게 이름을 주기적으로 다시 해석한다
resolver 127.0.0.11 valid=10s;

# server ... resolve 는 1.27.3 부터 오픈소스. 실행 중 해석에는 공유 메모리(zone)가 필요하다
# — 없으면 "resolving names at run time requires upstream ... to be in shared memory" 로 설정 검사에서 멈춘다(1.30 바이너리에서 확인)
upstream app {
    zone app 64k;
    server app:8080 resolve;
    keepalive 32;
}

upstream web {
    zone web 64k;
    server web:80 resolve;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 관리 경로는 밖으로 열지 않는다 — 운영과 같다
    location /actuator {
        return 404;
    }

    # 일반 API
    location /api/ {
        proxy_pass http://app;
        proxy_connect_timeout 2s;
    }

    # 실시간 수신(SSE) — 버퍼링을 끄지 않으면 이벤트가 버퍼에 갇힌다
    location = /api/notifications/stream {
        proxy_pass http://app;
        proxy_connect_timeout 2s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # ?ticket= 을 남기지 않는다
        access_log /var/log/nginx/access.log no_query;
    }

    # 화면 — 정적 파일과 클라이언트 라우팅(fallback 은 프론트 이미지가 한다)
    location / {
        proxy_pass http://web;
    }
}
