# 앞단 Nginx 진입 파일 — 컨테이너의 /etc/nginx/nginx.conf 자리에 파일 단위로 마운트한다.
# 설정 본문은 main/nginx.conf 다. main/ 은 폴더째 마운트하므로 git checkout 뒤에도 nginx -t → reload 로 반영된다.
# 이 파일은 바꾸지 않는다 — 파일 단위 마운트라 바꾸면 컨테이너 재생성이 필요하다(이슈 164).
# 자리가 그대로라 nginx -t · nginx -s reload 가 옵션 없이 이 파일을 읽는다(deploy.sh · maintenance.sh 불변).

include /etc/nginx/main/nginx.conf;
