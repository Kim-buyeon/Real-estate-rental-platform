# 앞단 Nginx 기본 설정 — 운영 절차서 4장. conf.d/ 는 http 블록 안에서 읽힌다.
# 이 파일은 main 문맥 지시어(worker_shutdown_timeout)를 두려고 이미지 기본값 대신 쓴다.
# 진입 파일(../entry.conf — 컨테이너의 /etc/nginx/nginx.conf)이 이 파일을 include 한다.
# main/ 을 폴더째 마운트하므로 git checkout 으로 파일이 새로 만들어져도 nginx -t → reload 로 반영된다(이슈 164).
# 운영 Compose(infra/)와 로컬 Compose(저장소 루트)가 함께 마운트한다 — 서버 블록만 각자(conf.d/ · local/)다.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

# reload 뒤 옛 worker 가 SSE 연결을 붙든 채 남지 않게 상한을 둔다 — 운영 절차서 4.2
worker_shutdown_timeout 30s;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 쿼리 문자열을 남기지 않는 형식. 실시간 수신 경로의 일회용 티켓(?ticket=)이 접근 로그에 남지 않게 한다
    # — 티켓 수명 30초(application.yml notification.sse.ticket-ttl)라도 로그에 남기지 않는다. 다른 경로는 기본 형식(main)을 쓴다.
    # rid 는 앱 로그의 traceId 와 대조하는 키다 — 앞단이 X-Request-Id 로 같은 값을 뒤로 넘긴다(서버 블록).
    log_format  main     '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr rt=$request_time rid=$request_id';
    log_format  no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr rt=$request_time rid=$request_id';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # 응답 압축 — 운영 절차서 4.2. 서버 블록이 아니라 여기 두어 운영 · 로컬 둘 다 적용된다
    gzip            on;
    # text/html 은 기본으로 항상 압축된다(nginx 문서) — 따로 적지 않는다.
    # text/event-stream 은 넣지 않는다 — SSE 이벤트가 압축 버퍼에 갇혀 제때 나가지 않는다.
    gzip_types      application/json application/javascript text/css image/svg+xml;
    # 1KB 미만은 압축 머리 부담이 이득보다 크다. 기본값은 20
    gzip_min_length 1024;
    # 로컬 실측(2026-09-22, 강동구 마커 응답 691,285B): 1 → 56,958B · 5 → 43,226B · 6 → 40,648B.
    # 계획 기준(크기 차 10% 안이면 낮은 쪽)으로 5 — 6 과는 6% 차이. 기본값은 1
    gzip_comp_level 5;
    # 중간 캐시가 압축본과 원본을 가르게 Vary: Accept-Encoding 을 붙인다
    gzip_vary       on;
    # gzip_proxied 는 기본(off) 유지 — 사용자가 직접 닿는 앞단이라 요청에 Via 가 없다

    include /etc/nginx/conf.d/*.conf;
}
