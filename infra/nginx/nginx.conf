# 앞단 Nginx 기본 설정 — 운영 절차서 4장. conf.d/ 는 http 블록 안에서 읽힌다.
# 이 파일은 main 문맥 지시어(worker_shutdown_timeout)를 두려고 이미지 기본값 대신 마운트한다.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

# reload 뒤 옛 worker 가 SSE 연결을 붙든 채 남지 않게 상한을 둔다 — 운영 절차서 4.2
worker_shutdown_timeout 30s;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 쿼리 문자열을 남기지 않는 형식. 실시간 수신 경로의 일회용 티켓(?ticket=)이 접근 로그에 남지 않게 한다
    # — 티켓 수명 30초(application.yml notification.sse.ticket-ttl)라도 로그에 남기지 않는다. 다른 경로는 기본 형식(main)을 쓴다.
    log_format  main     '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr rt=$request_time';
    log_format  no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'upstream=$upstream_addr rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}
