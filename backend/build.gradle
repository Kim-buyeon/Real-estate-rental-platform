plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.duri'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 내장 Tomcat 버전을 BOM 보다 올린다. Boot 4.1.1(최신)이 관리하는 11.0.24 에 CRITICAL 3건(CVE-2026-65182 ·
// CVE-2026-65905 · CVE-2026-68525)이 있고 11.0.25 에서 고쳐졌다 — 이미지 워크플로의 Trivy 가 막았다.
// Boot 가 11.0.25 이상을 관리하는 버전으로 올라가면 이 줄을 지운다.
ext['tomcat.version'] = '11.0.26'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// JWT 서명·검증. Nimbus JOSE + JWT 를 Spring Boot BOM 이 관리하는 좌표로 끌어온다.
	// jjwt 를 쓰지 않는 이유: jjwt 의 JSON 연동 모듈이 Jackson 2(com.fasterxml.jackson.databind)를
	// 요구하는데 이 프로젝트 런타임은 Jackson 3(tools.jackson) 단독이다.
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	// MyBatis 조회 전용 매퍼. 버전을 직접 적는 이유: Spring Boot BOM 이 이 스타터를 관리하지 않아
	// 생략하면 의존성 해석이 실패한다. 4.1.0 이 Boot 4.1 대응 릴리스다 — 4.0.x 는 Boot 4.0 용이다.
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
	// Spring AOP 프록시. Boot 4 에는 spring-boot-starter-aop 가 없다(3.5 계열까지만 배포됐다).
	// aspectjweaver 를 직접 넣어야 @Aspect 기반 자동 프록시(AnnotationAwareAspectJAutoProxyCreator)가 산다.
	// 버전은 Boot BOM 이 관리한다.
	implementation 'org.aspectj:aspectjweaver'
	// 외부 연동 격리 — 타임아웃 · 재시도 · 서킷 · 폴백. 기술 스택 정의서 2장.
	// 좌표에 주의한다: Boot 4 대응 라인은 resilience4j-spring-boot4 다. resilience4j-spring-boot3 는
	// Spring Boot 3 용이며 같은 2.4.0 버전으로 함께 배포된다.
	// 애노테이션(@Retry · @CircuitBreaker)은 Spring AOP 프록시로 동작하므로 starter-aop 가 함께 필요하다.
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
	// 등기 재조회 배치(RISK-08). Boot 4 의 이 스타터는 메타데이터를 메모리에 두는 resourceless 저장소가 기본이다 —
	// JDBC 저장소는 spring-boot-starter-batch-jdbc 로 분리됐다. 재시작 메타데이터가 필요 없는 일 1회 재실행형 배치라
	// 메타데이터 테이블 · 마이그레이션을 두지 않는다. 버전은 Boot BOM 이 관리한다.
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	// 커스텀 지표(SSE 활성 연결 수) 등록 API. 지금은 배치 스타터가 전이로 끌어오지만, 배치를 걷어내도 지표 코드가 남도록 직접 적는다.
	// 노출(Actuator · Prometheus 레지스트리)은 이 좌표가 하지 않는다 — 레지스트리 빈이 생기면 MeterBinder 가 그때 묶인다.
	// 버전은 Boot BOM 이 관리한다.
	implementation 'io.micrometer:micrometer-core'
	// 준비 상태 확인(/actuator/health/readiness) — 인프라 API 명세 1.1. 배포 스크립트가 슬롯을 upstream 에 되돌리기 전에 본다.
	// 지표 노출(Prometheus 레지스트리)은 관측(INF-05)이 차기 범위라 넣지 않는다. 버전은 Boot BOM 이 관리한다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 테스트 실행에서는 반복 배치 스케줄을 띄우지 않는다. 테스트가 배치 시각에 걸리면 공유 컨테이너의 데이터에
// 배치가 끼어든다. 시스템 속성은 application.yml 을 이기고, 테스트가 직접 띄우는 두 번째 컨텍스트에도 걸린다.
tasks.withType(Test).configureEach {
	systemProperty 'risk.batch.registry-refresh.enabled', 'false'
}

// 단위 테스트만 돈다. 컨테이너를 띄우는 것은 @Tag("integration") 으로 갈라 뺀다.
// 2026-09-13 실측에서 단위 132건 94초, 통합 8개 클래스 57건 378초였다. 구현 중 반복
// 실행에서 통합 비용을 매번 물지 않게 한다. 검증을 줄이는 것이 아니라 언제 돌릴지를 가른다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

// Testcontainers 로 실제 PostgreSQL·Redis 를 띄우는 테스트. check 에 물리므로
// ./gradlew build 는 지금처럼 단위와 통합을 모두 돈다 — CI 워크플로가 build 를 쓴다.
tasks.register('integrationTest', Test) {
	useJUnitPlatform {
		includeTags 'integration'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter tasks.named('test')
}

// Testcontainers 는 통합·매퍼·다중 인스턴스 테스트에서만 쓴다. 단위 테스트가 컨테이너를 띄우면
// 구현 중 반복 실행에 매번 수 분이 붙는다. 문서로 막으면 다시 같은 일이 나므로 빌드가 막는다.
// 지원 클래스(@TestConfiguration)는 컨테이너를 정의할 뿐 테스트가 아니므로 제외한다.
tasks.register('checkIntegrationTagging') {
	def testSrc = file('src/test/java')
	inputs.dir testSrc
	outputs.upToDateWhen { false }
	doLast {
		def offenders = []
		testSrc.eachFileRecurse { f ->
			if (!f.name.endsWith('.java')) return
			def text = f.getText('UTF-8')
			def usesContainers = text.contains('org.testcontainers') || text.contains('TestcontainersConfiguration')
			if (usesContainers && !text.contains('@TestConfiguration') && !text.contains('@Tag("integration")')) {
				offenders << f.name
			}
		}
		if (offenders) {
			throw new GradleException(
				'Testcontainers 를 쓰면서 @Tag("integration") 이 없는 테스트: ' + offenders.join(', ') +
				' — 통합 테스트가 아니면 컨테이너를 쓰지 않는다. 통합 테스트면 태그를 붙인다.')
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest'), tasks.named('checkIntegrationTagging')
}
