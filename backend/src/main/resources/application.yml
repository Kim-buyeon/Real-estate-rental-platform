spring:
  application:
    name: rental-platform
  config:
    # 저장소 루트의 .env 를 읽는다. 앱과 Gradle 테스트의 작업 디렉터리가 backend/ 라 상대 경로는 ../.env 다.
    # Boot 에는 dotenv 기능이 없으므로 [.properties] 확장자 힌트로 properties 처럼 읽힌다.
    # optional: 은 필수다 — CI 와 컨테이너에는 이 파일이 없다. 운영에서는 실제 환경 변수가 이 파일을 이긴다.
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:rental}
    username: ${POSTGRES_USER:rental}
    password: ${POSTGRES_PASSWORD:rental}
    # 커넥션 풀. 아래 값은 전부 미확정 잠정치다 — 부하 시험이 차기 범위라 실측 근거가 없다.
    # 부하 시험이 들어오면 그때 확정하고, 확정값은 설계 문서에 먼저 적는다.
    hikari:
      # 2 vCPU 노드에 앱 슬롯이 둘이므로 노드 합계는 16, 앱 노드가 둘(APP-01 · APP-02)이라 전체는 32 다. PostgreSQL 의 최대 커넥션은 그 위에
      # 운영자 psql · 관리 접속 여유를 얹어 잡혀 있다 — 값은 운영 Compose 가 갖는다. 이 풀을 키우면
      # 그쪽도 함께 본다. Flyway · 배치는 이 풀에서 빌리므로 따로 세지 않는다.
      # 풀을 키운다고 처리량이 늘지 않는다 — vCPU 가 둘이라 DB 쪽 경합만 커진다.
      maximum-pool-size: 8
      # 유휴 시 유지할 최소 커넥션. 0 으로 두면 유휴 뒤 첫 요청이 접속 비용을 문다.
      minimum-idle: 2
      # 밀리초. 풀에서 커넥션을 얻기까지 기다리는 상한. Boot(HikariCP) 기본 30초는 DB 가 느려질 때
      # 사용자 요청이 30초를 기다린 뒤에야 실패한다는 뜻이고, 그동안 Tomcat 스레드가 차서 전면 정지로 번진다.
      # 빨리 실패해야 스레드 점유가 짧아지고 사용자가 30초를 기다리지 않는다.
      # 앞단이 다른 슬롯으로 넘겨 주지는 않는다 — 풀 고갈은 500 으로 나가고 운영 절차서 4.2 의
      # proxy_next_upstream 은 502 · 503 · 연결 오류만 재시도한다.
      connection-timeout: 5000
      # 밀리초. 빌려주기 전 커넥션 생존 확인의 상한. connection-timeout 보다 짧아야 한다.
      validation-timeout: 3000
      # 밀리초(30분). 커넥션을 주기적으로 새로 만든다. 오래 붙어 있던 커넥션이 DB · 방화벽 쪽에서
      # 조용히 끊긴 채 풀에 남는 것을 막는다.
      max-lifetime: 1800000
      # 밀리초(5분). 유휴 커넥션을 주기적으로 찔러 살아 있는지 확인한다.
      keepalive-time: 300000
      # 밀리초(30초). 이 시간이 지나도 반납되지 않은 커넥션을 로그로 드러낸다. 반납 누락은 풀 고갈로만
      # 드러나면 원인을 찾기 어렵다.
      leak-detection-threshold: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
  lifecycle:
    # graceful 종료의 대기 상한. 넘으면 남은 요청을 끊고 내려간다. 배포 drain(30초)과 같게 둔다 — 운영 절차서 3.2.
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        # @Scheduled 실행 스레드 수. Boot 기본은 1 이다. 등기 재조회 배치(03:00)는 끝날 때까지 스레드를 쥐고 있으므로, 1 이면 그동안
        # SSE 하트비트(notification.sse.heartbeat-interval)가 멈춰 프록시가 유휴 연결을 끊는다. 스케줄이 둘이라 2 로 둔다.
        size: 2
  # 비밀번호 재설정 메일(USER-06)의 SMTP. external.mail.mode=real 일 때만 쓰인다 — 기본 mock 은 접속하지 않는다.
  # 운영은 Gmail SMTP(기술 스택 정의서 2장). 계정 · 앱 비밀번호는 .env 에 둔다. 호스트 · 포트 기본값은 Gmail 의 STARTTLS 포트다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # 평문으로 떨어지지 않게 한다. 서버가 STARTTLS 를 거절하면 계정 · 본문(토큰)을 평문으로 보내느니 실패한다.
            required: true
          # 밀리초. Jakarta Mail 기본은 무한 대기라 SMTP 가 멈추면 비동기 실행기의 작업이 끝나지 않는다.
          # 미확정 — 잠정 5초. external.mail.read-timeout 과 같게 둔다. 5주차 부하 시험에서 확정한다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  batch:
    job:
      # 기동할 때 Job 을 자동으로 돌리지 않는다. 등기 재조회 배치는 스케줄이 날짜 락 안에서만 시작한다 — 기동마다 돌면 두 인스턴스가
      # 락 없이 각자 관심 매물 등기를 뗀다. Boot 기본값은 true 다(spring-boot-batch 4.1.1 메타데이터).
      enabled: false

server:
  # 종료 신호를 받으면 새 요청을 받지 않고 처리 중인 요청을 끝낸 뒤 내려간다. 슬롯 교체 배포(운영 절차서 3장)가 drain 뒤에
  # 컨테이너를 교체하므로 남은 요청이 끊기지 않게 한다. 기다리는 상한은 아래 timeout-per-shutdown-phase 다.
  shutdown: graceful
  # 슬롯 번호별 포트(8081 · 8082)는 컨테이너 환경 변수 SERVER_PORT 로 덮는다 — 시스템 구성서 4장. 기본은 로컬 개발 포트다.
  port: 8080
  # 내장 Tomcat. 아래 값은 전부 미확정 잠정치다 — 부하 시험이 차기 범위라 실측 근거가 없다.
  tomcat:
    threads:
      # 요청 처리 스레드 상한. 기본 200 은 2 vCPU · DB 풀 8 인 노드에서 의미가 없다. 동시에 일할 수 있는
      # 것은 vCPU 둘이고 DB 를 쓰는 요청은 어차피 8 개에서 막히므로, 스레드를 늘리면 컨텍스트 전환만 늘고
      # 스레드마다 스택 메모리를 문다(노드가 2 GiB 이고 앱 슬롯이 둘이다).
      # SSE 는 Spring MVC 비동기라 요청 스레드를 붙들지 않는다 — 이 값이 동시 SSE 연결 수를 제한하지 않는다.
      max: 50
      # 유휴 시 유지할 스레드. 갑작스러운 요청에 스레드 생성 비용을 물지 않게 한다.
      min-spare: 10
    # 동시에 열어 둘 수 있는 연결 수. 처리 스레드보다 훨씬 크게 둔다 — SSE 처럼 오래 열려 있으나 스레드를
    # 쓰지 않는 연결이 여기에 포함된다.
    max-connections: 2000
    # 연결이 가득 찼을 때 OS 백로그에 쌓아 두는 수. 넘으면 연결이 거절되고 앞단이 다른 슬롯으로 넘긴다.
    accept-count: 100
    # 연결을 맺은 뒤 요청 라인이 도착하기까지 기다리는 상한. 열어만 두고 보내지 않는 연결이 자리를 차지하지 않게 한다.
    connection-timeout: 5s
    mbeanregistry:
      # Tomcat 의 MBean 레지스트리. Boot 기본은 false 다(spring-boot-tomcat 4.1.1 메타데이터). 꺼져 있으면 Micrometer 가
      # 읽을 MBean 이 없어 tomcat.threads.* 지표가 나오지 않는다 — 인프라 API 명세 1장이 Tomcat 스레드 지표를 요구한다.
      enabled: true

# 준비 상태 확인(인프라 API 명세 1.1)과 지표 노출(같은 명세 1장, 관측 INF-05). 이 둘만 연다.
# /actuator/prometheus 는 인증 없이 열려 있다 — 통제는 노출 범위가 한다(보안 설정 PUBLIC_PATHS 주석).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # 요청 지연을 정해 둔 경계마다 누적 카운터로 낸다. percentiles-histogram 을 켜지 않는 이유: 구간이 수십 개이고
      # uri · status 조합마다 곱해져 Grafana Cloud 무료 한도(활성 시계열 10k)를 위협한다. 아래는 운영 절차서 3.3 의
      # 기준(p95 1초)을 읽을 수 있는 최소 구간이다. 단위를 생략하면 ms 다.
      # 대괄호는 맵 키의 점을 지키는 표기다 — 키가 미터 이름 http.server.requests 그대로여야 적용된다.
      # 키 이름은 spring-boot-micrometer-metrics 4.1.1 메타데이터에서 확인했다(management.metrics.distribution.slo).
      slo:
        "[http.server.requests]": 100ms,300ms,500ms,1s,3s
  endpoint:
    health:
      # liveness · readiness 그룹. Boot 는 쿠버네티스 위에서만 자동으로 켜므로 Compose 운용에서는 명시해야 한다.
      # readiness 그룹의 기본 구성은 readinessState 하나라 DB 순단에 DOWN 이 되지 않는다 — 명세 1.1 이 readiness 를 쓰는 이유다.
      probes:
        enabled: true
  health:
    mail:
      # 메일 건강 확인을 끈다. starter-mail 이 들어오면 SMTP 접속 확인이 /actuator/health 에 붙는데(spring-boot-mail 4.1.1 의
      # management.health.mail.enabled 기본 true), 메일은 응답 뒤 비동기 보조 경로라 SMTP 순단이 앱을 DOWN 으로 만들면 안 된다.
      # 기본 mock 에서는 계정 없는 Gmail 에 접속을 시도해 늘 DOWN 이 된다.
      enabled: false

# 조회 전용 매퍼 설정. 쓰기는 JPA 가 담당한다 — 아키텍처 설계서(영속성 구조) 1.1.
# 키 이름은 mybatis-spring-boot-autoconfigure 4.1.0 의 spring-configuration-metadata.json 에서 확인했다.
mybatis:
  # 매퍼 XML 은 resources/mapper/<도메인>/ 에 둔다 — 같은 문서 1.1.
  # classpath* 로 둔다. classpath 는 루트 mapper/ 를 클래스패스에서 한 곳만 찾으므로,
  # 테스트에서는 test/resources 가 앞서 프로덕션 매퍼 XML 전체가 조용히 무시된다.
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 스네이크 컬럼(users.annual_income) → 카멜 필드(annualIncome). 기본값은 false 다.
    # 컬럼은 소문자 스네이크, JSON 필드는 소문자 카멜 — 코딩 규칙 문서.
    map-underscore-to-camel-case: true
    # 조회 DTO 는 record 다. setter 가 없으므로 MyBatis 가 생성자로 값을 넣어야 하는데,
    # 기본 동작은 생성자 인자를 "순서"로 맞춘다 — 필드를 하나 끼워 넣으면 조용히 틀린다.
    # true 로 두면 인자 "이름"으로 맞추므로 평면 DTO 는 <constructor> XML 없이 받는다.
    # 인자 이름을 런타임에 읽는 조건인 -parameters 는 Spring Boot Gradle 플러그인이 이미 붙인다.
    arg-name-based-constructor-auto-mapping: true

# 매물 조회.
property:
  district-counts:
    # 자치구 집계 캐시 TTL. 미확정 — 명세(매물 1.5)는 캐싱만 정했다. 매물은 적재 · 갱신 배치로만 바뀌어
    # 잠정 10분으로 둔다. 1주차 예비 부하 측정에서 확정한다.
    cache-ttl: 10m

# 사용자 요청 재분석 — API 명세서(위험도 분석) 1.2.
risk:
  reanalyze:
    # 매물 단위 최소 간격. 분석이 끝난 시각부터 센다. 미확정 — 근거 문서가 없어 잠정 10분으로 둔다.
    # 5주차 부하 시험(T7 배치 동시)에서 확정한다.
    min-interval: PT10M
    # 같은 매물을 다른 요청이 분석 중일 때 기다리는 상한. 넘으면 503. 미확정 — 락 만료와 같게 잠정 30초로 둔다.
    # 5주차 부하 시험(T7 배치 동시)에서 확정한다.
    lock-wait-timeout: PT30S
    # 기다리는 동안 락을 다시 시도하는 간격.
    lock-poll-interval: PT0.2S
    # 매물 분석 락(risk:analysis:lock:{propertyId}) 만료. 잡은 인스턴스가 죽어도 이 시간 뒤 풀린다. 등기 재조회와 분석이
    # 끝나기에 충분해야 한다 — 짧으면 실행 중에 풀려 등기를 두 번 뗀다. 미확정 — 잠정 30초로 둔다.
    # 5주차 부하 시험(T7 배치 동시)에서 확정한다.
    lock-lease-time: PT30S
  # 관심 매물 등기 재조회 배치(RISK-08). 매물 락은 위 lock-lease-time 을 함께 쓰고 기다리지 않는다(경합이면 건너뜀).
  batch:
    registry-refresh:
      # 스케줄 빈을 띄울지. 테스트 실행에서는 build.gradle 이 false 로 덮는다.
      enabled: true
      # 실행 시각(서울). 미확정 — 저부하 시간대로 잠정 03:00 으로 둔다. 5주차 T7(배치 동시 부하)에서 확정한다.
      cron: "0 0 3 * * *"
      # 대상 매물 식별자를 한 번에 읽는 건수이자 배치 스텝의 청크 크기. 미확정 — 잠정 500건으로 둔다. 5주차 T7 에서 확정한다.
      page-size: 500
      # 날짜 락(risk:batch:registry-refresh:{yyyy-MM-dd}) 만료. 잡은 인스턴스가 죽었을 때만 쓰인다. 다음 날 같은 시각 전에
      # 풀려야 하므로 하루보다 짧게 둔다. 미확정 — 잠정 23시간으로 둔다. 5주차 T7 에서 확정한다.
      lock-lease-time: PT23H

# @Async 실행기(알림 생성 · 발송). 설정 클래스 AsyncConfig.
async:
  # 앱 종료 때 실행 중인 작업을 기다리는 상한. 넘으면 남은 작업은 끊긴다.
  # 미확정 — 잠정 30초. 5주차 부하 시험에서 확정한다.
  termination-timeout: PT30S

# 관심 매물 모니터링 알림 생성(NOTI-02) — 아키텍처 설계서(알림 전달) 1.1.
notification:
  # 중복 방지 키(noti:dedup:{userId}:{type}:{propertyId}:{afterValue}) 만료. 같은 변동이 재분석 · 일 1회 점검 배치에서 겹쳐
  # 들어오는 것을 막는 창이라 배치 주기와 같게 둔다. 미확정 — 근거 문서가 없어 잠정 24시간이다. 5주차 부하 시험에서 확정한다.
  dedup-ttl: PT24H
  create:
    # 같은 매물의 알림 생성 락(noti:create:{propertyId}) 대기 상한. 위험 등급 변경과 등기 변동이 한 재분석에서 함께 나오면
    # 뒤 이벤트가 앞 생성을 기다린다 — 건너뛰면 한쪽 알림이 빠진다. 넘으면 생성 실패로 기록만 한다.
    # 미확정 — 잠정 10초. 5주차 부하 시험(T7 배치 동시)에서 확정한다.
    lock-wait-timeout: PT10S
    lock-poll-interval: PT0.1S
    # 락 만료. 대상 사용자 전원의 저장이 끝나기에 충분해야 한다. 미확정 — 잠정 10초. 5주차 부하 시험에서 확정한다.
    lock-lease-time: PT10S
  # 실시간 수신(NOTI-03) — API 명세서(알림) 1.1.
  sse:
    # 연결 수명의 상한. 액세스 토큰 유효 시간과 같게 둔다 — 연결이 로그인 세션보다 오래 살아 있지 않게 하고, 클라이언트는
    # 새 티켓으로 재연결한다. 값을 따로 적지 않고 토큰 설정을 가리킨다.
    timeout: ${jwt.access-token-validity}
    # 연결을 여는 일회용 티켓의 수명(API 명세서 알림 1.1). 티켓은 발급 응답을 받은 즉시 EventSource 가 연다 —
    # 왕복 한 번을 버틸 길이만 있으면 된다. 느린 모바일 망과 재시도 한 번을 감안해 30초로 둔다. 더 길면 접근 로그에
    # 남은 티켓의 유효 시간이 길어지고, 더 짧으면 정상 연결이 망 상태에 따라 실패한다.
    ticket-ttl: PT30S
    # 하트비트 주석 이벤트 간격. 프록시 · 브라우저가 이벤트 없는 연결을 유휴로 끊지 않게 한다. 미확정 — 흔히 쓰는 30초 유휴
    # 제한보다 짧게 잠정 25초로 둔다. 5주차 부하 시험(SSE 동시 연결)에서 확정한다.
    heartbeat-interval: PT25S

# 비밀번호 재설정(USER-06) — API 명세서(회원) 1.3.
# 도메인 이름(user)으로 묶지 않는다 — user.* 는 JVM 시스템 속성(user.dir · user.home)의 이름공간이라 읽는 사람이 헷갈린다.
password-reset:
  # 토큰 수명. 명세 1.3 이 30분으로 정했다(OWASP Forgot Password Cheat Sheet 권고 범위 안). 메일 본문의 안내 문구도 이 값을 읽는다.
  token-ttl: PT30M
  # 같은 계정으로 메일을 다시 보내기까지의 간격. 명세 1.3 이 60초로 정했다 — 메일 폭탄 방지의 최소치로 잡은 잠정값이며
  # 운영 관찰로 조정한다(이슈 #146 계획).
  send-interval: PT60S
  # 메일 링크의 화면 기준 주소. 링크는 <이 값>/password-reset/confirm?token=<토큰> 이다. 기본은 로컬 Vite 개발 서버다.
  link-base-url: ${APP_BASE_URL:http://localhost:5173}

# 토큰 만료 시간은 비밀도 환경 차이도 아니므로 환경 변수로 두지 않는다(.env.example 말미).
# access-token-validity 는 로그인 응답의 expiresIn 과 같은 값이다 — API 명세서(회원·인증) 1.2.
jwt:
  # 기본값을 두지 않는다. 주입을 빠뜨린 채 앱이 뜨면 서명 키가 조용히 고정된다.
  # HS256 은 256비트 이상을 요구하므로 32바이트 미만이면 기동 시점에 실패한다.
  secret: ${JWT_SECRET}
  access-token-validity: 1800s
  refresh-token-validity: 14d

# 외부 연동. 인증키 이름은 데이터 적재 설계서 1.3 표가 정본이고 값은 .env 에 둔다.
# mode 는 비밀도 환경 차이도 아니라 여기에 적는다. 세 구현 중 무엇이 뜨는지를 고른다.
#   mock  — 고정 정상 응답. 기본값이다. 키가 없어도 돌고 외부로 나가지 않는다
#   real  — 실제 호출. 활용 신청이 승인된 뒤에만 쓴다
#   fault — 지연 · 오류 주입. 서킷 · 폴백 경로 확인용
# 바꿀 때는 기동 인자로 덮는다 — --external.rent-transaction.mode=real
external:
  rent-transaction:
    mode: mock
    # 국토교통부 전월세 실거래가. 아파트 · 오피스텔은 같은 호스트의 다른 서비스이며 활용 신청은 각각이다.
    base-url: https://apis.data.go.kr/1613000
    api-key: ${DATA_GO_KR_API_KEY:}
    # 타임아웃은 미확정이다. 어느 설계 문서도 대상별 값을 정하지 않았다.
    # 아래는 잠정치이며 예비 부하 측정에서 확정되면 바꾼다.
    connect-timeout: 2s
    read-timeout: 10s
    # Fault 구현이 읽는다. mode 가 fault 일 때만 쓰인다.
    #   error   — 즉시 실패. 연속 실패로 서킷이 열리는지 본다
    #   delay   — delay 만큼 지연한 뒤 정상 응답
    #   timeout — 읽기 타임아웃. delay 와 read-timeout 중 짧은 쪽이 지나면 실패한다
    fault:
      kind: error
      delay: 10s
  address-normalize:
    mode: mock
    base-url: https://business.juso.go.kr
    api-key: ${ADDRESS_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
    fault:
      kind: error
      delay: 10s
  geocode:
    mode: mock
    base-url: https://dapi.kakao.com
    api-key: ${KAKAO_REST_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
    fault:
      kind: error
      delay: 10s
  # 등기부등본. 개방 API 가 없어 Mock 만 있다(데이터 적재 설계서 1.3). 중계 서비스가 정해지기 전에는
  # real · fault 구현이 없으므로 mock 외의 값을 주면 구현 빈이 없어 기동이 실패한다.
  # 기본 URL · 키 · 타임아웃 · 서킷 인스턴스도 Real 이 붙는 변경에서 더한다.
  registry:
    mode: mock
  # 국토교통부 건축물대장. Mock · Fault 만 있다 — 활용 신청 승인과 요청 파라미터(시군구 · 법정동 코드, 번 · 지)
  # 저장이 확인되지 않아 Real 은 후속이다. real 을 주면 구현 빈이 없어 기동이 실패한다.
  # 기본 URL · 키 · 연결 타임아웃은 Real 이 붙는 변경에서 더한다. read-timeout 은 Fault 의 timeout 모드가 읽는다(미확정 잠정치).
  building-ledger:
    mode: mock
    read-timeout: 5s
    fault:
      kind: error
      delay: 10s

  # 메일 발송(USER-06 비밀번호 재설정). HTTP 연동이 아니라 기본 URL · 키가 없고, SMTP 접속 정보는 spring.mail 이 갖는다.
  #   mock  — 보내지 않고 링크를 로그로 남긴다. 토큰 원문이 로그에 남으므로 로컬 전용이다
  #   real  — spring.mail 의 SMTP 로 보낸다. 운영은 real 로 띄운다
  #   fault — 지연 · 오류 주입. 서킷 · 폴백 경로 확인용. 링크를 로그에 남기지 않는다
  mail:
    mode: mock
    # 보내는 주소. Gmail 은 로그인 계정 또는 그 계정에 등록된 별칭이어야 한다.
    from: ${MAIL_FROM:}
    # Fault 의 timeout 모드가 읽는다. spring.mail.properties.mail.smtp.timeout 과 같게 둔다(미확정 잠정치).
    read-timeout: 5s
    fault:
      kind: error
      delay: 10s

# 외부 한 곳의 장애가 전체를 멈추게 하지 않기 위한 격리. 인스턴스 이름은 연동 인터페이스의
# RESILIENCE_INSTANCE 상수와 같아야 한다 — 이름이 어긋나면 애노테이션이 조용히 기본 설정으로 돈다.
# Real 과 Fault 가 같은 인스턴스를 쓴다. 이름이 구현마다 다르면 Fault 로 연 서킷이 Real 의 것과
# 다른 서킷이 되어 확인한 것이 확인한 것이 아니게 된다.
#
# ※ 아래 임계값은 전부 미확정이다. 실패율 · 열린 상태 유지 시간 · 재시도 횟수를 정한 문서가 없다.
#   1주차 예비 부하 측정에서 확정하고, 확정되면 그 수치를 설계 문서에 먼저 적는다.
# ※ 서킷 기본 지표는 resilience4j-spring-boot4 2.4.0 의 CircuitBreakerMetricsAutoConfiguration 이 전이 의존
#   resilience4j-micrometer 로 레지스트리에 묶어 /actuator/prometheus 에 낸다(resilience4j_circuitbreaker_state 등, name 라벨이
#   연동 인터페이스의 RESILIENCE_INSTANCE). 서킷 상태는 이 기본 지표를 쓰고 커스텀 지표를 따로 만들지 않는다 — 기술 스택 정의서 2장(#220).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      rentTransaction:
        base-config: default
      addressNormalize:
        base-config: default
      geocode:
        base-config: default
      buildingLedger:
        base-config: default
      # 메일 발송. 재시도 인스턴스는 두지 않는다 — 발송은 멱등하지 않다(MailClient 주석).
      mail:
        base-config: default
  retry:
    configs:
      default:
        # 조회(멱등)만 재시도한다. 아래 연동은 모두 조회다.
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      rentTransaction:
        base-config: default
      addressNormalize:
        base-config: default
      geocode:
        base-config: default
      buildingLedger:
        base-config: default
