spring:
  application:
    name: rental-platform
  config:
    # 저장소 루트의 .env 를 읽는다. 앱과 Gradle 테스트의 작업 디렉터리가 backend/ 라 상대 경로는 ../.env 다.
    # Boot 에는 dotenv 기능이 없으므로 [.properties] 확장자 힌트로 properties 처럼 읽힌다.
    # optional: 은 필수다 — CI 와 컨테이너에는 이 파일이 없다. 운영에서는 실제 환경 변수가 이 파일을 이긴다.
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:rental}
    username: ${POSTGRES_USER:rental}
    password: ${POSTGRES_PASSWORD:rental}
    # 커넥션 풀. 크기는 2026-10-04 부하 시험 R04(#390 — 엔드포인트 9개 혼합 계단, 단계당 2분, 읽기 분산 켬, 슬롯 넷)의 Hikari 지표를
    # 근거로 정했다(#402). 세션 시간 제한은 아래 data-source-properties 주석. 나머지 값(minimum-idle · connection-timeout ·
    # validation-timeout · max-lifetime · keepalive-time)은 그 시험에서 따로 보지 않았다 — 근거는 각 항목 주석이다.
    hikari:
      # 슬롯당 5. R04 에서 기본 풀은 동시 사용 최대 1 / 8 · 대여 대기 최대 19 ms 였다 — 지도 · 목록 · 구별 집계가 읽기용 풀로 빠진 뒤
      # 기본 풀에 남는 것은 짧은 기본 키 조회와 쓰기다. 줄인 몫을 읽기용 풀(아래 app.datasource.replica)에 준다 — 거기는 2 / 2 를 다
      # 쓰고 대기 2 · 대여 대기 최대 558 ms 였다.
      # PostgreSQL 최대 커넥션(운영 Compose 의 max_connections 48)과의 산정 — 슬롯 넷 × (기본 5 + 읽기 4) = 36. DB 가 한 대로 몰려도
      # (DB-02 장애 · 페일오버) 36 이라 exporter · 백업 · 운영자 접속 여유가 12 다(전에는 32 + 8 = 40 · 여유 8). 이 풀이나 읽기용 풀을
      # 키우면 그쪽도 함께 본다. 배치는 이 풀에서 빌리므로 따로 세지 않는다. Flyway 는 풀 밖의 자기 커넥션을 쓴다(아래 spring.flyway).
      # 풀을 키운다고 처리량이 늘지 않는다 — DB 노드가 vCPU 둘이라 DB 쪽 경합만 커진다(#342 — 동시 2 부터 CPU 100 %).
      maximum-pool-size: 5
      # 유휴 시 유지할 최소 커넥션. 0 으로 두면 유휴 뒤 첫 요청이 접속 비용을 문다.
      minimum-idle: 2
      # 밀리초. 풀에서 커넥션을 얻기까지 기다리는 상한. Boot(HikariCP) 기본 30초는 DB 가 느려질 때
      # 사용자 요청이 30초를 기다린 뒤에야 실패한다는 뜻이고, 그동안 Tomcat 스레드가 차서 전면 정지로 번진다.
      # 빨리 실패해야 스레드 점유가 짧아지고 사용자가 30초를 기다리지 않는다.
      # 넘기면 503 SERVICE_BUSY 로 나간다(전역 예외 처리기, API 공통 명세 2장). 앞단은 503 을 다른 슬롯으로 다시 보내지 않는다 —
      # 503 을 슬롯 실패로 세면 DB 가 바쁠 때 슬롯 넷이 함께 빠진다(default.conf /api/ 블록 주석). 클라이언트가 다시 시도한다.
      connection-timeout: 5000
      # 밀리초. 빌려주기 전 커넥션 생존 확인의 상한. connection-timeout 보다 짧아야 한다.
      validation-timeout: 3000
      # 밀리초(30분). 커넥션을 주기적으로 새로 만든다. 오래 붙어 있던 커넥션이 DB · 방화벽 쪽에서
      # 조용히 끊긴 채 풀에 남는 것을 막는다.
      max-lifetime: 1800000
      # 밀리초(5분). 유휴 커넥션을 주기적으로 찔러 살아 있는지 확인한다.
      keepalive-time: 300000
      # 밀리초(30초). 이 시간이 지나도 반납되지 않은 커넥션을 로그로 드러낸다. 반납 누락은 풀 고갈로만
      # 드러나면 원인을 찾기 어렵다. 로컬 · CI · 테스트는 이 기본값으로 켠다.
      # **운영은 0(끔)이다** — 운영 .env 의 HIKARI_LEAK_DETECTION_THRESHOLD. 0 이 아니면 커넥션을 빌릴 때마다 감시 작업을
      # 하나 만들어 예약하고(HikariCP 7.0.2 ProxyLeakTaskFactory.java:40), 그 생성자가 new Exception(...) 으로 호출 스택을
      # 채운다(ProxyLeakTask.java:59). 누수가 없어도 모든 대여가 이 값을 치른다 — 2026-09-29 프로파일에서 지도 2단계 요청
      # 표본의 13.3 % 가 여기였다(JIT 컴파일이 섞인 프로파일이라 비중은 참고치다). 운영에서 반납 누락은 스택 대신 Hikari 대기 지표로 드러난다.
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:30000}
      # 세션 시간 제한(#402). 값과 그 근거는 아키텍처 설계서(성능 및 확장성) 1.4 — statement_timeout 30s(앞단 proxy_read_timeout 과
      # 같다) · idle_in_transaction_session_timeout 60s. 넘어 취소된 질의(SQLSTATE 57014)는 503 SERVICE_BUSY 로 나간다.
      # pgJDBC 의 접속 시작 파라미터(options)로 준다 — 커넥션을 맺을 때 서버가 세션 기본값으로 받으므로 문장을 따로 보내지 않고,
      # RESET 해도 이 값으로 돌아간다. 이 자리(data-source-properties)에 두는 이유 셋 —
      #   읽기용 풀이 그대로 입는다 — 읽기용 풀은 이 spring.datasource.hikari 를 먼저 입힌다(ReplicaDataSourceConfig).
      #   Flyway 에는 가지 않는다 — Flyway 의 커넥션은 url · 계정만으로 만든다(아래 spring.flyway 주석). url 에 붙이면 따라간다.
      #   서버 전역(-c) · ALTER ROLE 이 아니다 — 같은 계정의 운영자 수작업 · pg_basebackup 에 걸리지 않는다.
      # socketTimeout(#472) — 초. 응답을 기다리는 소켓 읽기의 상한이다(pgJDBC 기본 0 — 무한). 위와 같은 이유로 이 자리에 둔다
      # (두 풀이 입고 Flyway 에는 가지 않는다 — 큰 마이그레이션이 끊기지 않는다).
      #   서버 쪽 statement_timeout(30s)이 먼저 작동해 57014(503)로 끝나야 하므로 그보다 길게 둔다.
      #   서버가 사라지면(노드 정지 · 망 단절) 서버 쪽 상한은 작동하지 않고, 질의 중인 커넥션은 커널 재전송 상한(tcp_retries2 기본
      #   924.6초 이상)까지 매달린다. 페일오버와 달리 DB-02 장애에는 슬롯을 재기동하는 단계가 없어 읽기용 풀이 그대로 묶인다.
      #   값과 근거의 정본은 아키텍처 설계서(성능 및 확장성) 1.4 다.
      data-source-properties:
        options: "-c statement_timeout=30s -c idle_in_transaction_session_timeout=60s"
        socketTimeout: 60
      # 풀 이름 — Hikari 지표의 pool 태그다. 읽기 분산(app.datasource.replica)을 켜면 읽기용 풀이 replica 로 따로 나온다.
      # 이름을 주지 않으면 HikariPool-1 처럼 생성 순서로 붙는다.
      pool-name: primary
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      # Sentinel 접속(INF-01 #404) — master · nodes 가 있으면 Boot 가 위 host · port 대신 Sentinel 에게 주 Redis 를 묻는다.
      # 비어 있으면(로컬 · CI · Sentinel 전 운영) 지금처럼 host · port 단일 노드다. 빈 값도 Boot 에게는 「설정됨」이라
      # RedisSentinelConfig 가 둘 다 빈 Sentinel 설정을 지운다 — 한쪽만 있으면 기동을 멈춘다.
      # nodes 는 쉼표로 이은 host:port 목록. password 는 Sentinel 자체의 비밀번호이고, 주 Redis 의 비밀번호는 위 password 다.
      # TLS 는 따로 켜지 않는다 — spring.data.redis.ssl.* 를 켜면 Sentinel 접속에도 같은 SSL · 번들이 걸린다(RedisSentinelConfig 주석).
      sentinel:
        master: ${SPRING_DATA_REDIS_SENTINEL_MASTER:}
        nodes: ${SPRING_DATA_REDIS_SENTINEL_NODES:}
        password: ${SPRING_DATA_REDIS_SENTINEL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    # Flyway 의 PostgreSQL 잠금을 트랜잭션 advisory 잠금이 아니라 세션 잠금으로(#403). 기본(true)은 다른 커넥션이
    # pg_try_advisory_xact_lock 을 쥔 트랜잭션을 열어 둔 채 마이그레이션을 돌리는데, CREATE INDEX CONCURRENTLY(V24)는
    # 그보다 먼저 시작한 트랜잭션이 끝나기를 기다리므로 영영 끝나지 않는다. Redgate Flyway 문서
    # 「PostgreSQL Transactional Lock」 — CREATE INDEX CONCURRENTLY 같은 문장에는 false 로 두라고 한다.
    postgresql:
      transactional-lock: false
    # Flyway 는 앱 풀 밖의 자기 커넥션으로 돈다(#402). url 을 주면 Boot 가 이 url · 계정으로 풀 없는 데이터 소스(SimpleDriverDataSource)를
    # 따로 만든다(spring-boot-flyway 4.1.1 FlywayAutoConfiguration.getMigrationDataSource). 그 커넥션은 마이그레이션이 끝나면 닫힌다.
    # 앱 풀을 빌리면 두 가지가 꼬인다 —
    #   위 세션 시간 제한(30s)이 마이그레이션에도 걸린다. 대량 표의 인덱스 · 열 변경은 30초를 넘을 수 있고, 넘으면 기동이 실패한다.
    #   그렇다고 init-sqls 로 0 을 SET 하면 그 커넥션이 풀로 돌아가 앱 요청이 시간 제한 없는 세션을 받는다 — SET 은 세션에 남는다.
    # 값은 앱 풀과 같은 곳을 가리킨다(쓰기 노드). 테스트의 @ServiceConnection 은 이 값 대신 컨테이너 접속 정보를 준다.
    # 읽기 분산을 켜도 같다 — ReplicaDataSourceConfig 는 Flyway 전용 데이터 소스를 지정하지 않는다.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    # 자기 커넥션이라 SET 이 풀로 새지 않는다. 0 은 서버 기본값과 같지만 적어 둔다 — 나중에 DB · 계정 수준 기본값(ALTER DATABASE ·
    # ALTER ROLE)이 생겨도 마이그레이션은 끊기지 않는다. 실측 최장 마이그레이션은 V19 916 ms(#402 계획).
    # 끝의 세미콜론은 필수다 — Boot 가 목록을 줄바꿈으로 이어 한 스크립트로 넘기고(FlywayAutoConfiguration), Flyway 는 그것을 구분자(;)로
    # 나눈다(FlywayExecutor 의 연결 초기화). 빠지면 두 줄이 한 문장이 되어 문법 오류로 기동이 멈춘다.
    init-sqls:
      - SET statement_timeout = 0;
      - SET idle_in_transaction_session_timeout = 0;
  lifecycle:
    # graceful 종료의 대기 상한. 넘으면 남은 요청을 끊고 내려간다. 배포 drain(30초)과 같게 둔다 — 운영 절차서 3.2.
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        # @Scheduled 실행 스레드 수. Boot 기본은 1 이다. 등기 재조회 배치(03:00)는 끝날 때까지 스레드를 쥐고 있으므로, 1 이면 그동안
        # SSE 하트비트(notification.sse.heartbeat-interval)가 멈춰 프록시가 유휴 연결을 끊는다. 스케줄이 셋(하트비트 · 등기 재조회 ·
        # 매물 갱신)이라 3 으로 둔다 — 매물 갱신이 길어져 등기 재조회와 한 인스턴스에서 겹쳐도 하트비트 스레드가 남는다.
        # 대출 금리 갱신(loan.batch.rate-refresh.cron)은 월 1회 · 외부 호출 두 번이라 스레드를 늘리지 않는다.
        # Mock 대장 교체(risk.batch.mock-ledger-replace.cron, 04:30)는 예약 시각이 다른 배치가 끝난 뒤라 늘리지 않는다 — 03:00 등기
        # 재조회가 04:30 을 넘기면 두 배치 스레드를 쓰고도 하트비트 스레드가 하나 남는다. 기동 뒤 따라잡기(batch.startup-catchup)는
        # 이 풀을 쓰지 않는다. 배치가 한 프로세스에서 겹쳐도 Job 저장소는 배치마다 따로라 실행 기록이 섞이지 않는다.
        # 기준표 캐시 확인 두 스케줄(risk.criteria-cache)은 한 번이 Redis GET 하나 · 기준표 읽기 몇 ms 라 하트비트와 남는 스레드를
        # 나눠 쓴다 — 스레드를 늘리지 않는다. 배치 둘이 스레드를 쥔 동안 확인이 잠깐 밀려도 기준 반영이 그만큼 늦을 뿐이다.
        # 자치구 집계 세대 확인(property.district-counts.generation-check-interval)도 한 번이 Redis GET 하나라 같은 이유로 늘리지 않는다.
        size: 3
  # 비밀번호 재설정 메일(USER-06)의 SMTP. external.mail.mode=real 일 때만 쓰인다 — 기본 mock 은 접속하지 않는다.
  # 운영은 Gmail SMTP(기술 스택 정의서 2장). 계정 · 앱 비밀번호는 .env 에 둔다. 호스트 · 포트 기본값은 Gmail 의 STARTTLS 포트다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # 평문으로 떨어지지 않게 한다. 서버가 STARTTLS 를 거절하면 계정 · 본문(토큰)을 평문으로 보내느니 실패한다.
            required: true
          # 밀리초. Jakarta Mail 기본은 무한 대기라 SMTP 가 멈추면 비동기 실행기의 작업이 끝나지 않는다.
          # 미확정 — 잠정 5초. external.mail.read-timeout 과 같게 둔다. 5주차 부하 시험에서 확정한다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  batch:
    job:
      # 기동할 때 Job 을 자동으로 돌리지 않는다. 등기 재조회 배치는 스케줄이 날짜 락 안에서만 시작한다 — 기동마다 돌면 두 인스턴스가
      # 락 없이 각자 관심 매물 등기를 뗀다. Boot 기본값은 true 다(spring-boot-batch 4.1.1 메타데이터).
      enabled: false

# 읽기 분산(INF-03 확장, #343). 지도 조회(자치구 집계 · 목록 · 지도 묶음 — @ReplicaRead)를 DB-02(standby)로 보낸다.
# 근거: #342 측정 — 동시 2 부터 DB-01 CPU 가 100 % 에 붙고 13 TPS 에서 멈췄다. 조회를 반반 나누면 받을 수 있는 양이 2배가 된다.
# 꺼져 있거나(enabled false) 주소가 비면 읽기용 풀을 만들지 않고 모든 조회가 위 spring.datasource 풀로 간다 — 지금과 같다.
# 켜져도 Flyway · JPA · MyBatis · 트랜잭션 매니저는 하나다. 표시 없는 조회와 모든 쓰기는 위 풀로 간다(ReplicaDataSourceConfig 주석).
app:
  datasource:
    replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      # 쉼표로 이은 host:port 목록. 비면 꺼진 것과 같다. 어느 노드를 먼저 고르는지는 아래 targetServerType 이 정한다.
      hosts: ${DB_REPLICA_HOSTS:}
      # targetServerType=preferSecondary — 목록에서 standby 를 먼저 고르고, 없으면(DB-02 정지 · 승격으로 standby 가 사라짐) 아무
      #   노드나 받는다(DB-01). 노드 상태는 드라이버가 기억해 두고 hostRecheckSeconds(기본 10초 — pgJDBC 42.7.13 PGProperty)마다
      #   다시 본다. 그래서 DB-02 장애에 앱 코드 · 운영 절차가 할 일이 없다.
      #   대가: DB-02 가 돌아와도 그사이 DB-01 에 맺은 읽기 커넥션은 아래 max-lifetime(30분)이 지나 새로 맺을 때까지 DB-01 에 남는다.
      # 운영(#459) — DB_REPLICA_TARGET_SERVER_TYPE=any 로 두면 standby 를 따로 고르지 않고 목록 순서대로 붙는다(pgJDBC 문서 —
      #   loadBalanceHosts 기본(끔)이면 「hosts are connected in the given order」, 붙지 못하면 다음 주소). 운영 Compose 가 app-2 에
      #   반대 순서(DB_REPLICA_HOSTS_APP2)를 주어 app-1 둘은 DB-02, app-2 둘은 DB-01 에 읽기를 보낸다 — 앞단이 네 슬롯에 고르게 나누므로
      #   무거운 읽기가 두 DB 에 반씩 간다(10/6 결과서 — DB-02 한 대가 혼합 한계를 정했다). loadBalanceHosts=true 는 커넥션마다 무작위라
      #   슬롯 넷의 커넥션 16개가 한쪽으로 기울 수 있어 쓰지 않는다. 키가 없으면 preferSecondary — 지금까지와 같다.
      # connectTimeout=1 — 초. pgJDBC 기본은 10초다. 사설망의 정상 연결은 밀리초에 끝나므로, 죽은 노드에 커넥션 하나가 10초씩
      #   매달리지 않게 1초에 다음 주소로 넘긴다.
      # TLS 등 접속 옵션은 위 기본 풀과 같게 둔다 — 기본 풀 url 에 옵션이 없으므로 여기도 없다. 둘 다 pgJDBC 기본 sslmode=prefer 를
      #   따른다(서버가 TLS 를 받으면 TLS, DB 노드의 pg_hba.conf 가 VPC 평문을 거절한다 — 시스템 구성서 4장). 기본 풀에 옵션을 붙이면
      #   여기도 같이 붙인다. spring.datasource.hikari.data-source-properties 로 준 옵션은 아래 풀에도 그대로 입혀진다.
      # 주소는 위 hosts(= DB_REPLICA_HOSTS)를 읽는다 — 켜짐 판정과 접속 주소가 한 값에서 나온다.
      url: jdbc:postgresql://${app.datasource.replica.hosts}/${POSTGRES_DB:rental}?targetServerType=${DB_REPLICA_TARGET_SERVER_TYPE:preferSecondary}&connectTimeout=1
      # 사용자 · 비밀번호는 기본 풀과 같은 계정이다 — standby 는 primary 의 역할을 복제로 그대로 갖는다.
      username: ${POSTGRES_USER:rental}
      password: ${POSTGRES_PASSWORD:rental}
      # spring.datasource.hikari 의 값을 먼저 입히고 여기 적은 것만 덮는다(시간 상한 · max-lifetime · 누수 감지 등은 위와 같다).
      hikari:
        pool-name: replica
        # 커넥션을 읽기 전용으로 연다. 단 pgJDBC 42.7.13 의 readOnlyMode 기본값 transaction(PGProperty)에서는 트랜잭션 안에서만
        #   읽기 전용이 강제되고 autocommit 문장에는 걸리지 않는다. 표시한 조회 셋은 QueryService 클래스 수준 readOnly 트랜잭션
        #   안에서 돌므로, DB-02 가 없어 DB-01 에 붙어도 지금은 쓰기가 거절된다 — 트랜잭션 밖에서 이 풀을 쓰면 막히지 않는다.
        read-only: true
        # 슬롯당 4(#402). R04(#390)에서 슬롯당 2 를 다 쓰고 대기 2 · 대여 대기 최대 558 ms 였다 — 기본 풀은 1 / 8 만 썼다. 기본 풀을
        # 8 → 5 로 줄인 몫으로 늘린다. DB 가 한 대만 남으면(DB-02 장애 · 페일오버) 이 풀도 남은 노드로 붙어 기본 풀과 더해진다 —
        # 슬롯 넷 × (5 + 4) = 36 ≤ max_connections 48(운영 Compose), 여유 12. 앱 계정이 superuser 라 예약 연결로 막지 못하므로
        # 여유는 앱 풀이 상한을 지킨다는 전제의 값이다(#349 — 슬롯당 4 · 기본 8 이었을 때 48 로 여유 0 이라 2 로 줄였었다).
        # 늘린 뒤에도 DB 한 대는 동시 2 부터 CPU 100 % 였으므로(#342) 늘린 몫은 처리량이 아니라 대여 대기를 줄인다.
        maximum-pool-size: 4

server:
  # 종료 신호를 받으면 새 요청을 받지 않고 처리 중인 요청을 끝낸 뒤 내려간다. 슬롯 교체 배포(운영 절차서 3장)가 drain 뒤에
  # 컨테이너를 교체하므로 남은 요청이 끊기지 않게 한다. 기다리는 상한은 아래 timeout-per-shutdown-phase 다.
  shutdown: graceful
  # 슬롯 번호별 포트(8081 · 8082)는 컨테이너 환경 변수 SERVER_PORT 로 덮는다 — 시스템 구성서 4장. 기본은 로컬 개발 포트다.
  port: 8080
  # 내장 Tomcat. 아래 값은 전부 미확정 잠정치다 — 부하 시험이 차기 범위라 실측 근거가 없다.
  tomcat:
    threads:
      # 요청 처리 스레드 상한. 기본 200 은 2 vCPU · DB 풀(기본 5 + 읽기 4) 인 슬롯에서 의미가 없다. 동시에 일할 수 있는
      # 것은 vCPU 둘이고 DB 를 쓰는 요청은 어차피 풀 크기에서 막히므로, 스레드를 늘리면 컨텍스트 전환만 늘고
      # 스레드마다 스택 메모리를 문다(노드에 앱 슬롯이 둘이고 슬롯마다 메모리 상한이 있다 — 배분은 운영 Compose 머리 주석).
      # SSE 는 Spring MVC 비동기라 요청 스레드를 붙들지 않는다 — 이 값이 동시 SSE 연결 수를 제한하지 않는다.
      max: 50
      # 유휴 시 유지할 스레드. 갑작스러운 요청에 스레드 생성 비용을 물지 않게 한다.
      min-spare: 10
    # 동시에 열어 둘 수 있는 연결 수. 처리 스레드보다 훨씬 크게 둔다 — SSE 처럼 오래 열려 있으나 스레드를
    # 쓰지 않는 연결이 여기에 포함된다.
    max-connections: 2000
    # 연결이 가득 찼을 때 OS 백로그에 쌓아 두는 수. 넘으면 연결이 거절되고 앞단이 다른 슬롯으로 넘긴다.
    accept-count: 100
    # 연결을 맺은 뒤 요청 라인이 도착하기까지 기다리는 상한. 열어만 두고 보내지 않는 연결이 자리를 차지하지 않게 한다.
    connection-timeout: 5s
    mbeanregistry:
      # Tomcat 의 MBean 레지스트리. Boot 기본은 false 다(spring-boot-tomcat 4.1.1 메타데이터). 꺼져 있으면 Micrometer 가
      # 읽을 MBean 이 없어 tomcat.threads.* 지표가 나오지 않는다 — 인프라 API 명세 1장이 Tomcat 스레드 지표를 요구한다.
      enabled: true

# 준비 상태 확인(인프라 API 명세 1.1)과 지표 노출(같은 명세 1장, 관측 INF-05). 이 둘만 연다.
# /actuator/prometheus 는 인증 없이 열려 있다 — 통제는 노출 범위가 한다(보안 설정 PUBLIC_PATHS 주석).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # 요청 지연을 정해 둔 경계마다 누적 카운터로 낸다. percentiles-histogram 을 켜지 않는 이유: 구간이 수십 개이고
      # uri · status 조합마다 곱해져 Grafana Cloud 무료 한도(활성 시계열 10k)를 위협한다. 아래는 운영 절차서 3.3 의
      # 기준(p95 1초)을 읽을 수 있는 최소 구간이다. 단위를 생략하면 ms 다.
      # 대괄호는 맵 키의 점을 지키는 표기다 — 키가 미터 이름 http.server.requests 그대로여야 적용된다.
      # 키 이름은 spring-boot-micrometer-metrics 4.1.1 메타데이터에서 확인했다(management.metrics.distribution.slo).
      slo:
        "[http.server.requests]": 100ms,300ms,500ms,1s,3s
  endpoint:
    health:
      # liveness · readiness 그룹. Boot 는 쿠버네티스 위에서만 자동으로 켜므로 Compose 운용에서는 명시해야 한다.
      # readiness 그룹의 기본 구성은 readinessState 하나라 DB 순단에 DOWN 이 되지 않는다 — 명세 1.1 이 readiness 를 쓰는 이유다.
      probes:
        enabled: true
  health:
    mail:
      # 메일 건강 확인을 끈다. starter-mail 이 들어오면 SMTP 접속 확인이 /actuator/health 에 붙는데(spring-boot-mail 4.1.1 의
      # management.health.mail.enabled 기본 true), 메일은 응답 뒤 비동기 보조 경로라 SMTP 순단이 앱을 DOWN 으로 만들면 안 된다.
      # 기본 mock 에서는 계정 없는 Gmail 에 접속을 시도해 늘 DOWN 이 된다.
      enabled: false

# 조회 전용 매퍼 설정. 쓰기는 JPA 가 담당한다 — 아키텍처 설계서(영속성 구조) 1.1.
# 키 이름은 mybatis-spring-boot-autoconfigure 4.1.0 의 spring-configuration-metadata.json 에서 확인했다.
mybatis:
  # 매퍼 XML 은 resources/mapper/<도메인>/ 에 둔다 — 같은 문서 1.1.
  # classpath* 로 둔다. classpath 는 루트 mapper/ 를 클래스패스에서 한 곳만 찾으므로,
  # 테스트에서는 test/resources 가 앞서 프로덕션 매퍼 XML 전체가 조용히 무시된다.
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 스네이크 컬럼(users.annual_income) → 카멜 필드(annualIncome). 기본값은 false 다.
    # 컬럼은 소문자 스네이크, JSON 필드는 소문자 카멜 — 코딩 규칙 문서.
    map-underscore-to-camel-case: true
    # 조회 DTO 는 record 다. setter 가 없으므로 MyBatis 가 생성자로 값을 넣어야 하는데,
    # 기본 동작은 생성자 인자를 "순서"로 맞춘다 — 필드를 하나 끼워 넣으면 조용히 틀린다.
    # true 로 두면 인자 "이름"으로 맞추므로 평면 DTO 는 <constructor> XML 없이 받는다.
    # 단 이 자동 매핑은 행마다 생성자 · 인자 이름을 리플렉션으로 다시 찾아, 행이 많은 조회는 매퍼 XML 에 이름 지정 <constructor>
    # 를 둔다(기동 때 한 번 맞추고 틀리면 기동 실패). 반경 요청 CPU 의 85 % 가 이 매핑이었다(#390 P01, #397).
    # 인자 이름을 런타임에 읽는 조건인 -parameters 는 Spring Boot Gradle 플러그인이 이미 붙인다.
    arg-name-based-constructor-auto-mapping: true

# 매물 조회.
property:
  district-counts:
    # 자치구 집계 캐시 TTL. 미확정 — 명세(매물 1.5)는 캐싱만 정했다. 매물은 적재 · 갱신 배치로만 바뀌어
    # 잠정 10분으로 둔다. 1주차 예비 부하 측정에서 확정한다. Redis 키에는 세대가 들어 있어(#406) 세대가 바뀌면 옛 키는 읽히지
    # 않고 이 TTL 로 사라진다.
    cache-ttl: 10m
    # 슬롯 로컬 캐시(#406) — 적중하면 Redis 도 DB 도 부르지 않는다. 아키텍처 설계서(성능) 1.3 의 예외.
    #
    # 만료 1분 — Redis TTL(10분)보다 짧게 둔다. 로컬 항목의 수명은 이 값과 「집계 시각 + cache-ttl」 중 이른 쪽이라, 응답이 낡을
    # 수 있는 상한은 로컬 캐시를 두기 전과 같은 cache-ttl 이다(Redis 에서 9분 묵은 값을 로컬에 담아도 1분을 더 들지 않는다). 1분은
    # 세대 확인이 Redis 실패로 멈춘 동안 다른 슬롯이 올린 세대를 놓치는 시간의 상한이고, 대가는 슬롯 · 키마다 분당 Redis GET 한
    # 번이다 — 성능 원인 조사(perf-cards)의 적중 14002 · 빗나감 3 처럼 키 가짓수가 적어 부담이 없다.
    local-ttl: 1m
    # 크기 상한 500건 — 한 건(25개 자치구 × 등급 셋 + 키 문자열 · 캐시 노드)을 6KB 안쪽으로 어림하면 500건이 3MB 안쪽이다. 슬롯
    # 힙(컨테이너 768m × MaxRAMPercentage 35% ≈ 270MB, #394)의 1% 남짓. 필터 조합(금액 · 면적 범위)은 이론상 끝이 없으므로
    # 상한이 없으면 힙이 는다. 넘치면 Caffeine 이 덜 쓰는 항목부터 내보낸다.
    local-max-size: 500
    # 세대 키(property:district-counts:gen) 확인 간격 — 반복 작업의 간격. 배치(매물 갱신 · 등기 재조회 · Mock 대장 교체) · 초기 적재가 끝나 세대를 올리면, 다른
    # 슬롯이 그 변경을 보기까지의 상한이다. 1초 — 기준표 캐시 확인(risk.criteria-cache.version-check-interval)과 같은 근거: 슬롯
    # 넷이어도 Redis GET 초당 4회라 부담이 없다. 고정 지연이라 Redis 가 느려도 겹쳐 쌓이지 않는다.
    generation-check-interval: PT1S
  # 지도 묶음 응답의 캐시 — 슬롯 로컬(#415) 앞 · Redis(#465) 뒤. API 명세서(매물) 1.12 「서버 캐시」, 아키텍처 설계서(성능) 1.3 의
  # 예외. 세대는 위 자치구 집계의 세대 키를 함께 쓴다(같은 확인 반복 작업이 두 캐시의 로컬을 비운다 — 확인 간격도 위 값).
  map-clusters:
    # Redis TTL 1분 — 응답이 낡을 수 있는 상한(정확히는 1분 + 그 응답의 DB 조회 시간 — Redis 쓰기가 조회 뒤에 TTL 을 건다)이다.
    # 로컬 항목의 수명은 local-ttl 과 「DB 에서 읽기 시작한 시각 + 이 값」 중 이른 쪽이라 Redis 에서 묵은 값을 로컬에 담아도 더 늘지 않는다. 로컬만 두던 때(#415)의 상한 1분을 그대로 지킨다 — 마커의 등급은
    # 재분석한 사용자가 지도로 돌아와 곧바로 다시 보는 값이고, 캐시를 두기 전에는 낡음이 없었다(요청마다 DB). 자치구 집계의
    # 상한(cache-ttl 10분)까지 늘리지 않는 이유도 이것이다.
    # Redis 층을 둔 이유는 아키텍처 설계서(성능) 1.3 「예외 셋」이 갖는다.
    # 값은 JSON 을 gzip 해 Base64 로 담는다(MapClusterCacheStore). 강남구 12 × 12 응답 JSON 13,007 B → gzip 2,095 B(2026-10-07
    # 운영 실측, Base64 로 약 4/3 배). 운영 Redis 는 maxmemory 64mb · volatile-lru 라 차면 TTL 있는 다른 키(로그인 토큰 등)가
    # 밀려난다 — 그래서 크기를 줄인다.
    redis-ttl: 1m
    # 로컬 만료 1분 — redis-ttl 과 같다. 세대를 올리지 않는 변경(사용자 재분석 — 건마다 전 슬롯을 비우면 캐시가 무의미하다)과
    # Redis 장애로 놓친 다른 슬롯의 세대 변경이 이 안에 보인다. 자치구 집계 로컬 만료(local-ttl 1분)와 같은 값 · 같은 근거다.
    # 실제 수명은 위 redis-ttl 로 깎이므로 Redis 에서 가져온 항목은 1분보다 짧게 든다.
    local-ttl: 1m
    # 크기 상한 — 무게의 합. 무게 = 1 + 묶음 수 + 마커 수(MapClusterCache.weight). 격자 행 · 열이 각각 많아야 24(명세 1.12)라
    # 응답 하나가 많아야 1 + 576 = 577 이다(기본 12 × 12 면 145).
    # 힙 크기를 쟀다(2026-10-05, JDK 21 · 압축 포인터, 응답 2,000건을 만들어 GC 뒤 사용량 차이): 묶음 한 칸 369 B · 마커 한 건
    # 302 B, 묶음 144칸 응답 하나가 약 52 KB(JSON 은 더 작다 — 묶음만 있는 응답이 18 KB 안팎). 20,000 이면 항목 몫이 많아야
    # 20,000 × 369 B ≈ 7.4 MB 에 키 문자열 · 캐시 노드(건마다 수백 B)가 더해진다 — 슬롯 힙(768m × MaxRAMPercentage 35% ≈ 270 MB,
    # #394)의 3% 남짓이고 자치구 집계 로컬(3 MB 안쪽)과 합쳐 4% 남짓이다. 건수로는 꽉 찬 묶음 응답 약 135건, 18 KB 응답(묶음
    # 80칸 안팎으로 어림)이면 약 250건이다. 행 · 열 상한(24 × 24)으로 꽉 찬 응답은 576 × 369 B ≈ 213 KB 라 20,000 이면 약 35건이고,
    # 데스크톱이 보통 보내는 12 ~ 18 × 15 ~ 20(180 ~ 360칸)이 다 찬 응답이면 55 ~ 110건 안팎이다. 넘치면 Caffeine 이 덜 쓰는 항목부터
    # 내보낸다. 값은 그대로 두고 적중률은 배포 뒤 측정해 정한다. 건수 상한을 쓰지 않는 이유 — 응답이 1 ~ 577 항목으로 달라 건수로는
    # 힙을 묶지 못한다.
    local-max-weight: 20000
  # 매물 · 시세 갱신 배치(RISK-08) — 데이터 적재 설계서 1.5 「매물 · 시세 일 1회」. 실거래가를 다시 모아 새 매물을 저장하고
  # 바뀐 시세를 반영한 뒤, 시세가 바뀐 매물은 재분석 · 최신 판정이 없는 매물은 판정한다. 매물 락은 risk.reanalyze.lock-lease-time
  # 을 함께 쓰고 기다리지 않는다(경합이면 건너뜀).
  batch:
    refresh:
      # 스케줄 빈을 띄울지. 테스트 실행에서는 build.gradle 이 false 로 덮는다.
      enabled: true
      # 실행 시각(서울). 미확정 — 00:30. 등기 재조회(risk.batch.registry-refresh.cron, 03:00)와 같은 시각이면 두 배치가 같은 매물의
      # 분석 락을 다투고, 02:00 은 논리 백업 · 일 01:00 · 01:30 은 설정 사본 · 물리 백업이다(플랫폼 설계서 7.2 작업표 — 이 시각을
      # 거기서 비워 둔다). 소요 시간을 잰 적이 없다 — 회차 소요와 01:00 · 02:00 과의 겹침을 보고 확정한다.
      cron: "0 30 0 * * *"
      # 다시 모으는 기간(개월). 초기 적재 기본값(PropertyLoadRunner 12개월)과 같게 둔다 — 시세가 표본 중앙값이라 기간이 다르면
      # 바뀌지 않은 매물까지 「변경」으로 잡힌다. 초기 적재 기간을 바꾸면 함께 바꾼다. 회차마다 실거래가 호출이 25개 구 × 기간 × (전월세 2 + 매매 2개
      # 서비스)(12개월이면 최대 1,200회)이고, 여기에 수집한 거래마다 주소 정규화 · 좌표 조회가 더해진다(자치구 안 같은 주소는 한 번 — 기존 매물
      # 판별이 변환 뒤라 기존 매물도 매 회차 조회한다). 거래 건수만큼이라 횟수를 고정값으로 적지 않는다. 실거래가 · 주소 · 좌표
      # API 의 일일 호출 한도는 미확정 — 각 제공처 계정의 실제 한도로 확정한다.
      months: 12
      # 판정 대상(최신 판정 없는 매물) 식별자를 한 번에 읽는 건수이자 판정 스텝의 청크 크기. 미확정 — 등기 재조회 배치의
      # page-size 와 같게 잠정 500건. 부하 시험에서 확정한다.
      page-size: 500
      # 날짜 락(property:batch:refresh:{yyyy-MM-dd}) 만료. 잡은 인스턴스가 죽었을 때만 쓰인다 — 끝나면 해제하고, 도는
      # 동안은 아래 연장 간격마다 이 길이로 다시 늘린다. 2분 — 프로세스가 죽은 뒤(배포 · OOM 이면 해제가 돌지 않는다) 길어야
      # 2분이면 풀려, 같은 날 기동 뒤 따라잡기가 다시 잡는다. 측정으로 정하는 값이 아니라 설계 값이다(#340 승인). 배포 · 장애에서
      # 락이 늦게 풀리거나 연장이 끊기는 것이 관찰되면 다시 정한다.
      lock-lease-time: PT2M
      # 날짜 락 연장 간격. 40초 — 만료의 1/3 이다. 연장은 앞 연장이 끝난 뒤 간격을 세므로(고정 지연) 한 번 놓쳐도 다음 연장이
      # 만료 전에 닿아 유지되고, 두 번 놓치면 풀린다. 설계 값이다(#340 승인). 배포 · 장애에서 락이 늦게 풀리거나 연장이 끊기는
      # 것이 관찰되면 다시 정한다.
      lock-renew-interval: PT40S

# 사용자 요청 재분석 — API 명세서(위험도 분석) 1.2.
risk:
  reanalyze:
    # 매물 단위 최소 간격. 분석이 끝난 시각부터 센다. 미확정 — 근거 문서가 없어 잠정 10분으로 둔다.
    # 부하로 정할 값이 아니다 — T7(2026-09-27)은 근거를 주지 못했다. 운영 뒤 재분석 요청 빈도로 확정한다.
    min-interval: PT10M
    # 같은 매물을 다른 요청이 분석 중일 때 기다리는 상한. 넘으면 503. 미확정 — 락 만료와 같게 잠정 30초로 둔다.
    # T7(2026-09-27)에서 이 값에 걸린 경합 없음(배치 재분석 236건 · 건너뜀 0 · 실패 0) — 유지. 실 등기 연동이 정해지면 확정한다.
    lock-wait-timeout: PT30S
    # 기다리는 동안 락을 다시 시도하는 간격.
    lock-poll-interval: PT0.2S
    # 매물 분석 락(risk:analysis:lock:{propertyId}) 만료. 잡은 인스턴스가 죽어도 이 시간 뒤 풀린다. 등기 재조회와 분석이
    # 끝나기에 충분해야 한다 — 짧으면 실행 중에 풀려 등기를 두 번 뗀다. 미확정 — 잠정 30초로 둔다.
    # T7(2026-09-27) 배치가 3,849건을 31초에 끝냈다(매물당 수 ms, mock 등기) — 유지. 실 등기 연동의 지연으로 확정한다.
    lock-lease-time: PT30S
  # 판정 기준표 슬롯 캐시(위험도 기준 JudgementCriteriaCache · 대출 기준 LoanCriteriaCache) — 아키텍처 설계서(성능) 1.3. 기준이 바뀐
  # 슬롯은 커밋 뒤 버전 키(criteria:version, 두 캐시 공용)를 올리고, 다른 슬롯은 아래 간격으로 그 키를 읽어 바뀌었으면 두 캐시를
  # 다시 읽는다(CriteriaVersionWatcher). 요청 경로는 Redis 를 부르지 않는다 — 저장된 판정의 지문이 다를 때 아래 간격에 한 번 확인하는
  # 것만 예외다.
  # 측정으로 정하는 값이 아니라 설계 값이다(#399 승인). 기준 변경은 관리자 수동 · 대출 금리 월 1회라 드물다.
  criteria-cache:
    # 버전 키 확인 간격 — 반복 작업의 간격이자 요청 경로 확인의 슬롯당 최소 간격. 1초 — 다른 슬롯의 기준 변경이 이 슬롯 응답에
    # 늦게 닿는 상한이다. 슬롯 넷이면 Redis GET 이 초당 4회(지문 불일치 요청이 있으면 많아야 그 두 배)라 Redis 부담은 없는 것과 같다. 고정 지연이라 Redis 가 느려(spring.data.redis.timeout 2초) 한 번이 길어져도 겹쳐 쌓이지 않는다.
    version-check-interval: PT1S
    # 버전 키와 무관하게 다시 읽는 간격 — 안전망. 10분 — Redis 가 끊겨 버전 키를 못 올린 변경이 다른 슬롯에 닿는 상한이다. 한 번이
    # 기준표 읽기(두 캐시 합쳐 질의 열 안팎)라 더 짧게 해도 되지만, 이 경로는 Redis 장애 중 수정이라는 드문 경우만 덮는다.
    full-reload-interval: PT10M
  # 관심 매물 등기 재조회 배치(RISK-08). 매물 락은 위 lock-lease-time 을 함께 쓰고 기다리지 않는다(경합이면 건너뜀).
  batch:
    registry-refresh:
      # 스케줄 빈을 띄울지. 테스트 실행에서는 build.gradle 이 false 로 덮는다.
      enabled: true
      # 실행 시각(서울). 미확정 — 저부하 시간대로 03:00. T7(2026-09-27, 배경 25 RPS)에서 확인해 유지 — 대상 3,849건이 31초, 그동안 조회 p95 +25% 뒤 회복(용량 산정 리포트). 등기 연동이 mock 인 조건이라 **실 연동이 정해지면 다시 확정한다.**
      # 시험 때는 노드 .env 의 RISK_BATCH_REGISTRYREFRESH_CRON 으로 덮는다(끝나면 지운다).
      cron: "0 0 3 * * *"
      # 대상 매물 식별자를 한 번에 읽는 건수이자 배치 스텝의 청크 크기. 미확정 — 500건. 위 T7 에서 확인해 유지, 실 연동 때 다시 확정.
      page-size: 500
      # 날짜 락(risk:batch:registry-refresh:{yyyy-MM-dd}) 만료. 잡은 인스턴스가 죽었을 때만 쓰인다 — 끝나면 해제하고, 도는
      # 동안은 아래 연장 간격마다 이 길이로 다시 늘린다. 2분 — 프로세스가 죽은 뒤(배포 · OOM 이면 해제가 돌지 않는다) 길어야
      # 2분이면 풀려, 같은 날 기동 뒤 따라잡기가 다시 잡는다. 측정으로 정하는 값이 아니라 설계 값이다(#340 승인). 배포 · 장애에서
      # 락이 늦게 풀리거나 연장이 끊기는 것이 관찰되면 다시 정한다.
      lock-lease-time: PT2M
      # 날짜 락 연장 간격. 40초 — 만료의 1/3 이다. 연장은 앞 연장이 끝난 뒤 간격을 세므로(고정 지연) 한 번 놓쳐도 다음 연장이
      # 만료 전에 닿아 유지되고, 두 번 놓치면 풀린다. 설계 값이다(#340 승인). 배포 · 장애에서 락이 늦게 풀리거나 연장이 끊기는
      # 것이 관찰되면 다시 정한다.
      lock-renew-interval: PT40S
    # Mock 대장 교체(PROP-04) — real 연동 전에 저장된 data_source=MOCK 대장을 건축HUB 대장으로 바꾸고(못 떼면 지우고) 재분석한다.
    # 대장 행이 없고 조회 키가 있는 매물도 떼어 새로 저장해 본다(못 떼면 그대로 둔다). 관심 매물(Mock · 대장 없음) → Mock 전체 →
    # 대장 없음 전체, 단계마다 식별자 순이며 external.building-ledger.daily-limit 이 남는 만큼만 하고 닿으면 그날 끝낸다.
    # 매물 락은 위 risk.reanalyze.lock-lease-time 을 함께 쓰고 기다리지 않는다(경합이면 건너뜀).
    mock-ledger-replace:
      # 스케줄 빈을 띄울지. external.building-ledger.mode=real 일 때만 뜬다. 테스트 실행에서는 build.gradle 이 false 로 덮는다.
      enabled: true
      # 실행 시각(서울). 미확정 — 04:30. 00:30 매물 갱신 · 03:00 등기 재조회 · 매월 2일 04:00 대출 금리 갱신과 백업 시각
      # (매일 02:00 · 일 01:00 · 01:30 — 플랫폼 설계서 7.2 작업표)을 피한 자리다. 00:30 매물 갱신의 신규 매물 판정이 먼저 상한을
      # 쓰고 남은 몫을 이 배치가 쓴다. 회차 소요(상한 9,000 요청)를 잰 적이 없다 — 운영 회차로 확정한다.
      cron: "0 30 4 * * *"
      # 대상 매물 식별자를 한 번에 읽는 건수이자 스텝의 청크 크기. 미확정 — 등기 재조회 배치와 같게 잠정 500건.
      page-size: 500
      # 날짜 락(risk:batch:mock-ledger-replace:{yyyy-MM-dd}) 만료. 잡은 인스턴스가 죽었을 때만 쓰인다 — 끝나면 해제하고, 도는
      # 동안은 아래 연장 간격마다 이 길이로 다시 늘린다. 2분 — 프로세스가 죽은 뒤(배포 · OOM 이면 해제가 돌지 않는다) 길어야
      # 2분이면 풀려, 같은 날 기동 뒤 따라잡기가 다시 잡는다. 측정으로 정하는 값이 아니라 설계 값이다(#340 승인). 배포 · 장애에서
      # 락이 늦게 풀리거나 연장이 끊기는 것이 관찰되면 다시 정한다.
      lock-lease-time: PT2M
      # 날짜 락 연장 간격. 40초 — 만료의 1/3 이다. 연장은 앞 연장이 끝난 뒤 간격을 세므로(고정 지연) 한 번 놓쳐도 다음 연장이
      # 만료 전에 닿아 유지되고, 두 번 놓치면 풀린다. 설계 값이다(#340 승인). 배포 · 장애에서 락이 늦게 풀리거나 연장이 끊기는
      # 것이 관찰되면 다시 정한다.
      lock-renew-interval: PT40S

# 하루 한 번 도는 위험도 배치(매물 갱신 · 등기 재조회 · Mock 대장 교체)의 기동 뒤 따라잡기(DailyBatchCatchUpRunner).
# 노드를 작업할 때만 켜는 운용이라 예약 시각에 꺼져 있으면 그날 회차가 빠진다 — 기동 뒤 한 번, 오늘(서울) 성공 기록
# (Redis batch:last-success:{배치})이 없는 배치만 순서대로 돌린다. 각 배치의 enabled · 연동 모드 조건은 그대로 따른다.
# @Scheduled 스레드 풀(spring.task.scheduling.pool.size)이 아니라 가상 스레드에서 돌아 예약 실행 · 하트비트를 막지 않는다.
batch:
  startup-catchup:
    # 켤지. 테스트 실행에서는 build.gradle 이 false 로 덮는다.
    enabled: true
    # 「다른 인스턴스가 실행 중」(날짜 락 경합)으로 건너뛴 배치를 다시 확인하는 간격. 오늘 성공 기록이 생기거나 · 락을 잡아
    # 돌렸거나 · 날짜(서울)가 바뀌면 멈춘다. 실패로 끝난 배치는 다시 돌지 않는다. 5분 — 날짜 락 만료(2분)보다 길어 죽은
    # 프로세스가 남긴 락은 한 번의 재시도로 넘어간다. 측정으로 정하는 값이 아니라 설계 값이다(#340 승인). 배포 · 장애에서 락이
    # 늦게 풀려 재시도가 거듭되는 것이 관찰되면 다시 정한다.
    retry-interval: PT5M

# 대출 한도 조회(LOAN-01)의 금리 · 상품 한도 입력 — 대출 상품(loan_product).
loan:
  product:
    # HF 금리 API 로 넣는 행의 상품 한도(원). 한국주택금융공사 일반전세자금보증 「보증과목별 보증한도 : 4억원」
    # (https://www.hf.go.kr/ko/sub02/sub02_01_02.do, 확인일 2026-09-30). loan_regulation.guarantee_cap_no_house(V10)와 같은 출처의
    # 같은 값이다 — HF 보증 대출의 한도가 곧 보증 한도다. HF 가 한도를 바꾸면 둘을 함께 바꾼다.
    hf-max-limit: 400000000
  batch:
    # HF 전세자금대출 금리 갱신 — 실행일(서울)의 전달을 기준월로 은행별 금리를 받아 넣고 고친다.
    rate-refresh:
      # 스케줄 빈(월 1회 + 기동 뒤 1회)을 띄울지. 테스트 실행에서는 build.gradle 이 false 로 덮는다.
      # external.jeonse-loan-rate.mode 가 real 일 때만 뜬다 — mock 의 가상 은행 행이 DB 에 들어가지 않게(LoanRateRefreshScheduler).
      enabled: true
      # 실행 시각(서울). 미확정 — 매월 2일 04:00. 제공처가 월 집계를 언제 마감하는지 문서에 없다(업데이트 주기 「실시간」).
      # 1일은 전달 말일 실행분이 늦게 반영될 여지를 두고 하루 미뤘고, 04:00 은 다른 배치(00:30 매물 갱신 · 03:00 등기 재조회)와
      # 백업 시각(01:00 · 01:30 · 02:00)을 피한 자리다. 금리가 대출 실행 월 단위 집계라 월 1회다(데이터 적재 설계서 1.5).
      # 운영에서 기준월 데이터가 비어 오는지(실적 없음)를 보고 확정한다.
      cron: "0 0 4 2 * *"
      # 기준월 락(loan:batch:rate-refresh:{yyyy-MM}) 만료. 잡은 인스턴스가 죽었을 때만 쓰인다 — 끝나면 해제하고, 도는 동안은
      # 아래 연장 간격마다 이 길이로 다시 늘린다. 2분 — 프로세스가 죽은 뒤 길어야 2분이면 풀린다. 만료 뒤 다시 돌아도 자연키
      # 갱신이라 결과가 같다. 측정으로 정하는 값이 아니라 설계 값이다(#340 승인). 배포 · 장애에서 락이 늦게 풀리거나 연장이 끊기는
      # 것이 관찰되면 다시 정한다.
      lock-lease-time: PT2M
      # 기준월 락 연장 간격. 40초 — 만료의 1/3 이다. 연장은 앞 연장이 끝난 뒤 간격을 세므로(고정 지연) 한 번 놓쳐도 다음 연장이
      # 만료 전에 닿아 유지되고, 두 번 놓치면 풀린다. 설계 값이다(#340 승인). 배포 · 장애에서 락이 늦게 풀리거나 연장이 끊기는
      # 것이 관찰되면 다시 정한다.
      lock-renew-interval: PT40S

# @Async 실행기(알림 생성 · 발송). 설정 클래스 AsyncConfig.
async:
  # 앱 종료 때 실행 중인 작업을 기다리는 상한. 넘으면 남은 작업은 끊긴다.
  # 미확정 — 잠정 30초. 5주차 부하 시험에서 확정한다.
  termination-timeout: PT30S

# 관심 매물 모니터링 알림 생성(NOTI-02) — 아키텍처 설계서(알림 전달) 1.1.
notification:
  # 중복 방지 키(noti:dedup:{userId}:{type}:{propertyId}:{afterValue}) 만료. 같은 변동이 재분석 · 일 1회 점검 배치에서 겹쳐
  # 들어오는 것을 막는 창이라 배치 주기와 같게 둔다. 미확정 — 근거 문서가 없어 잠정 24시간이다. 5주차 부하 시험에서 확정한다.
  dedup-ttl: PT24H
  create:
    # 같은 매물의 알림 생성 락(noti:create:{propertyId}) 대기 상한. 위험 등급 변경과 등기 변동이 한 재분석에서 함께 나오면
    # 뒤 이벤트가 앞 생성을 기다린다 — 건너뛰면 한쪽 알림이 빠진다. 넘으면 생성 실패로 기록만 한다.
    # 미확정 — 잠정 10초. T7(2026-09-27)에서 따로 재지 않았다 — 알림 생성 실패 기록으로 운영 뒤 확정한다.
    lock-wait-timeout: PT10S
    lock-poll-interval: PT0.1S
    # 락 만료. 대상 사용자 전원의 저장이 끝나기에 충분해야 한다. 미확정 — 잠정 10초. 5주차 부하 시험에서 확정한다.
    lock-lease-time: PT10S
  # 실시간 수신(NOTI-03) — API 명세서(알림) 1.1.
  sse:
    # 연결 수명의 상한. 액세스 토큰 유효 시간과 같게 둔다 — 연결이 로그인 세션보다 오래 살아 있지 않게 하고, 클라이언트는
    # 새 티켓으로 재연결한다. 값을 따로 적지 않고 토큰 설정을 가리킨다.
    timeout: ${jwt.access-token-validity}
    # 연결을 여는 일회용 티켓의 수명(API 명세서 알림 1.1). 티켓은 발급 응답을 받은 즉시 EventSource 가 연다 —
    # 왕복 한 번을 버틸 길이만 있으면 된다. 느린 모바일 망과 재시도 한 번을 감안해 30초로 둔다. 더 길면 접근 로그에
    # 남은 티켓의 유효 시간이 길어지고, 더 짧으면 정상 연결이 망 상태에 따라 실패한다.
    ticket-ttl: PT30S
    # 하트비트 주석 이벤트 간격. 프록시 · 브라우저가 이벤트 없는 연결을 유휴로 끊지 않게 한다. 미확정 — 흔히 쓰는 30초 유휴
    # 제한보다 짧게 잠정 25초로 둔다. 5주차 부하 시험(SSE 동시 연결)에서 확정한다.
    heartbeat-interval: PT25S

# 비밀번호 재설정(USER-06) — API 명세서(회원) 1.3.
# 도메인 이름(user)으로 묶지 않는다 — user.* 는 JVM 시스템 속성(user.dir · user.home)의 이름공간이라 읽는 사람이 헷갈린다.
password-reset:
  # 토큰 수명. 명세 1.3 이 30분으로 정했다(OWASP Forgot Password Cheat Sheet 권고 범위 안). 메일 본문의 안내 문구도 이 값을 읽는다.
  token-ttl: PT30M
  # 같은 계정으로 메일을 다시 보내기까지의 간격. 명세 1.3 이 60초로 정했다 — 메일 폭탄 방지의 최소치로 잡은 잠정값이며
  # 운영 관찰로 조정한다(이슈 #146 계획).
  send-interval: PT60S
  # 메일 링크의 화면 기준 주소. 링크는 <이 값>/password-reset/confirm?token=<토큰> 이다. 기본은 로컬 Vite 개발 서버다.
  link-base-url: ${APP_BASE_URL:http://localhost:5173}

# 토큰 만료 시간은 비밀도 환경 차이도 아니므로 환경 변수로 두지 않는다(.env.example 말미).
# access-token-validity 는 로그인 응답의 expiresIn 과 같은 값이다 — API 명세서(회원·인증) 1.2.
jwt:
  # 기본값을 두지 않는다. 주입을 빠뜨린 채 앱이 뜨면 서명 키가 조용히 고정된다.
  # HS256 은 256비트 이상을 요구하므로 32바이트 미만이면 기동 시점에 실패한다.
  secret: ${JWT_SECRET}
  access-token-validity: 1800s
  refresh-token-validity: 14d

# 비밀번호 해시 · 대조(BCrypt)의 동시 실행 상한(#408) — BoundedPasswordEncoder. 가입 · 로그인 · 비밀번호 재설정이 같은 인코더라 셋에 함께
# 걸린다. 비용(강도)은 그대로 둔다 — 보안 하한 10(보안 · 암호화 설계서 4.2). 허가는 슬롯마다 따로 센다(프로세스 지역 자원).
# 근거: #390 — 로그인 단독 한계 약 30 TPS(슬롯 넷 합). R05(로그인 몰림)에서 p95 3.6 s · app-01 CPU 95 % · BCrypt 구간 평균 779 ms 로,
# 몰리지 않은 U19(로그인 · 로그아웃 짝)의 BCrypt 구간 평균 43 ms 의 18배였다 — 상한 없이 동시 해싱 수가 Tomcat 스레드 수(50)까지 늘어
# CPU 를 나눠 쓴 결과다. 같은 슬롯의 다른 요청도 그 CPU 를 다툰다.
auth:
  password-hashing:
    # 슬롯당 동시 해싱 수. 2 — 앱 노드가 vCPU 둘이고 슬롯이 둘이다(운영 Compose). 슬롯 하나가 노드의 vCPU 둘을 다 쓸 수는 있게 두되
    # 그 이상은 CPU 를 나눠 쓸 뿐 처리량이 늘지 않는다 — BCrypt 는 CPU 만 쓴다. 노드 합은 4 라 한 노드의 두 슬롯이 함께 몰리면 해싱만으로
    # CPU 가 찬다. 잠정 — 다음 부하 시험(로그인 몰림 중 다른 조회 p95)에서 1 과 비교해 확정한다.
    max-concurrent: 2
    # 허가를 기다리는 상한. 넘으면 503 SERVICE_BUSY(API 공통 명세 2장) — 클라이언트가 다시 시도한다. 0.5초 — 몰리지 않은 대조 한 번이
    # 43 ms(위 U19)라 허가 둘이 앞선 대기 열 몇 건을 비울 시간이다. 길게 두면 넘치는 부하가 대기로 쌓여 응답 시간만 늘고 요청 스레드가
    # 묶인다(R05 의 p95 수 초). 가입 · 재설정은 트랜잭션 안에서 해시하므로 이 대기만큼 커넥션을 더 쥔다 — 짧게 두는 또 하나의 이유다.
    # 잠정 — 위와 같은 시험에서 확정한다.
    max-wait: PT0.5S

# 외부 연동. 인증키 이름은 데이터 적재 설계서 1.3 표가 정본이고 값은 .env 에 둔다.
# mode 는 비밀도 환경 차이도 아니라 여기에 적는다. 세 구현 중 무엇이 뜨는지를 고른다.
#   mock  — 고정 정상 응답. 기본값이다. 키가 없어도 돌고 외부로 나가지 않는다
#   real  — 실제 호출. 활용 신청이 승인된 뒤에만 쓴다
#   fault — 지연 · 오류 주입. 서킷 · 폴백 경로 확인용
# 바꿀 때는 기동 인자로 덮는다 — --external.rent-transaction.mode=real --external.sale-transaction.mode=real
external:
  rent-transaction:
    mode: mock
    # 국토교통부 전월세 실거래가. 아파트 · 오피스텔은 같은 호스트의 다른 서비스이며 활용 신청은 각각이다.
    base-url: https://apis.data.go.kr/1613000
    api-key: ${DATA_GO_KR_API_KEY:}
    # 타임아웃은 미확정이다. 어느 설계 문서도 대상별 값을 정하지 않았다.
    # 아래는 잠정치이며 예비 부하 측정에서 확정되면 바꾼다.
    connect-timeout: 2s
    read-timeout: 10s
    # Fault 구현이 읽는다. mode 가 fault 일 때만 쓰인다.
    #   error   — 즉시 실패. 연속 실패로 서킷이 열리는지 본다
    #   delay   — delay 만큼 지연한 뒤 정상 응답
    #   timeout — 읽기 타임아웃. delay 와 read-timeout 중 짧은 쪽이 지나면 실패한다
    fault:
      kind: error
      delay: 10s
  # 국토교통부 매매 실거래가(아파트 매매 상세 · 오피스텔 매매). 매물 시세(market_price) 표본이다.
  # 전월세와 같은 호스트 · 같은 인증키(인코딩 키 그대로)이며 활용 신청은 서비스마다 각각이다.
  # 서킷 · 재시도는 전월세와 따로 둔다 — 한쪽 서비스의 장애가 다른 쪽 서킷을 열지 않게.
  sale-transaction:
    mode: mock
    base-url: https://apis.data.go.kr/1613000
    api-key: ${DATA_GO_KR_API_KEY:}
    # 타임아웃은 미확정이다. 전월세와 같은 제공처라 같은 잠정치를 둔다. 예비 부하 측정에서 확정되면 바꾼다.
    connect-timeout: 2s
    read-timeout: 10s
    fault:
      kind: error
      delay: 10s
  address-normalize:
    mode: mock
    base-url: https://business.juso.go.kr
    api-key: ${ADDRESS_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
    fault:
      kind: error
      delay: 10s
  geocode:
    mode: mock
    base-url: https://dapi.kakao.com
    api-key: ${KAKAO_REST_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
    fault:
      kind: error
      delay: 10s
  # 등기부등본. 개방 API 가 없어 Mock 만 있다(데이터 적재 설계서 1.3). 중계 서비스가 정해지기 전에는
  # real · fault 구현이 없으므로 mock 외의 값을 주면 구현 빈이 없어 기동이 실패한다.
  # 기본 URL · 키 · 타임아웃 · 서킷 인스턴스도 Real 이 붙는 변경에서 더한다.
  registry:
    mode: mock
  # 국토교통부 건축HUB 건축물대장정보(표제부). 실거래가와 같은 호스트 · 같은 인증키(인코딩 키 그대로)다.
  # Mock 은 판정 분기를 돌리려고 지어낸 대장(위반건축물 5% 등)이라 테스트 · 로컬 전용이다. 운영은 real 을 제안한다 —
  # 여기 기본값은 mock 으로 두고(키 없는 환경에서 외부로 새지 않게) 운영에서 기동 인자 · 환경 변수로 덮는다.
  # real 은 매물의 대장 조회 키(V17)로 조회한다. 키가 없는 매물(V17 이전 적재 · 산 지번 · Mock 주소 정규화로 적재)은 대장을
  # 떼지 못한다 — 기존 매물의 키는 갱신 배치가 채운다.
  # 타임아웃은 미확정이다. 실거래가와 같은 제공처라 연결은 같은 잠정치를, 읽기는 기존 잠정치(Fault timeout 모드도 읽는다)를 둔다.
  building-ledger:
    mode: mock
    base-url: https://apis.data.go.kr/1613000/BldRgstHubService
    api-key: ${DATA_GO_KR_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
    # Real 이 제공처에 보내는 요청(표제부 한 페이지)의 하루(서울 날짜) 상한 — BuildingLedgerDailyQuota. 사용자 조회와 Mock 대장 교체
    # 배치가 같은 카운터를 쓴다. 닿으면 부르지 않고 대장 없이 판정한다(503 · 서킷 실패가 아니다).
    # 미확정 — 9,000. 사용자가 확인한 계정의 일일 트래픽 10,000(2026-09-30)에서 재시도 · 다른 경로의 몫을 남겨 둔 잠정치다. 제공처
    # 문서에서 계정 한도를 확인하면 그 값과 운영 호출 수(카운터 키 external:building-ledger:daily-calls:{yyyy-MM-dd})로 확정한다.
    daily-limit: 9000
    # Real 이 제공처에 보내는 요청의 초당 상한 — BuildingLedgerRateLimiter. 앱 슬롯 넷이 Redis 카운터
    # (external:building-ledger:per-second:{epochSecond}, 만료 2초)를 나눠 쓴다. 이번 초의 몫이 없으면 다음 초까지 기다린다.
    # 미확정 — 5. 제공처의 초당 한도 값은 확인한 문서가 없다. 2026-09-30 운영에서 초당 한도 초과 응답
    # (LIMITED_NUMBER_OF_SERVICE_REQUESTS_PER_SECOND_EXCEEDS_ERROR)을 받아 둔 잠정치다. 제공처 문서 · 운영 한도 응답 빈도로 확정한다.
    per-second-limit: 5
    # 초당 몫을 기다리는 시간의 합 상한. 넘으면 이번 조회는 대장 없이 판정한다(일일 상한과 같은 처리). 사용자 조회 스레드가
    # 기다리는 시간이다. 미확정 — 잠정 3초. 운영 응답 시간 · 포기 빈도로 확정한다.
    per-second-max-wait: 3s
    fault:
      kind: error
      delay: 10s
  # 한국주택금융공사 전세자금대출 금리(LOAN-01 대출 상품 금리). 전월세 실거래가와 같은 인증키이며 활용 신청은 따로다.
  # 제공처 문서 https://www.data.go.kr/data/15082044/openapi.do — 개발계정 일 1,000건. 회차당 호출은 매물 유형 둘 × 1페이지.
  jeonse-loan-rate:
    mode: mock
    base-url: https://apis.data.go.kr/B551408
    api-key: ${DATA_GO_KR_API_KEY:}
    # 타임아웃은 미확정 잠정치 — 전월세 실거래가와 같게 둔다.
    connect-timeout: 2s
    read-timeout: 10s
    fault:
      kind: error
      delay: 10s

  # 메일 발송(USER-06 비밀번호 재설정). HTTP 연동이 아니라 기본 URL · 키가 없고, SMTP 접속 정보는 spring.mail 이 갖는다.
  #   mock  — 보내지 않고 링크를 로그로 남긴다. 토큰 원문이 로그에 남으므로 로컬 전용이다
  #   real  — spring.mail 의 SMTP 로 보낸다. 운영은 real 로 띄운다
  #   fault — 지연 · 오류 주입. 서킷 · 폴백 경로 확인용. 링크를 로그에 남기지 않는다
  mail:
    mode: mock
    # 보내는 주소. Gmail 은 로그인 계정 또는 그 계정에 등록된 별칭이어야 한다.
    from: ${MAIL_FROM:}
    # Fault 의 timeout 모드가 읽는다. spring.mail.properties.mail.smtp.timeout 과 같게 둔다(미확정 잠정치).
    read-timeout: 5s
    fault:
      kind: error
      delay: 10s

# 외부 한 곳의 장애가 전체를 멈추게 하지 않기 위한 격리. 인스턴스 이름은 연동 인터페이스의
# RESILIENCE_INSTANCE 상수와 같아야 한다 — 이름이 어긋나면 애노테이션이 조용히 기본 설정으로 돈다.
# Real 과 Fault 가 같은 인스턴스를 쓴다. 이름이 구현마다 다르면 Fault 로 연 서킷이 Real 의 것과
# 다른 서킷이 되어 확인한 것이 확인한 것이 아니게 된다.
#
# ※ 아래 임계값은 전부 미확정이다. 실패율 · 열린 상태 유지 시간 · 재시도 횟수를 정한 문서가 없다.
#   1주차 예비 부하 측정에서 확정하고, 확정되면 그 수치를 설계 문서에 먼저 적는다.
# ※ 서킷 기본 지표는 resilience4j-spring-boot4 2.4.0 의 CircuitBreakerMetricsAutoConfiguration 이 전이 의존
#   resilience4j-micrometer 로 레지스트리에 묶어 /actuator/prometheus 에 낸다(resilience4j_circuitbreaker_state 등, name 라벨이
#   연동 인터페이스의 RESILIENCE_INSTANCE). 서킷 상태는 이 기본 지표를 쓰고 커스텀 지표를 따로 만들지 않는다 — 기술 스택 정의서 2장(#220).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      rentTransaction:
        base-config: default
      saleTransaction:
        base-config: default
      addressNormalize:
        base-config: default
      geocode:
        base-config: default
      # 초당 한도(BuildingLedgerRateLimitedException)는 장애가 아니다 — 실패로 세지 않는다. 2026-09-30 14:29 초당 한도 응답을
      # 실패로 세어 서킷이 열리고 전 조회가 503 이 됐다.
      buildingLedger:
        base-config: default
        ignore-exceptions:
          - com.duri.rentalplatform.external.buildingledger.BuildingLedgerRateLimitedException
      jeonseLoanRate:
        base-config: default
      # 메일 발송. 재시도 인스턴스는 두지 않는다 — 발송은 멱등하지 않다(MailClient 주석).
      mail:
        base-config: default
  retry:
    configs:
      default:
        # 조회(멱등)만 재시도한다. 아래 연동은 모두 조회다.
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      rentTransaction:
        base-config: default
      saleTransaction:
        base-config: default
      addressNormalize:
        base-config: default
      geocode:
        base-config: default
      # 초당 한도는 다시 보내지 않는다 — 이번 조회는 대장 없이 진행한다(RealBuildingLedgerClient).
      buildingLedger:
        base-config: default
        ignore-exceptions:
          - com.duri.rentalplatform.external.buildingledger.BuildingLedgerRateLimitedException
      jeonseLoanRate:
        base-config: default
