spring:
  application:
    name: rental-platform
  config:
    # 저장소 루트의 .env 를 읽는다. 앱과 Gradle 테스트의 작업 디렉터리가 backend/ 라 상대 경로는 ../.env 다.
    # Boot 에는 dotenv 기능이 없으므로 [.properties] 확장자 힌트로 properties 처럼 읽힌다.
    # optional: 은 필수다 — CI 와 컨테이너에는 이 파일이 없다. 운영에서는 실제 환경 변수가 이 파일을 이긴다.
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:rental}
    username: ${POSTGRES_USER:rental}
    password: ${POSTGRES_PASSWORD:rental}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true

# 조회 전용 매퍼 설정. 쓰기는 JPA 가 담당한다 — 아키텍처 설계서(영속성 구조) 1.1.
# 키 이름은 mybatis-spring-boot-autoconfigure 4.1.0 의 spring-configuration-metadata.json 에서 확인했다.
mybatis:
  # 매퍼 XML 은 resources/mapper/<도메인>/ 에 둔다 — 같은 문서 1.1.
  # classpath* 로 둔다. classpath 는 루트 mapper/ 를 클래스패스에서 한 곳만 찾으므로,
  # 테스트에서는 test/resources 가 앞서 프로덕션 매퍼 XML 전체가 조용히 무시된다.
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 스네이크 컬럼(users.annual_income) → 카멜 필드(annualIncome). 기본값은 false 다.
    # 컬럼은 소문자 스네이크, JSON 필드는 소문자 카멜 — 코딩 규칙 문서.
    map-underscore-to-camel-case: true
    # 조회 DTO 는 record 다. setter 가 없으므로 MyBatis 가 생성자로 값을 넣어야 하는데,
    # 기본 동작은 생성자 인자를 "순서"로 맞춘다 — 필드를 하나 끼워 넣으면 조용히 틀린다.
    # true 로 두면 인자 "이름"으로 맞추므로 평면 DTO 는 <constructor> XML 없이 받는다.
    # 인자 이름을 런타임에 읽는 조건인 -parameters 는 Spring Boot Gradle 플러그인이 이미 붙인다.
    arg-name-based-constructor-auto-mapping: true

# 토큰 만료 시간은 비밀도 환경 차이도 아니므로 환경 변수로 두지 않는다(.env.example 말미).
# access-token-validity 는 로그인 응답의 expiresIn 과 같은 값이다 — API 명세서(회원·인증) 1.2.
jwt:
  # 기본값을 두지 않는다. 주입을 빠뜨린 채 앱이 뜨면 서명 키가 조용히 고정된다.
  # HS256 은 256비트 이상을 요구하므로 32바이트 미만이면 기동 시점에 실패한다.
  secret: ${JWT_SECRET}
  access-token-validity: 1800s
  refresh-token-validity: 14d
