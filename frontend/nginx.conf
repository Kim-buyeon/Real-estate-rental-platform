# 프론트 이미지 안의 정적 파일 서버. 요청 분산 · /api 전달은 앞단 Nginx(infra/nginx/)가 맡는다.
server {
    listen 80;
    root /usr/share/nginx/html;

    # 클라이언트 라우팅(/map · /me/...) — 없는 경로는 index.html 로 돌려 라우터가 그리게 한다
    location / {
        try_files $uri /index.html;
    }

    # 빌드 산출물은 파일명에 해시가 붙어 내용이 바뀌면 이름이 바뀐다 — 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 새 배포의 해시 파일명을 가리켜야 하므로 캐시하지 않는다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
