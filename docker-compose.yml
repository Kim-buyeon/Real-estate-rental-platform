# 로컬 구성 — 개발 환경 설계서 1.1. 저장소 루트에서 실행한다.
#
#   docker compose up -d                    전부(PostgreSQL · Redis · 앱 · 화면 · 앞단 Nginx) → http://localhost:5173
#   docker compose up -d postgres redis     PostgreSQL · Redis 만 — 백엔드를 IDE · bootRun 으로 띄울 때
#   docker compose stop nginx web           화면 개발 — 멈춘 뒤 npm run dev(Vite 프록시 → 호스트 8080)
#     nginx 와 npm run dev 는 둘 다 5173 이라 동시에 켜지 않는다. app 은 호스트 포트가 없으므로 이때 백엔드도
#     IDE · bootRun(호스트 8080)으로 띄운다.
#
# 값은 루트 .env 에서 읽는다(.env.example). 운영 구성(2슬롯 · 점검 모드)은 이 파일이 아니다 — infra/docker-compose.yml.
name: rental

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 호스트 루프백에만 연다 — 호스트의 DB 클라이언트 · bootRun 이 쓴다
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 비밀번호가 비어 있으면 인증 없이 뜬다(로컬). 값이 있으면 requirepass 로 건다
    command: ["sh", "-c", "exec redis-server $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    image: rental-backend:local
    env_file: .env
    # .env 의 DB_HOST · REDIS_HOST 는 호스트 기준(localhost)이다. 컨테이너 안에서는 서비스 이름으로 덮는다
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    # 호스트 포트를 열지 않는다 — 앞단 nginx 가 Compose 네트워크로 닿는다. 호스트 8080 은 IDE 백엔드 자리다
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY}
    image: rental-frontend:local
    # 정적 파일만 서빙한다. 호스트 포트 없이 앞단 nginx 뒤에 둔다

  # 앞단 — 운영과 같은 이미지 · nginx.conf(main · http 문맥), 서버 블록만 로컬용(infra/nginx/local/)
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/local:/etc/nginx/conf.d:ro
    depends_on:
      - app
      - web

volumes:
  pgdata:
